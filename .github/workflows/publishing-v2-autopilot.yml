name: Agentic daily and local packages
on:
  push:
    branches: [main]
    paths:
      - 'autopilot-trigger.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: Shadow review or live publishing (requires recent shadow passes)
        type: choice
        options: [shadow, live]
        default: shadow
      lane:
        description: Package selection
        type: choice
        options: [daily, local]
        default: daily
      selection:
        description: Repository path to the free evidence brief (no paid selection fallback)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  packages:
    if: github.repository == 'khalidonline/daily-news-snap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bounded video tooling
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Install established renderer dependencies
        run: python -m pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Verify agents and publishing safeguards without paid calls
        env:
          FONT_FAMILY: Almarai
          THEME: light
        run: python -m unittest discover -s tests -p 'test_v2_*.py' -q
      - name: Verify shared budget guard
        run: python -m unittest tests.test_daily_budget.DailyBudgetTests tests.test_daily_budget.NativeAgentBudgetTests tests.test_daily_budget.GitHubStoreTests -q
      - name: Resolve shadow or live promotion
        id: route
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LANE: ${{ inputs.lane }}
        run: |
          python - <<'PY'
          import json, os
          event = os.environ.get('GITHUB_EVENT_NAME', '')
          mode = (os.environ.get('INPUT_MODE') or 'shadow') if event != 'push' else 'shadow'
          lane = (os.environ.get('INPUT_LANE') or 'daily') if event != 'push' else 'daily'
          if event == 'push' and os.environ.get('HEAD_COMMIT_MESSAGE', '').startswith('automation: promote daily autopilot live'):
              mode = 'live'
          if lane not in {'daily', 'local'} or mode not in {'shadow', 'live'}:
              raise ValueError('single_lane_required')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'mode={mode}\nlane={lane}\n')
          print(json.dumps({'mode': mode, 'lane': lane}))
          PY
      - name: Run coordinated editorial agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_BUDGET_GITHUB_TOKEN: ${{ secrets.DAILY_BUDGET_GITHUB_TOKEN || github.token }}
          AUTOPILOT_SELECTION_PATH: ${{ inputs.selection }}
          AUTOPILOT_MODE: ${{ steps.route.outputs.mode }}
          # Temporary requested cap; runtime clamps to $3 from 2026-09-24 Saudi time.
          AUTOPILOT_DAILY_LIMIT_MICRO_USD: '3000000'
          # Reduce one role first; preserve writing/research and independent review quality.
          AUTOPILOT_EDITOR_MODEL: 'claude-sonnet-5'
          AUTOPILOT_RESEARCHER_MODEL: 'claude-opus-5'
          AUTOPILOT_WRITER_MODEL: 'claude-opus-5'
          AUTOPILOT_VISUAL_MODEL: 'claude-sonnet-5'
          AUTOPILOT_REVIEWER_MODEL: 'claude-sonnet-5'
          AUTOPILOT_LANE: ${{ steps.route.outputs.lane }}
          POST_TO_SNAPCHAT: ${{ steps.route.outputs.mode == 'live' && '1' || '0' }}
          DRY_RUN: ${{ steps.route.outputs.mode == 'live' && '0' || '1' }}
        run: |
          python -m publishing_v2.autopilot.runtime --mode "$AUTOPILOT_MODE" --lane "$AUTOPILOT_LANE"
      - name: Save owner review sheet
        # Owner reviews the first packages in chat before publication; set repository
        # variable AUTOPILOT_OWNER_REVIEW=0 to end the review phase.
        if: always() && steps.route.outputs.mode == 'shadow'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOPILOT_OWNER_REVIEW: ${{ vars.AUTOPILOT_OWNER_REVIEW || '1' }}
        run: python -m publishing_v2.autopilot.review_sheet
      - name: Send publication outcome
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOPILOT_REQUESTED_MODE: ${{ steps.route.outputs.mode }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m publishing_v2.autopilot.report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentic-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: autopilot-output/
          retention-days: 14
