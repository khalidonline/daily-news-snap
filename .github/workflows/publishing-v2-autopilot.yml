name: Agentic daily and local packages
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Shadow review or live publishing (requires recent shadow passes)
        type: choice
        options: [shadow, live]
        default: shadow
      lane:
        description: Package selection
        type: choice
        options: [both, daily, local]
        default: both
permissions:
  contents: read
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  packages:
    if: github.repository == 'khalidonline/daily-news-snap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bounded video tooling
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Install established renderer dependencies
        run: python -m pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Verify agents and publishing safeguards without paid calls
        run: python -m unittest discover -s tests -p 'test_v2_*.py' -q
      - name: Run coordinated editorial agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_BUDGET_GITHUB_TOKEN: ${{ secrets.DAILY_BUDGET_GITHUB_TOKEN || github.token }}
          AUTOPILOT_MODE: ${{ inputs.mode || vars.AUTOPILOT_MODE || 'live' }}
          # User-approved shared cap for production and trials; no automatic increase.
          AUTOPILOT_DAILY_LIMIT_MICRO_USD: '3000000'
          # Reduce one role first; preserve writing/research and independent review quality.
          AUTOPILOT_EDITOR_MODEL: 'claude-sonnet-5'
          AUTOPILOT_RESEARCHER_MODEL: 'claude-opus-5'
          AUTOPILOT_WRITER_MODEL: 'claude-opus-5'
          AUTOPILOT_VISUAL_MODEL: 'claude-opus-5'
          AUTOPILOT_REVIEWER_MODEL: 'claude-opus-5'
          AUTOPILOT_LANE: ${{ inputs.lane || 'both' }}
          POST_TO_SNAPCHAT: '0'
          DRY_RUN: '1'
        run: |
          # Owner approved $5 total for today's fresh review trial only.
          # Expired dates, live mode and other lanes retain the regular $3 cap.
          if [ "$(TZ=Asia/Riyadh date +%F)" = "2026-09-20" ] && [ "$AUTOPILOT_MODE" = "shadow" ] && [ "$AUTOPILOT_LANE" = "daily" ]; then
            export AUTOPILOT_DAILY_LIMIT_MICRO_USD=5000000
          fi
          python -m publishing_v2.autopilot.runtime --mode "$AUTOPILOT_MODE" --lane "$AUTOPILOT_LANE"
      - name: Send concise operational report
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m publishing_v2.autopilot.report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentic-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: autopilot-output/
          retention-days: 14
