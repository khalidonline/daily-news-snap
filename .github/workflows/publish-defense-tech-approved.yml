name: Publish approved defense tech package
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Repository path to the saved reviewed-package.json
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'khalidonline/daily-news-snap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: python -m pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Publish exact owner-approved defense package
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          AUTOPILOT_DAILY_LIMIT_MICRO_USD: '3000000'
          SAVED_MANIFEST: ${{ inputs.manifest }}
          POST_TO_SNAPCHAT: '1'
          DRY_RUN: '0'
        run: python publish_defense_tech_approved.py --mode publish --manifest "$SAVED_MANIFEST"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defense-tech-${{ github.run_id }}
          path: defense-package-output/
          retention-days: 14
