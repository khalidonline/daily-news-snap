name: Publish approved World Post Day
on:
  push:
    paths:
      - '.github/workflows/postal-approved-once-20261009.yml'
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Reconcile postal final result 20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 13c9cd49e56a8e2a8120db82f8c521318e6d5607
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Test publication safeguards
        run: |
          python -m unittest discover -s tests -p 'test_v2_bundle.py'
          python -m unittest discover -s tests -p 'test_v2_readability.py'
          python -m unittest discover -s tests -p 'test_v2_primary_images.py'
      - name: Verify quota and publish reviewed bytes
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVED_COMMIT: 13c9cd49e56a8e2a8120db82f8c521318e6d5607
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json,runpy
          from datetime import datetime,timezone
          from publishing_v2.bundle_api import BundleClient,GitHubJournal
          c=BundleClient();c.check()
          j=GitHubJournal('80b8e9f4b9dfd1f3fe332d8c13a6c8a71b06ab356beead2757d297336c000447')
          s=j.read();r=c.call('/post/'+s['1']['post_id'])
          assert r['teamId']==c.team
          print('FINAL_PROVIDER',json.dumps({k:r.get(k) for k in ['id','status','errors','externalData','data','deletedAt']}))
          s['1']['last_reconciliation']={'at':datetime.now(timezone.utc).isoformat(),'status':r['status'],'errors':r.get('errors'),'externalData':r.get('externalData')}
          j.save(s)
          if r['status']=='POSTED': runpy.run_path('approved/postal-20261009/publish-approved.py',run_name='__main__')
          PY
