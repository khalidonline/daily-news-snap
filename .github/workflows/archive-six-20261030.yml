name: Archive six owner-approved legacy stories only
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'khalidonline/daily-news-snap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-v2-images.txt pytest
      - name: Test restricted exception and archive guards
        run: python -m pytest tests/test_v2_archive_exception.py tests/test_v2_design_contract.py tests/test_v2_saved_story_api.py -q
      - name: Archive unchanged posted originals sequentially
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          POST_TO_SNAPCHAT: '1'
          DRY_RUN: '0'
        run: |
          for package in rice-20261026 oxford-20261027 global-entry-20261028 youtube-shopping-20261028 shubaily-20261029 twins-20261029; do
            python -m publishing_v2.saved_story_api --approval "approved/archive-six-20261030/$package/approval.json"
          done
