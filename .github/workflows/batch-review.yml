name: Batch story validation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batch-story-validation
  cancel-in-progress: false

env:
  DAILY_BUDGET_GITHUB_TOKEN: ${{ github.token }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout shared daily budget guard
        uses: actions/checkout@v4
        with:
          ref: main
          path: .daily-budget-source
          sparse-checkout: daily_budget.py
          sparse-checkout-cone-mode: false

      - name: Install shared $3 daily budget guard
        run: |
          python3 .daily-budget-source/daily_budget.py install --target "$RUNNER_TEMP/daily-budget"
          echo "PYTHONPATH=$RUNNER_TEMP/daily-budget" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt imageio-ffmpeg

      - name: Validate remaining repaired stories and send summary
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STORY_MODEL: "claude-opus-5"
          STORY_FRAMES: "6"
          STORY_ALLOW_REPEAT: "1"
          THEME: "light"
          BRAND: "ملخص تنفيذي - قصة"
          FONT_FAMILY: "Almarai"
          ALLOW_GENERATED: "0"
          ALLOW_STORY_GENERATION: "0"
          POST_TO_SNAPCHAT: "0"
          MEDIA_MODE: "github"
        run: python batch_review.py
