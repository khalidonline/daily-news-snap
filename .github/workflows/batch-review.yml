name: Batch story validation

on:
  workflow_dispatch:
    inputs:
      batch_stories:
        description: "Maximum paid story generations in this run"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
        default: "3"

permissions:
  contents: write

concurrency:
  group: batch-story-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt imageio-ffmpeg

      - name: Validate remaining repaired stories and send summary
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STORY_MODEL: "claude-sonnet-5"
          STORY_FRAMES: "6"
          STORY_ALLOW_REPEAT: "1"
          THEME: "light"
          BRAND: "ملخص تنفيذي - قصة"
          FONT_FAMILY: "Almarai"
          ALLOW_GENERATED: "0"
          ALLOW_STORY_GENERATION: "0"
          POST_TO_SNAPCHAT: "0"
          MEDIA_MODE: "github"
          BATCH_STORIES: ${{ inputs.batch_stories || '3' }}
          MODEL_BOT: "story"
          MODEL_USAGE_PATH: "out/model_usage.jsonl"
          MODEL_MAX_USD_PER_RUN: "2"
          STORY_MAX_PAID_RESPONSES: "3"
          VISION_MAX_PAID_RESPONSES: "24"
        run: python batch_review.py

      - name: Model cost summary
        if: always()
        run: python model_usage.py summarize --path out/model_usage.jsonl >> "$GITHUB_STEP_SUMMARY"

      - name: Keep model usage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-review-usage-${{ github.run_id }}
          path: out/model_usage.jsonl
          retention-days: 14
          if-no-files-found: ignore
