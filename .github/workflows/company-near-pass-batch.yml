name: Company near-pass visual repair

on:
  push:
    branches:
      - repair/all-story-visuals-2026-08-29
    paths:
      - ".github/company-near-pass-batch-trigger"

permissions:
  contents: write

concurrency:
  group: company-near-pass-visual-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/all-story-visuals-2026-08-29
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch reviewed Rolex and Almarai assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/logos
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          UA = 'daily-news-snap/1.0 (https://github.com/khalidonline/daily-news-snap; story visual repair)'

          def commons(title, destination, width=1600):
              params = urlencode({
                  'action': 'query', 'format': 'json', 'prop': 'imageinfo',
                  'iiprop': 'url|extmetadata', 'iiurlwidth': width, 'titles': 'File:' + title,
              })
              req = Request('https://commons.wikimedia.org/w/api.php?' + params, headers={'User-Agent': UA})
              with urlopen(req, timeout=25) as response:
                  payload = json.load(response)
              page = next(iter(payload['query']['pages'].values()))
              if 'missing' in page or not page.get('imageinfo'):
                  raise SystemExit(f'Commons file missing: {title}')
              info = page['imageinfo'][0]
              url = info.get('thumburl') or info['url']
              req = Request(url, headers={'User-Agent': UA})
              with urlopen(req, timeout=30) as response:
                  Path(destination).write_bytes(response.read())
              print(f'fetched {title} -> {destination}')

          commons('Rare Rolex Watch.png', 'images/targeted-rolex-watch.png')
          commons('Logo da Rolex.png', 'images/logos/rolex.com-current.png', 1280)
          commons('Fruit juices in bottles.jpg', 'images/targeted-almarai-products.jpg')
          commons('المراعي - Almarai.svg', 'images/logos/almarai.com-current.png', 1280)
          PY

      - name: Validate photos and normalize logos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from image_precheck import dhash, DHASH_MAX_DISTANCE

          photos = [
              Path('images/targeted-rolex-watch.png'),
              Path('images/targeted-almarai-products.jpg'),
          ]
          for new in photos:
              with Image.open(new) as im:
                  im.verify()
              with Image.open(new) as im:
                  if im.width < 600 or im.height < 400:
                      raise SystemExit(f'candidate too small: {new} {im.size}')
                  print(f'candidate verified: {new.name} {im.size}')
              new_hash = dhash(new)
              if new_hash is None:
                  raise SystemExit(f'could not fingerprint {new}')
              for old in Path('images').glob('*'):
                  if old in photos or not old.is_file() or old.suffix.lower() not in {'.jpg', '.jpeg', '.png', '.webp'}:
                      continue
                  old_hash = dhash(old)
                  if old_hash is None:
                      continue
                  distance = (new_hash ^ old_hash).bit_count()
                  if distance <= DHASH_MAX_DISTANCE:
                      raise SystemExit(f'{new.name} duplicates {old} distance={distance}')
              print(f'distinctness gate PASS: {new.name}')

          for p in [Path('images/logos/rolex.com-current.png'), Path('images/logos/almarai.com-current.png')]:
              with Image.open(p) as src:
                  rgba = src.convert('RGBA')
              corners = [rgba.getpixel((0,0)), rgba.getpixel((rgba.width-1,0)),
                         rgba.getpixel((0,rgba.height-1)), rgba.getpixel((rgba.width-1,rgba.height-1))]
              if all(a > 220 and r > 240 and g > 240 and b > 240 for r,g,b,a in corners):
                  data = []
                  for r,g,b,a in rgba.getdata():
                      data.append((r,g,b,0 if r > 245 and g > 245 and b > 245 else a))
                  rgba.putdata(data)
              bbox = rgba.getchannel('A').getbbox()
              if not bbox:
                  raise SystemExit(f'logo empty after normalization: {p}')
              rgba = rgba.crop(bbox)
              pad = max(16, int(max(rgba.size) * 0.05))
              canvas = Image.new('RGBA', (rgba.width + 2*pad, rgba.height + 2*pad), (255,255,255,0))
              canvas.alpha_composite(rgba, (pad,pad))
              if canvas.width < 250 or canvas.height < 80:
                  raise SystemExit(f'logo too small: {p} {canvas.size}')
              canvas.save(p)
              print(f'clean logo normalized: {p.name} {canvas.size}')
          PY

      - name: Register reviewed assets and identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = Path('images/images.txt')
          text = manifest.read_text(encoding='utf-8').rstrip()
          additions = [
              'targeted-rolex-watch.png | Rolex, رولكس, ساعة رولكس | Matt C / CC BY 2.0 — Wikimedia Commons',
              'targeted-almarai-products.jpg | Almarai, المراعي, منتجات المراعي, عصائر | Wikimedia Commons — reviewed product photo',
          ]
          for line in additions:
              if line not in text:
                  text += '\n' + line
          manifest.write_text(text + '\n', encoding='utf-8')

          rel_path = Path('images/relevance.json')
          rel = json.loads(rel_path.read_text(encoding='utf-8'))
          assets = rel.setdefault('assets', {})
          assets['targeted-rolex-watch.png'] = {
              'stories': {'قصة Rolex وصناعة الفخامة': 'DIRECT'},
              'source_url': 'https://commons.wikimedia.org/wiki/File:Rare_Rolex_Watch.png',
          }
          assets['targeted-almarai-products.jpg'] = {
              'stories': {'قصة المراعي من مزرعة إلى أكبر شركة ألبان': 'DIRECT'},
              'source_url': 'https://commons.wikimedia.org/wiki/File:Fruit_juices_in_bottles.jpg',
          }
          rel_path.write_text(json.dumps(rel, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = Path('images/logos/index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          index['rolex.com'] = ['Rolex', 'رولكس', 'rolex.com']
          index['almarai.com'] = ['Almarai', 'المراعي', 'Almarai Company', 'almarai.com']
          index_path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          stories = Path('stories.txt')
          s = stories.read_text(encoding='utf-8')
          replacements = {
              'قصة Rolex وصناعة الفخامة | Rolex': 'قصة Rolex وصناعة الفخامة | Rolex | logo:rolex.com',
              'قصة المراعي من مزرعة إلى أكبر شركة ألبان | Almarai': 'قصة المراعي من مزرعة إلى أكبر شركة ألبان | Almarai | logo:almarai.com',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected story line missing: {old}')
              s = s.replace(old,new,1)
          stories.write_text(s, encoding='utf-8')
          PY

      - name: Verify both stories on authoritative board
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin repair/story-visual-coverage
          rm -rf /tmp/company-board-engine
          mkdir -p /tmp/company-board-engine
          git archive origin/repair/story-visual-coverage | tar -x -C /tmp/company-board-engine
          PYTHONPATH=/tmp/company-board-engine python - <<'PY'
          import sys
          sys.path.insert(0, '/tmp/company-board-engine')
          from tools.bulk_visual_board import build_board
          stories = ['قصة Rolex وصناعة الفخامة', 'قصة المراعي من مزرعة إلى أكبر شركة ألبان']
          rows = build_board(stories)
          for row in rows:
              print(f'{row.story}: {row.status} photos={len(row.photos)} logos={len(row.logos)}')
          if any(row.status != 'PASS' or len(row.photos) < 4 or len(row.logos) < 1 for row in rows):
              raise SystemExit('one or more company near-pass stories failed authoritative coverage')
          PY

      - name: Commit accepted company repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "story-visual-repair-bot"
          git config user.email "actions@github.com"
          git add images/targeted-rolex-watch.png images/targeted-almarai-products.jpg \
            images/logos/rolex.com-current.png images/logos/almarai.com-current.png \
            images/images.txt images/relevance.json images/logos/index.json stories.txt
          git commit -m "repair: close Rolex and Almarai near-pass gaps"
          git pull --rebase origin repair/all-story-visuals-2026-08-29
          git push origin HEAD:repair/all-story-visuals-2026-08-29
