name: Publish approved Heathrow once
on:
  push:
    paths: ['.github/workflows/heathrow-approved-20260928.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'khalidonline/daily-news-snap' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish approved Heathrow request 20260928-093533'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2799f6431edc6a956d088d562492cd2f70d2ecc6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sealed cards and approval window
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          m=json.loads(Path('approved/heathrow-20260928/manifest.json').read_text())
          now=datetime.now(timezone.utc)
          assert datetime.fromisoformat(m['not_before'].replace('Z','+00:00')) <= now < datetime.fromisoformat(m['expires_at'].replace('Z','+00:00'))
          assert len(m['media']) == 4
          assert [x['kind'] for x in m['media']] == ['info','story','story','story']
          PY
          python -m publishing_v2.bundle_api validate --manifest approved/heathrow-20260928/manifest.json
      - name: Verify quota and publish exact saved cards
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          POST_TO_SNAPCHAT: '1'
          DRY_RUN: '0'
        run: |
          python - <<'PY'
          from publishing_v2.bundle_api import BundleClient
          usage=BundleClient().ensure_capacity(4)
          print('Verified Snapchat quota:',usage['posts'])
          PY
          python -m publishing_v2.bundle_api publish --manifest approved/heathrow-20260928/manifest.json
