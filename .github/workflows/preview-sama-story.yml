name: Preview SAMA Story

on:
  push:
    paths:
      - '.github/workflows/preview-sama-story.yml'

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Render SAMA story
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POST_TO_SNAPCHAT: '0'
          DRY_RUN: '1'
          MEDIA_MODE: github
          THEME: light
          BRAND: ملخص تنفيذي - قصة
          FONT_FAMILY: Almarai
          STORY_MODEL: claude-opus-5
          STORY_FRAMES: '6'
          STORY_ALLOW_REPEAT: '1'
          ALLOW_GENERATED: '0'
          ALLOW_STORY_GENERATION: '0'
          STORY_OPERATION_MODE: auto
          STORY_SUPPRESS_TELEGRAM: '1'
        run: STORY='قصة تأسيس مؤسسة النقد ساما' python guarded_story_publish.py
      - uses: actions/upload-artifact@v4
        with:
          name: sama-story-preview
          path: out/*.png
          if-no-files-found: error
          retention-days: 1
