name: Repair Jeddah airport archive visuals

on:
  push:
    branches:
      - fix/jeddah-airport-archive-visuals

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jeddah-airport-archive-visuals
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Jeddah airport story reuses Saudia archive progression
        run: |
          python - <<'PY'
          import story_runtime as sr
          story = "قصة أول مطار في جدة وتطور الطيران المدني"
          photos, logos, status = sr.coverage(story)
          names = [p.name for p in photos]
          print("COVERAGE", status, len(photos), names)
          required = {"saudia-dc3-crowd.jpg", "saudia-707-historic.jpg"}
          if status != "PASS" or len(photos) < 4 or not required.issubset(names):
              raise SystemExit("Jeddah airport story is not reusing the historical Saudia progression")
          PY
