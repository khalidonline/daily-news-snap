name: Two Story Visual Repair Pilot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: three-story-cost-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      POST_PROVIDER: "bundle"
      BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
      BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
      BUNDLE_BASE: ${{ vars.BUNDLE_BASE }}
      POST_TO_SNAPCHAT: "0"
      DRY_RUN: "1"
      STORY_OPERATION_MODE: "visual_only"
      STORY_COST_STATE_ROOT: "pilot-cost-state"
      MEDIA_MODE: "github"
      THEME: "light"
      BRAND: "ملخص تنفيذي - قصة"
      FONT_FAMILY: "Almarai"
      STORY_MODEL: "claude-opus-5"
      STORY_MODEL_INPUT_USD_PER_M: "5"
      STORY_MODEL_OUTPUT_USD_PER_M: "25"
      STORY_FRAMES: "6"
      ALLOW_GENERATED: "0"
      ALLOW_STORY_GENERATION: "0"
      STORY_ALLOW_REPEAT: "1"
      IMAGE_GEN: "byteplus"
      ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      ARK_MODEL: ${{ vars.ARK_MODEL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/all-story-visuals-2026-08-29
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pilot 1 — Riyadh
        id: riyadh
        continue-on-error: true
        env:
          STORY_REPAIR_FRAMES: "6"
        run: |
          set +e
          STORY="قصة الرياض: من بلدة مسورة إلى عاصمة اقتصادية" python guarded_story_publish.py
          status=$?
          set -e
          mkdir -p pilot-artifacts/riyadh
          cp -a out/. pilot-artifacts/riyadh/ 2>/dev/null || true
          find out -mindepth 1 -maxdepth 1 -type f -delete 2>/dev/null || true
          exit "$status"

      - name: Pilot 2 — SAMA
        id: sama
        continue-on-error: true
        env:
          STORY_REPAIR_FRAMES: "6"
        run: |
          set +e
          STORY="قصة تأسيس مؤسسة النقد ساما" python guarded_story_publish.py
          status=$?
          set -e
          mkdir -p pilot-artifacts/sama
          cp -a out/. pilot-artifacts/sama/ 2>/dev/null || true
          find out -mindepth 1 -maxdepth 1 -type f -delete 2>/dev/null || true
          exit "$status"

      - name: Build run-only cost report
        if: always()
        run: |
          python -c 'import json; from pathlib import Path; import story_cost_report as r; Path("pilot-artifacts").mkdir(exist_ok=True); report=r.summarize(usage_path=Path("pilot-cost-state/model_usage.jsonl"), notification_path=Path("pilot-cost-state/story_notifications.jsonl"), last=2); Path("pilot-artifacts/story-cost-report.json").write_text(json.dumps(report, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")'

      - name: Keep all frames and the cost report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-story-cost-pilot-${{ github.run_id }}
          path: pilot-artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: Enforce pilot result
        if: always()
        run: |
          if [[ "${{ steps.riyadh.outcome }}" != "success" || "${{ steps.sama.outcome }}" != "success" ]]; then
            echo "One or more visual-only repairs failed; inspect the retained artifact."
            exit 1
          fi
