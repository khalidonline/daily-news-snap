name: Check replacement delivery capacity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-replacement-20260926.yml']
permissions:
  contents: read
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  check:
    if: github.event.head_commit.message == 'Check saved replacement capacity 20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eac5f67584438316fb627ae283c7a39bb248721c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read quota only
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
        run: |
          python - <<'PY'
          import json
          from publishing_v2.bundle_api import BundleClient
          c=BundleClient()
          c.check()
          u=c.ensure_capacity(6)
          print(json.dumps({"date":u["date"],"posts":u["posts"],"required":6}))
          PY
