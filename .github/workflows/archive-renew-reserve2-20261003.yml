name: Renew ten archives preserve two slots
on:
  push:
    paths: ['.github/workflows/archive-renew-reserve2-20261003.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  save:
    if: github.event.head_commit.message == 'Renew ten archive stories reserve two approved 20261003-1418'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e6fa4290f832cc468936d2ed15360c24f5a9831b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest -r requirements.txt -r requirements-v2-images.txt
      - run: |
          python -m pytest -q tests/test_v2_saved_story_api.py
          PYTHONPATH=. python approved/archive-renew-20261003-reserve2/save.py --validate
      - env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: python approved/archive-renew-20261003-reserve2/save.py
