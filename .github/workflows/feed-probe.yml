name: Temporary feed probe (remove before merge)
on:
  pull_request:
    paths: ['.github/workflows/feed-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe candidate Saudi feeds and article pages
        run: |
          python3 - <<'PY'
          import re, urllib.request
          from xml.etree import ElementTree
          BOT = 'DailyNewsSnap/2.0 (editorial research)'
          BROWSER = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          URLS = [
            'https://www.alyaum.com/rssFeed/1005',
            'https://www.okaz.com.sa/rssFeed/0', 'https://www.okaz.com.sa/rssFeed/190',
            'https://sabq.org/rss', 'https://sabq.org/rss.xml', 'https://sabq.org/feed',
            'https://www.alarabiya.net/feed/rss2/ar.xml', 'https://www.alarabiya.net/feed/rss2/ar/saudi-today.xml',
            'https://www.arabnews.com/cat/1/rss.xml', 'https://www.arabnews.com/rss.xml',
            'https://www.argaam.com/ar/rss/ho-main-news?sectionid=1523', 'https://www.argaam.com/ar/rss/articles',
            'https://www.spa.gov.sa/rss', 'https://www.spa.gov.sa/ar/rss',
            'https://www.alriyadh.com/rss', 'https://www.alriyadh.com/section/rss',
            'https://www.arriyadiyah.com/rss', 'https://www.aleqt.com/rss.xml', 'https://www.aleqt.com/feed',
            'https://www.almowaten.net/feed/', 'https://www.alwatan.com.sa/rssFeed/1',
          ]
          def get(url, ua):
              req = urllib.request.Request(url, headers={'User-Agent': ua})
              with urllib.request.urlopen(req, timeout=15) as r:
                  return r.status, r.read(2_000_000)
          for url in URLS:
              try:
                  status, raw = get(url, BOT)
                  root = ElementTree.fromstring(raw)
                  items = list(root.iter('item'))
                  first = items[0] if items else None
                  link = first.findtext('link', '') if first is not None else ''
                  imgs = 0
                  for it in items[:10]:
                      if list(it.iter('enclosure')) or list(it.iter('{http://search.yahoo.com/mrss/}content')) or \
                         list(it.iter('{http://search.yahoo.com/mrss/}thumbnail')) or re.search(r'<img', it.findtext('description','') or ''):
                          imgs += 1
                  body = len((first.findtext('description','') or '') + (first.findtext('{http://purl.org/rss/1.0/modules/content/}encoded','') or '')) if first is not None else 0
                  print(f'FEED OK {url} items={len(items)} with_image={imgs}/10 first_body_chars={body} first_pub={first.findtext("pubDate","") if first is not None else ""} link={link[:90]}')
                  for ua_name, ua in (('bot', BOT), ('browser', BROWSER)):
                      try:
                          s, page = get(link, ua)
                          og = re.search(rb'og:image"?\s+content="([^"]+)', page)
                          print(f'   article[{ua_name}] {s} bytes={len(page)} og_image={(og.group(1)[:90].decode(errors="replace") if og else None)}')
                      except Exception as e:
                          print(f'   article[{ua_name}] FAIL {type(e).__name__} {getattr(e, "code", "")}')
              except Exception as e:
                  print(f'FEED FAIL {url} {type(e).__name__} {getattr(e, "code", "")} {str(e)[:80]}')
          PY
