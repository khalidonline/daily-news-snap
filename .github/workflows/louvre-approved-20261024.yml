name: Publish exact owner-approved Louvre card
on:
  push:
    branches: [codex/louvre-approved-20261024]
    paths: [.github/workflows/louvre-approved-20261024.yml]
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5d0fb731815c3c65103a680340fcc7af34e497e1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow pytest
      - name: Validate exact pixels and approval guards
        run: |
          python -m publishing_v2.bundle_api validate --manifest approved/louvre-20261024/manifest.json
          python -m pytest tests/test_louvre_readability.py tests/test_v2_bundle.py tests/test_v2_bundle_group.py tests/test_v2_readability.py tests/test_v2_saved_story_api.py -q
      - name: Reconcile then deliver approved story and public archive
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVED_COMMIT: 5d0fb731815c3c65103a680340fcc7af34e497e1
          PYTHONPATH: .
        run: python approved/louvre-20261024/publish-approved.py
