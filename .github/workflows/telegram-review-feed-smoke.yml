name: Telegram review feed acceptance smoke

on:
  push:
    branches:
      - verify/telegram-review-feed-smoke-20260829

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run real bot in Telegram review mode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ""
          POST_TO_SNAPCHAT: "0"
          MEDIA_MODE: "github"
          BRIEF_TITLE: "ملخص تنفيذي - خبر"
          BRAND: "ملخص تنفيذي - خبر"
          FONT_FAMILY: "Almarai"
          THEME: "light"
          STORIES_PER_DAY: "1"
          CANDIDATES: "8"
          REQUIRE_PHOTO: "1"
          IMAGE_SOURCE: "auto"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          LOOKBACK_HOURS: "48"
          REMEMBER_DAYS: "3"
        run: python daily_news_runner.py
      - name: Keep review card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-review-smoke-${{ github.run_id }}
          path: out/*.png
          retention-days: 1
          if-no-files-found: ignore
