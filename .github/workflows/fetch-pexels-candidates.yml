name: Fetch photo candidates from Pexels (read-only)
on:
  push:
    branches: [claude/amazing-carson-t36zee]
    paths: ['.github/workflows/fetch-pexels-candidates.yml', 'tools/fetch_pexels_candidates.py']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt
      - run: python -u tools/fetch_pexels_candidates.py
        env:
          PYTHONPATH: .
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - run: |
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add reference/pexels && git commit -m "Photo candidates from Pexels" || exit 0
          git pull -q --rebase origin claude/amazing-carson-t36zee && git push
