name: Fetch Spotlight reference media (read-only on bundle.social)
on:
  push:
    branches: [claude/amazing-carson-t36zee]
    paths: ['.github/workflows/fetch-bundle-media.yml', 'tools/fetch_bundle_media.py']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download media of the other approved Spotlight posts (GET only)
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          POST_IDS: a41d0b3d-496f-4b45-b95c-dd2b7dad9286 838f1d62-1ada-4b17-9c15-82161605635a 20d1c374-423e-42f0-a447-2386a6493670 47bae7df-9104-423f-9856-73e9f3d91b97
          PYTHONPATH: .
        run: python -u tools/fetch_bundle_media.py
      - name: Commit the reference files to this branch
        run: |
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add reference/spotlight && git commit -m "Spotlight reference media (Puma/Adidas)" && git push || echo nothing to commit
