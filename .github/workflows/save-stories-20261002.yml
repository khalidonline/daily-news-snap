name: Save October 2 final packages
on:
  push:
    paths:
      - '.github/workflows/save-stories-20261002.yml'
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  save:
    if: github.event.head_commit.message == 'Run approved saved stories 20261002'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ff059e5a2902ea9bfdcd9f3dcad3d077ee1b760e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify saved story protections
        run: python -m unittest tests.test_v2_saved_story_api
      - name: Save Son
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m publishing_v2.saved_story_api --approval approved/saved-stories/son-20261002.json
      - name: Save Oil
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m publishing_v2.saved_story_api --approval approved/saved-stories/oil-20261002.json
      - name: Save Pandora
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m publishing_v2.saved_story_api --approval approved/saved-stories/pandora-20261002.json
