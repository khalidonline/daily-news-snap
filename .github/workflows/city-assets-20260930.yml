name: Fetch verified football archive photos
on:
  push:
    paths: ['.github/workflows/city-assets-20260930.yml']
permissions:
  contents: write
jobs:
  assets:
    if: github.event.head_commit.message == 'Prepare City archive assets 20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public photographs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import urllib.request,json,base64,os
          urls={
          'city':'https://www.mancity.com/meta/media/ub2lcghm/stadium.jpg?height=576&mode=crop&width=1024',
          'juve2023':'https://www.juventus.com/images/image/private/t_editorial_landscape_12_desktop/f_auto/dev/vdyavxa3ee7sd3vmjbq2.jpg',
          'juve2006':'https://upload.wikimedia.org/wikipedia/commons/8/88/Rimini-juve3.jpg'}
          for name,url in urls.items():
              req=urllib.request.Request(url,headers={'User-Agent':'DailyNewsSnap/2.0 (editorial archive)'})
              raw=urllib.request.urlopen(req,timeout=30).read()
              assert len(raw)>5000 and not raw[:30].lower().startswith(b'<')
              data=base64.b64encode(raw).decode()
              endpoint='https://api.github.com/repos/khalidonline/daily-news-snap/contents/approved/city-penalties-20260930/assets/'+name+'.jpg.b64'
              body=json.dumps({'message':'Save verified '+name+' photograph for City package','content':base64.b64encode(data.encode()).decode(),'branch':'main'}).encode()
              req=urllib.request.Request(endpoint,data=body,method='PUT',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              urllib.request.urlopen(req,timeout=30).read()
              print(name,len(raw))
          PY
