name: Request approved commute Story on 22 November
on:
  push:
    branches: [main]
    paths: ['.github/workflows/request-commute-story-20261122.yml']
permissions:
  actions: write
  checks: read
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the approved Story publisher once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(TZ=Asia/Riyadh date +%F)" = 2026-11-22
          for attempt in {1..70}; do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '[.check_runs[] | select(.name == "contract")][0].conclusion // "pending"')
            case "$conclusion" in
              success) break ;;
              pending) sleep 10 ;;
              *) exit 1 ;;
            esac
          done
          test "$conclusion" = success
          gh workflow run publish-approved-package.yml --repo khalidonline/daily-news-snap --ref main -f package=commute-comparison-20261122 -f mode=legacy-story
