name: Goody approved delivery only
on:
  push:
    branches: ['run/goody-approved-20261025']
    paths: ['.github/workflows/goody-approved-delivery-temp.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'khalidonline/daily-news-snap'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 71717982cf0e7d400d88126a22eff20aac3ef027
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-v2-images.txt pytest
      - name: Offline delivery tests
        run: python -m pytest tests/test_v2_owner_composite.py tests/test_v2_raster_review.py tests/test_v2_saved_story_api.py -q
      - name: Send exact approved Goody and verify public archive
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_COMMIT: 71717982cf0e7d400d88126a22eff20aac3ef027
          PYTHONPATH: .
        run: python approved/goody-20261025/publish-approved.py
