name: Publish approved energy revision 3
on:
  push:
    paths: ['.github/workflows/owner-energy-20261006.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Publish Khalid energy approval 20261006-2031'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cd55ee8e9e71712329e3344a4dc340d150fc8381
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Validate sealed cards
        run: |
          python -m publishing_v2.bundle_api validate --manifest approved/energy-pipeline-20261006/manifest.json
          python -m publishing_v2.bundle_api validate --manifest approved/energy-google-20261006/manifest.json
      - name: Check quota, budget evidence and approved time then publish sequentially
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from datetime import datetime, timezone
          from daily_budget import GitHubStore, day_key
          from publishing_v2.bundle_api import BundleClient
          store = GitHubStore(os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_TOKEN'])
          _, ledger = store.read(day_key())
          if ledger is None:
              print('Daily cost ledger unavailable; no paid production authorized or executed.')
          else:
              charged = sum(e['charged_micro_usd'] for e in ledger['entries'].values())
              assert charged <= 3000000, 'Project budget exceeded'
              print('Recorded daily charged micro USD:', charged)
          client = BundleClient()
          client.check()
          quota = client.ensure_capacity(4)
          print('Quota before:', json.dumps(quota['posts']))
          for name in ('pipeline','google'):
              manifest = 'approved/energy-'+name+'-20261006/manifest.json'
              row=json.loads(Path(manifest).read_text())
              now=datetime.now(timezone.utc)
              assert datetime.fromisoformat(row['not_before'].replace('Z','+00:00')) <= now < datetime.fromisoformat(row['expires_at'].replace('Z','+00:00'))
              client.ensure_capacity(3)
              subprocess.run(['python','-m','publishing_v2.bundle_api','publish','--manifest',manifest], check=True)
          print('Quota after:', json.dumps(client.ensure_capacity(1)['posts']))
          PY
