name: External schedule tick receiver

on:
  push:
    branches: [main]
    paths:
      - "scheduler/triggers/news.txt"
      - "scheduler/triggers/topic.txt"
      - "scheduler/triggers/story.txt"
      - "scheduler/triggers/breaking.txt"

permissions:
  contents: write

concurrency:
  group: external-schedule-tick-${{ github.sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Dispatch matching paid workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed="$(git show --pretty='' --name-only "$GITHUB_SHA")"
          else
            changed="$(git diff --name-only "$before" "$GITHUB_SHA")"
          fi

          for mapping in             "news:news-schedule"             "topic:topic-schedule"             "story:story-schedule"             "breaking:breaking-recovery"
          do
            bot="${mapping%%:*}"
            event_type="${mapping#*:}"
            trigger_path="scheduler/triggers/${bot}.txt"

            if grep -Fxq "$trigger_path" <<<"$changed"; then
              if [ "$bot" = "breaking" ]; then
                trigger_value="$(tail -n 1 "$trigger_path")"
                if [[ "$trigger_value" == confirmed_event=* ]]; then
                  encoded="${trigger_value#confirmed_event=}"
                  confirmed_event="$(printf '%s' "$encoded" | base64 --decode)"
                  gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
                    -f event_type="$event_type" \
                    -f "client_payload[confirmed_event]=${confirmed_event}"
                  continue
                fi
              fi
              gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
                -f event_type="$event_type"
            fi
          done
