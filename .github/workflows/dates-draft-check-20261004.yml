name: Validate dates draft without publishing
on:
  push:
    paths: ['.github/workflows/dates-draft-check-20261004.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.event.head_commit.message == 'Validate dates draft 20261004 1225'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: 'b26f4a76109a7177b4a9326cfd379e3fa1801982'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Guarded draft validation; never schedule
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse,urllib.error,os
          from datetime import datetime,timezone
          from publishing_v2.bundle_api import BundleClient,GitHubJournal,HTTPFailure,load_package
          identity,title,media=load_package('approved/dates-20261004/manifest.json')
          c=BundleClient();c.check();j=GitHubJournal(identity);s=j.read();g=s['_group']
          assert g['identity']==identity and not g.get('post_id') and not g.get('draft_validation')
          try:
              found=c.call('/post/reference-key/'+urllib.parse.quote(g['reference_key'],safe=''))
          except HTTPFailure as e:
              if e.code!=404: raise
          else: raise RuntimeError('Existing reference: reconcile, no create')
          offset=0
          while True:
              r=c.call('/post/?'+urllib.parse.urlencode({'teamId':c.team,'offset':offset,'limit':100}))
              assert isinstance(r.get('items'),list) and type(r.get('total')) is int
              for row in r['items']:
                  assert row.get('teamId')==c.team
                  snap=(row.get('data') or {}).get('SNAPCHAT') or {}
                  assert not set(snap.get('uploadIds') or []) & set(g['uploads']), 'Existing media, no create'
              offset+=len(r['items'])
              if offset>=r['total']: break
              assert r['items'] and offset<10000
          g['draft_validation']={'status':'SENDING','at':datetime.now(timezone.utc).isoformat(),'inventory_total':offset,'reference_lookup':404}
          j.save(s)
          payload={'teamId':c.team,'title':title,'referenceKey':g['reference_key'],'postDate':datetime.now(timezone.utc).isoformat(),'status':'DRAFT','socialAccountTypes':['SNAPCHAT'],'data':{'SNAPCHAT':{'type':'STORY','uploadIds':g['uploads'],'storyDuration':'ONE_WEEK'}}}
          req=urllib.request.Request('https://api.bundle.social/api/v1/post',headers={'x-api-key':c.key,'Content-Type':'application/json','User-Agent':'ExecutiveSaudiPublisher/1.0'},method='POST',data=json.dumps(payload).encode())
          try:
              result=json.load(urllib.request.urlopen(req,timeout=45))
          except urllib.error.HTTPError as e:
              body=e.read(16000).decode('utf-8','replace')
              for val in [c.key,c.team,os.environ['GITHUB_TOKEN']]: body=body.replace(val,'[redacted]')
              g['draft_validation'].update(status='REJECTED',http_status=e.code,error=body)
              j.save(s)
              print('DRAFT_VALIDATION_REJECTION',e.code,body)
          else:
              assert result.get('id')
              g['draft_validation'].update(status=result.get('status'),post_id=result['id'])
              g['post_id']=result['id'];g['status']='DRAFT'
              j.save(s)
              print('DRAFT_CREATED_NOT_PUBLISHED',result['id'],result.get('status'))
          PY
