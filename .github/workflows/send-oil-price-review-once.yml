name: Send corrected oil-price review once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/send-oil-price-review-once.yml"

permissions:
  contents: read

jobs:
  send:
    if: "github.event.head_commit.message == 'ops: send corrected oil-price review once'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install Pillow

      - name: Replace archival refinery with a relevant modern tanker
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://upload.wikimedia.org/wikipedia/commons/f/f3/Mina_Al_Fahal_from_sea.jpg' \
            -o /tmp/modern-oil-tanker.jpg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageOps

          card = Image.open(
              'cards/2026-09-07-9am-brief-3750d8dc.png'
          ).convert('RGB')
          photo = Image.open('/tmp/modern-oil-tanker.jpg').convert('RGB')
          out_path = Path('/tmp/oil-price-corrected.png')

          box = (96, 509, 984, 1201)
          width, height = box[2] - box[0], box[3] - box[1]
          fitted = ImageOps.fit(
              photo,
              (width, height),
              method=Image.Resampling.LANCZOS,
              centering=(0.10, 0.50),
          )
          mask = Image.new('L', (width, height), 0)
          ImageDraw.Draw(mask).rounded_rectangle(
              (0, 0, width, height), radius=34, fill=255
          )
          card.paste(fitted, box[:2], mask)
          card.save(out_path, quality=95)
          print(out_path)
          PY

      - name: Send corrected card to Telegram review
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          response="$(curl -sS --fail \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "photo=@/tmp/oil-price-corrected.png" \
            -F "caption=نسخة مصححة — صورة حديثة لناقلة نفط قبالة عُمان بدلاً من مصفاة البحرين عام 1949. الصورة: Wusel007 / Wikimedia Commons (CC BY-SA 3.0)" \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto")"
          python - "$response" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          if not payload.get('ok'):
              raise SystemExit(f"Telegram send failed: {payload}")
          print('telegram: corrected oil-price review card sent')
          PY
