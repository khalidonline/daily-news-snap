name: Apply breaking source expansion

on:
  push:
    branches:
      - feature/breaking-source-expansion
    paths:
      - .github/workflows/patch-breaking-source-expansion.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source and cost controls
        run: python scripts/patch_breaking_source_expansion.py
      - name: Commit patched watcher
        run: |
          rm .github/workflows/patch-breaking-source-expansion.yml
          rm scripts/patch_breaking_source_expansion.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add breaking_watch.py .github/workflows/patch-breaking-source-expansion.yml scripts/patch_breaking_source_expansion.py
          git commit -m "feat: expand breaking sources cost effectively"
          git push

# rerun after marker-based patch fix
