name: Read archive quota 20261003
on:
  push:
    paths: ['.github/workflows/archive-quota-20261003-1418.yml']
permissions:
  contents: read
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  check:
    if: github.event.head_commit.message == 'Read archive quota request 20261003-1418'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 151fad6d6d00fa290d8dc7e666e87ab53d24d428
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os
          from publishing_v2.saved_story_api import SavedClient
          from daily_budget import GitHubStore,day_key
          c=SavedClient();c.check()
          print(json.dumps(c.ensure_capacity(2)))
          _,ledger=GitHubStore(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN']).read(day_key())
          print(json.dumps({'budget_day':day_key(),'ledger_present':ledger is not None,'charged_micro_usd':sum(e['charged_micro_usd'] for e in ledger.get('entries',{}).values()) if ledger is not None else None}))
          PY
