name: News brief to Snapchat

on:
  schedule:
    # KSA is UTC+3 all year (no DST), so these are 07:00 / 13:00 / 17:00 / 22:00 KSA
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
    - cron: "0 14 * * *"
   # - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render the card but don't post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-brief          # never let two runs post at once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          MEDIA_MODE: "github"
          FONT_FAMILY: "Almarai"
          STORIES_PER_DAY: "4"
          LOOKBACK_HOURS: "14"
          REMEMBER_DAYS: "3"
        run: python news_bot.py

      - name: Keep the card for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ github.run_id }}
          path: out/*.png
          retention-days: 7
          if-no-files-found: ignore
