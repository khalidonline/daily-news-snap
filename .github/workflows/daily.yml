name: News brief to Snapchat

on:
  schedule:
    # KSA is UTC+3. The evening belongs to breaking.yml now: a watcher that
    # posts a confirmed breaking card the moment it lands, and a 20:00 KSA
    # fallback that posts the day's strongest story if nothing broke.
    - cron: "0 4 * * *"     # 07:00 KSA — overnight US news
    - cron: "0 9 * * *"     # 12:00 KSA — Gulf/Europe morning
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render the card but don't post"
        type: boolean
        default: false
      post:
        description: "انشر فوراً — للأخبار العاجلة. اتركه فارغاً للتجربة"
        type: boolean
        default: false
      image_source:
        description: "مصدر الصورة — auto يختار الصورة الأكثر صلة"
        type: choice
        options:
          - auto
          - article
          - spa
          - commons          # Wikimedia Commons
          - loc              # Library of Congress
          - openverse
          - stock            # Pexels
          - none
        default: auto

permissions:
  contents: write

concurrency:
  # runs are 6 hours apart, so an overlap means the earlier one is stuck.
  # cancel it rather than queueing behind it forever.
  group: news-brief
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15      # room for a retry if Claude is slow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_PROVIDER: "bundle"        # bundle | ayrshare | zernio
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          BUNDLE_BASE: ${{ vars.BUNDLE_BASE }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_ACCOUNT_ID: ${{ vars.ZERNIO_ACCOUNT_ID }}
          ZERNIO_BASE: ${{ vars.ZERNIO_BASE }}
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          MEDIA_MODE: "github"
          # Scheduled runs post except 12:00 KSA ("0 9 * * *"), which stays
          # hybrid. A manual run posts ONLY when "post" is ticked: the default
          # is still no, because a test that reaches the profile is expensive
          # to undo. The tick remains the human override for breaking news;
          # the automated evening path lives in breaking.yml.
          POST_TO_SNAPCHAT: ${{ ((github.event_name == 'schedule' && github.event.schedule != '0 9 * * *') || (github.event_name == 'workflow_dispatch' && inputs.post)) && '1' || '0' }}
          # one cap shared with topic.yml — see the note there
          MONTHLY_POST_LIMIT: "145"
          BRIEF_TITLE: "ملخص تنفيذي - أعمال وتقنية"
          BRAND: "ملخص تنفيذي - خبر"
          FONT_FAMILY: "Almarai"
          REQUIRE_SAUDI_CONTEXT: ${{ vars.REQUIRE_SAUDI_CONTEXT }}
          MIN_TERM_HITS: ${{ vars.MIN_TERM_HITS }}
          MIN_PHOTO_SCORE: ${{ vars.MIN_PHOTO_SCORE }}
          THEME: "light"
          STORIES_PER_DAY: "1"
          CANDIDATES: "8"
          REQUIRE_PHOTO: "1"
          IMAGE_SOURCE: ${{ inputs.image_source || 'auto' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          LOOKBACK_HOURS: "48"
          REMEMBER_DAYS: "3"
        run: python daily_news_runner.py

      - name: Keep the card for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ github.run_id }}
          path: out/*.png
          retention-days: 7
          if-no-files-found: ignore
