name: News brief to Snapchat

on:
  schedule:
    # Temporary fallback only. External scheduler should be authoritative.
    - cron: "10,25,40,55 4-20 * * *"
  repository_dispatch:
    types: [news-schedule, news-recovery]
  workflow_dispatch:
    inputs:
      scheduled_slot:
        description: "Scheduler-only ISO KSA slot; leave empty for manual run"
        type: string
        required: false
      recovery_story:
        description: "Exact story text for a manual recovery run"
        type: string
        required: false
      dry_run:
        description: "Render the card but don't post"
        type: boolean
        default: false
      post:
        description: "انشر فوراً — للأخبار العاجلة. اتركه فارغاً للمراجعة على تيليجرام"
        type: boolean
        default: false
      image_source:
        description: "مصدر الصورة — auto يختار الصورة الأكثر صلة"
        type: choice
        options:
          - auto
          - article
          - spa
          - commons
          - loc
          - openverse
          - stock
          - none
        default: auto

permissions:
  contents: write

concurrency:
  group: news-brief
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Resolve News schedule slot
        env:
          REQUESTED_SLOT: ${{ github.event.client_payload.slot || inputs.scheduled_slot || '' }}
        run: |
          python3 shared_schedule_gate.py due \
            --bot news \
            --event-name "${{ github.event_name }}" \
            --requested-slot "$REQUESTED_SLOT" \
            --requested-slot-file scheduler/triggers/news.txt \
            --state daily_slot_state.json \
            --github-env "$GITHUB_ENV"

      - name: Load exact News recovery story
        if: ${{ env.RUN_SCHEDULED_BOT != '0' && (github.event.action == 'news-recovery' || inputs.recovery_story != '') }}
        env:
          DISPATCH_STORY_B64: ${{ github.event.client_payload.story_b64 || '' }}
          MANUAL_STORY: ${{ inputs.recovery_story || '' }}
        run: |
          if [ -n "$DISPATCH_STORY_B64" ]; then
            echo "NEWS_RECOVERY_STORY_B64=$DISPATCH_STORY_B64" >> "$GITHUB_ENV"
          elif [ -n "$MANUAL_STORY" ]; then
            payload="$(printf '%s' "$MANUAL_STORY" | base64 -w0)"
            echo "NEWS_RECOVERY_STORY_B64=$payload" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: ${{ env.RUN_SCHEDULED_BOT != '0' }}
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: ${{ env.RUN_SCHEDULED_BOT != '0' }}

      - name: Run bot
        if: ${{ env.RUN_SCHEDULED_BOT != '0' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.NEWS_MODEL || 'claude-sonnet-5' }}
          NEWS_RECOVERY_STORY_B64: ${{ env.NEWS_RECOVERY_STORY_B64 }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_PROVIDER: "bundle"
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          BUNDLE_BASE: ${{ vars.BUNDLE_BASE }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_ACCOUNT_ID: ${{ vars.ZERNIO_ACCOUNT_ID }}
          ZERNIO_BASE: ${{ vars.ZERNIO_BASE }}
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          MEDIA_MODE: "github"
          POST_TO_SNAPCHAT: ${{ (github.event_name == 'workflow_dispatch' && inputs.post) && '1' || '0' }}
          MONTHLY_POST_LIMIT: "145"
          BRIEF_TITLE: "ملخص تنفيذي - خبر"
          BRAND: "ملخص تنفيذي - خبر"
          FONT_FAMILY: "Almarai"
          REQUIRE_SAUDI_CONTEXT: ${{ vars.REQUIRE_SAUDI_CONTEXT }}
          MIN_TERM_HITS: ${{ vars.MIN_TERM_HITS }}
          MIN_PHOTO_SCORE: ${{ vars.MIN_PHOTO_SCORE }}
          THEME: "light"
          STORIES_PER_DAY: "1"
          CANDIDATES: "8"
          REQUIRE_PHOTO: "1"
          IMAGE_SOURCE: ${{ inputs.image_source || 'auto' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          LOOKBACK_HOURS: "48"
          REMEMBER_DAYS: "3"
          MODEL_BOT: "news"
          MODEL_USAGE_PATH: "out/model_usage.jsonl"
          MODEL_MAX_USD_PER_RUN: "0.50"
          NEWS_MAX_PAID_RESPONSES: "2"
          VISION_MAX_PAID_RESPONSES: "20"
        run: python daily_news_fresh_runner.py

      - name: Verify News card was produced
        if: ${{ env.RUN_SCHEDULED_BOT != '0' }}
        run: |
          test -n "$(find out -maxdepth 1 -name '*.png' -print -quit)"

      - name: Model cost summary
        if: ${{ always() && env.RUN_SCHEDULED_BOT != '0' }}
        run: python model_usage.py summarize --path out/model_usage.jsonl >> "$GITHUB_STEP_SUMMARY"

      - name: Mark News slot complete
        if: ${{ success() && env.RUN_SCHEDULED_BOT != '0' && env.SCHEDULE_SLOT_ID != '' }}
        run: |
          python3 shared_schedule_gate.py mark --slot "$SCHEDULE_SLOT_ID" --state daily_slot_state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_slot_state.json
          git commit -m "state: complete news slot $SCHEDULE_SLOT_ID"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Keep the card for review
        if: ${{ always() && env.RUN_SCHEDULED_BOT != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ github.run_id }}
          path: |
            out/*.png
            out/model_usage.jsonl
          retention-days: 7
          if-no-files-found: ignore
