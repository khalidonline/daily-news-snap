name: News brief to Snapchat

on:
  schedule:
    # KSA is UTC+3. Run every two hours from 07:10 through 23:10 KSA.
    # Moving off minute 00 reduces GitHub Actions top-of-hour congestion.
    # Scheduled runs are review-only: build the strongest eligible card,
    # send it to Telegram, record it as covered, and never post to Snapchat.
    - cron: "10 4-20/2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render the card but don't post"
        type: boolean
        default: false
      post:
        description: "انشر فوراً — للأخبار العاجلة. اتركه فارغاً للمراجعة على تيليجرام"
        type: boolean
        default: false
      image_source:
        description: "مصدر الصورة — auto يختار الصورة الأكثر صلة"
        type: choice
        options:
          - auto
          - article
          - spa
          - commons          # Wikimedia Commons
          - loc              # Library of Congress
          - openverse
          - stock            # Pexels
          - none
        default: auto

permissions:
  contents: write

concurrency:
  # runs are 2 hours apart; a genuine overlap means the earlier one is stuck.
  # cancel it rather than queueing behind it forever.
  group: news-brief
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15      # room for a retry if Claude is slow

    steps:
      - name: Guard scheduled freshness
        env:
          MAX_SCHEDULE_DELAY_MINUTES: "45"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch — freshness guard bypassed"
            echo "RUN_DAILY=1" >> "$GITHUB_ENV"
            exit 0
          fi

          now_hour="$(date -u +%H)"
          now_minute="$(date -u +%M)"
          now_minutes=$((10#$now_hour * 60 + 10#$now_minute))
          min_delay=9999

          # 04:10–20:10 UTC == 07:10–23:10 KSA, every two hours.
          for scheduled_minutes in 250 370 490 610 730 850 970 1090 1210; do
            delay=$((now_minutes - scheduled_minutes))
            if [ "$delay" -ge 0 ] && [ "$delay" -lt "$min_delay" ]; then
              min_delay="$delay"
            fi
          done

          if [ "$min_delay" -gt "$MAX_SCHEDULE_DELAY_MINUTES" ]; then
            echo "stale scheduled run: ${min_delay}m late; skipping paid/content work"
            echo "RUN_DAILY=0" >> "$GITHUB_ENV"
          else
            echo "scheduled run is ${min_delay}m late; proceeding"
            echo "RUN_DAILY=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: ${{ env.RUN_DAILY != '0' }}

      - uses: actions/setup-python@v5
        if: ${{ env.RUN_DAILY != '0' }}
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: ${{ env.RUN_DAILY != '0' }}

      - name: Run bot
        if: ${{ env.RUN_DAILY != '0' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_PROVIDER: "bundle"        # bundle | ayrshare | zernio
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          BUNDLE_BASE: ${{ vars.BUNDLE_BASE }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_ACCOUNT_ID: ${{ vars.ZERNIO_ACCOUNT_ID }}
          ZERNIO_BASE: ${{ vars.ZERNIO_BASE }}
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          # Scheduled runs intentionally stay out of DRY_RUN so hybrid mode can
          # persist the covered-story state and avoid repeating Telegram alerts.
          # The dry-run switch remains available for manual testing.
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          MEDIA_MODE: "github"
          # Scheduled runs are always Telegram review-only. Snapchat publishing
          # is possible only on an explicit manual dispatch with "post" checked.
          POST_TO_SNAPCHAT: ${{ (github.event_name == 'workflow_dispatch' && inputs.post) && '1' || '0' }}
          # one cap shared with topic.yml — see the note there
          MONTHLY_POST_LIMIT: "145"
          BRIEF_TITLE: "ملخص تنفيذي - خبر"
          BRAND: "ملخص تنفيذي - خبر"
          FONT_FAMILY: "Almarai"
          REQUIRE_SAUDI_CONTEXT: ${{ vars.REQUIRE_SAUDI_CONTEXT }}
          MIN_TERM_HITS: ${{ vars.MIN_TERM_HITS }}
          MIN_PHOTO_SCORE: ${{ vars.MIN_PHOTO_SCORE }}
          THEME: "light"
          STORIES_PER_DAY: "1"
          CANDIDATES: "8"
          REQUIRE_PHOTO: "1"
          IMAGE_SOURCE: ${{ inputs.image_source || 'auto' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          LOOKBACK_HOURS: "48"
          REMEMBER_DAYS: "3"
        run: python daily_news_runner.py

      - name: Keep the card for review
        if: ${{ always() && env.RUN_DAILY != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ github.run_id }}
          path: out/*.png
          retention-days: 7
          if-no-files-found: ignore
