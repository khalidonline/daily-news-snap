name: News brief to Snapchat

on:
  schedule:
    # KSA is UTC+3. Weighted toward US hours, when tech and market news breaks.
    - cron: "0 4 * * *"     # 07:00 KSA — overnight US news
    - cron: "0 9 * * *"     # 12:00 KSA — Gulf/Europe morning
    - cron: "0 14 * * *"    # 17:00 KSA — US market open
    - cron: "0 18 * * *"    # 21:00 KSA — US afternoon, most announcements
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render the card but don't post"
        type: boolean
        default: false
      image_source:
        description: "مصدر الصورة — لا يوجد توليد آلي في الأخبار"
        type: choice
        options:
          - spa
          - article
          - openverse
          - stock   # Pexels
          - none
        default: spa

permissions:
  contents: write

concurrency:
  # runs are 6 hours apart, so an overlap means the earlier one is stuck.
  # cancel it rather than queueing behind it forever.
  group: news-brief
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_PROVIDER: "bundle"        # bundle | ayrshare | zernio
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          BUNDLE_BASE: ${{ vars.BUNDLE_BASE }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_ACCOUNT_ID: ${{ vars.ZERNIO_ACCOUNT_ID }}
          ZERNIO_BASE: ${{ vars.ZERNIO_BASE }}
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          MEDIA_MODE: "github"
          POST_TO_SNAPCHAT: "1"   # 0 = hybrid, 1 = post automatically
          MONTHLY_POST_LIMIT: "60"
          BRIEF_TITLE: "ملخص تنفيذي - أعمال وتقنية"
          BRAND: "ملخص تنفيذي - خبر"
          FONT_FAMILY: "Almarai"
          REQUIRE_SAUDI_CONTEXT: ${{ vars.REQUIRE_SAUDI_CONTEXT }}
          MIN_TERM_HITS: ${{ vars.MIN_TERM_HITS }}
          MIN_PHOTO_SCORE: ${{ vars.MIN_PHOTO_SCORE }}
          THEME: "light"
          STORIES_PER_DAY: "1"
          CANDIDATES: "8"
          REQUIRE_PHOTO: "1"
          IMAGE_SOURCE: ${{ inputs.image_source || 'spa' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          LOOKBACK_HOURS: "10"
          REMEMBER_DAYS: "3"
        run: python news_bot.py

      - name: Keep the card for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ github.run_id }}
          path: out/*.png
          retention-days: 7
          if-no-files-found: ignore
