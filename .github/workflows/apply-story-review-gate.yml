name: Apply Story review gate patch

on:
  push:
    branches: [fix/story-review-before-telegram]
    paths:
      - '.github/workflows/apply-story-review-gate.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/story-review-before-telegram
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/apply_story_review_gate.py
      - run: >-
          python -m unittest
          tests.test_story_publishability
          tests.test_story_publishability_state_order
          tests.test_nearest_story_repairs
          tests.test_story_review_gate
      - name: Commit review gate
        run: |
          git config user.name khalidonline
          git config user.email 69767138+khalidonline@users.noreply.github.com
          git add ready_story_publish.py guarded_story_publish.py
          git commit -m 'feat: require Story review before delivery'
          git push origin HEAD:fix/story-review-before-telegram
