name: Repair Saudi paper-money story visuals

on:
  push:
    branches:
      - fix/saudi-paper-money-visuals

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saudi-paper-money-visuals
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Existing SAMA archive is reused by Saudi paper-money story
        run: |
          python - <<'PY'
          import story_runtime as sr
          story = "قصة أول عملة ورقية سعودية"
          photos, logos, status = sr.coverage(story)
          names = [p.name for p in photos]
          print("COVERAGE", status, len(photos), names)
          required = {"targeted-sama-1953-10-riyal.jpg", "targeted-sama-1954-5-riyal.jpg"}
          if status != "PASS" or len(photos) < 4 or not required.issubset(names):
              raise SystemExit("Saudi paper-money story is not reusing both SAMA archive banknotes")
          PY
