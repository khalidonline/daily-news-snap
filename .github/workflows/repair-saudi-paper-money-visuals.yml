name: Repair Saudi paper-money story visuals

on:
  push:
    branches:
      - fix/saudi-paper-money-visuals

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saudi-paper-money-visuals
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Confirm starting coverage
        run: |
          python - <<'PY'
          import story_runtime as sr
          story = "قصة أول عملة ورقية سعودية"
          before, _ = sr.approved_runtime_visuals(story)
          print("BEFORE", len(before), [p.name for p in before])
          if len(before) != 2:
              raise SystemExit(f"expected 2 visuals before repair, got {len(before)}")
          PY
      - name: Connect existing SAMA archive assets
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path("images/images.txt")
          text = index.read_text(encoding="utf-8")
          additions = {
            "targeted-sama-1953-10-riyal.jpg": ["قصة أول عملة ورقية سعودية", "أول عملة ورقية سعودية", "إيصالات الحجاج"],
            "targeted-sama-1954-5-riyal.jpg": ["قصة أول عملة ورقية سعودية", "أول عملة ورقية سعودية", "إيصالات الحجاج"],
          }
          lines = text.splitlines()
          seen = set()
          for i, line in enumerate(lines):
              for filename, tags in additions.items():
                  if not line.startswith(filename + " |"):
                      continue
                  seen.add(filename)
                  parts = line.split("|", 2)
                  if len(parts) != 3:
                      raise SystemExit(f"malformed catalogue line: {line}")
                  current = [t.strip() for t in parts[1].split(",") if t.strip()]
                  for tag in tags:
                      if tag not in current:
                          current.append(tag)
                  lines[i] = f"{parts[0].strip()} | {', '.join(current)} | {parts[2].strip()}"
          missing = set(additions) - seen
          if missing:
              raise SystemExit(f"catalogue assets missing: {sorted(missing)}")
          index.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Verify refreshed runtime coverage
        run: |
          python - <<'PY'
          import story_runtime as sr
          story = "قصة أول عملة ورقية سعودية"
          after, _ = sr.approved_runtime_visuals(story)
          photos, logos, status = sr.coverage(story)
          print("AFTER", len(after), [p.name for p in after])
          print("STATUS", status, len(photos), len(logos))
          if len(after) < 4 or status != "PASS":
              raise SystemExit("Saudi paper-money story did not reach PASS")
          PY
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "story-visual-repair-bot"
          git config user.email "actions@github.com"
          git add images/images.txt
          git commit -m "assets: connect SAMA archive to Saudi paper-money story"
          git push origin HEAD:fix/saudi-paper-money-visuals
