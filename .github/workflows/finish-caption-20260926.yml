name: Repair saved trial
on:
  push:
    paths: ['.github/workflows/finish-caption-20260926.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  repair:
    if: github.event.head_commit.message == 'Finish last caption correction on reviewed package'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 82c6b48da02a6f8efb777b15bf047526277c561e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Restore exact saved production files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36229816919 --repo khalidonline/daily-news-snap --name repaired-saved-trial --dir repair-output
      - name: Repair only saved package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_BUDGET_GITHUB_TOKEN: ${{ secrets.DAILY_BUDGET_GITHUB_TOKEN || github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          AUTOPILOT_DAILY_LIMIT_MICRO_USD: '3000000'
          AUTOPILOT_EDITOR_MODEL: claude-sonnet-5
          AUTOPILOT_RESEARCHER_MODEL: claude-opus-5
          AUTOPILOT_WRITER_MODEL: claude-opus-5
          AUTOPILOT_VISUAL_MODEL: claude-sonnet-5
          AUTOPILOT_REVIEWER_MODEL: claude-sonnet-5
        run: python finish_caption_20260926.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-saved-trial
          path: repair-output/
          include-hidden-files: true
