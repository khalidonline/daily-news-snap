name: Single package trial 20260926
on:
  push:
    branches: [main]
    paths: ['.github/workflows/single-package-trial-20260926.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  trial:
    if: github.event.head_commit.message == 'Run authorized single package trial 20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 37ba6609c96cc0fa9a8df0e4512103359cf40a9c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements.txt -r requirements-v2-images.txt PyYAML
      - name: Read real quota and shared budget
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_BUDGET_GITHUB_TOKEN: ${{ secrets.DAILY_BUDGET_GITHUB_TOKEN || github.token }}
        run: |
          python - <<'PY'
          import os,json,time
          from pathlib import Path
          from datetime import datetime,timezone
          from daily_budget import GitHubStore,day_key
          from publishing_v2.bundle_api import BundleClient,GitHubJournal
          from publishing_v2.autopilot.runtime import engine_id,rollout_ready
          start=datetime(2026,9,26,tzinfo=timezone.utc)
          delay=(start-datetime.now(timezone.utc)).total_seconds()
          if delay>180: raise RuntimeError('too_early')
          if delay>0: time.sleep(delay+1)
          now=datetime.now(timezone.utc)
          if now>=datetime(2026,9,26,3,tzinfo=timezone.utc): raise RuntimeError('trial_window_expired')
          usage=BundleClient().ensure_capacity(4)
          token=os.environ.get('DAILY_BUDGET_GITHUB_TOKEN') or os.environ['GITHUB_TOKEN']
          _,row=GitHubStore(os.environ['GITHUB_REPOSITORY'],token).read(day_key(now))
          spent=sum(e.get('charged_micro_usd',0) for e in (row or {}).get('entries',{}).values())
          result={'checked_at':now.isoformat(),'quota':usage['posts'],'quota_date':usage['date'],
                  'budget_day':day_key(now),'charged_micro_usd':spent,'remaining_micro_usd':max(0,3000000-spent),
                  'readiness':rollout_ready(GitHubJournal('autopilot-readiness').read(),engine_id(),now)}
          Path('trial-output').mkdir(exist_ok=True)
          Path('trial-output/preflight.json').write_text(json.dumps(result))
          print(json.dumps(result))
          if spent>=3000000: raise RuntimeError('daily_budget_exhausted')
          PY
      - name: Complete checkout tests without paid credentials
        env:
          FONT_FAMILY: Almarai
          THEME: light
        run: |
          python -m unittest discover -s tests -q > trial-output/tests.log 2>&1
      - name: Prepare exactly one Daily package
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_BUDGET_GITHUB_TOKEN: ${{ secrets.DAILY_BUDGET_GITHUB_TOKEN || github.token }}
          AUTOPILOT_DAILY_LIMIT_MICRO_USD: '3000000'
          AUTOPILOT_EDITOR_MODEL: claude-sonnet-5
          AUTOPILOT_RESEARCHER_MODEL: claude-opus-5
          AUTOPILOT_WRITER_MODEL: claude-opus-5
          AUTOPILOT_VISUAL_MODEL: claude-sonnet-5
          AUTOPILOT_REVIEWER_MODEL: claude-sonnet-5
          AUTOPILOT_LANE: daily
          POST_TO_SNAPCHAT: '0'
          DRY_RUN: '1'
        run: python -m publishing_v2.autopilot.runtime --mode shadow --lane daily --output trial-output/package
      - name: Publish only if existing readiness permits
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_BUDGET_GITHUB_TOKEN: ${{ secrets.DAILY_BUDGET_GITHUB_TOKEN || github.token }}
          AUTOPILOT_DAILY_LIMIT_MICRO_USD: '3000000'
          AUTOPILOT_EDITOR_MODEL: claude-sonnet-5
          AUTOPILOT_RESEARCHER_MODEL: claude-opus-5
          AUTOPILOT_WRITER_MODEL: claude-opus-5
          AUTOPILOT_VISUAL_MODEL: claude-sonnet-5
          AUTOPILOT_REVIEWER_MODEL: claude-sonnet-5
          POST_TO_SNAPCHAT: '1'
          DRY_RUN: '0'
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          from datetime import datetime,timezone
          from publishing_v2.bundle_api import GitHubJournal
          from publishing_v2.autopilot.runtime import engine_id,rollout_ready,main
          if not rollout_ready(GitHubJournal('autopilot-readiness').read(),engine_id(),datetime.now(timezone.utc)):
              result={'status':'readiness_blocked','published_cards':0}
              Path('trial-output/delivery.json').write_text(json.dumps(result));print(json.dumps(result))
          else:
              sys.argv=['trial','--mode','live','--lane','daily','--output','trial-output/package']
              raise SystemExit(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-package-trial-${{ github.run_id }}
          path: trial-output/
          retention-days: 14
