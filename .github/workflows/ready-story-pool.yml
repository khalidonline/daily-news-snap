name: Refresh READY story pool

on:
  push:
    branches:
      - repair/all-story-visuals-2026-08-29
    paths:
      - "publication_ready_pool.py"
      - "ready_story_publish.py"
      - "stories.txt"
      - "images/images.txt"
      - "images/relevance.json"
      - "images/logos/**"
      - "images/targeted-*"
      - "images/rt-*"
      - "state/story_briefs/**"
      - "state/story_visuals/**"
      - ".github/workflows/ready-story-pool.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ready-story-pool
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/all-story-visuals-2026-08-29
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rebuild evidence-backed READY_TO_POST list
        env:
          POST_TO_SNAPCHAT: "0"
          DRY_RUN: "1"
        run: python publication_ready_pool.py

      - name: Commit READY state when it changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ready_to_post.json
          if git diff --cached --quiet; then
            echo "READY_TO_POST state unchanged"
          else
            git commit -m "state: refresh READY_TO_POST pool"
            git pull --rebase origin repair/all-story-visuals-2026-08-29
            git push origin HEAD:repair/all-story-visuals-2026-08-29
          fi
