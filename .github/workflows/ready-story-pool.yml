name: Refresh READY story pool

on:
  push:
    paths:
      - "ready_story_publish.py"
      - "stories.txt"
      - "images/images.txt"
      - "images/relevance.json"
      - "images/logos/**"
      - "images/targeted-*"
      - "images/rt-*"
      - ".github/workflows/ready-story-pool.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ready-story-pool
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/all-story-visuals-2026-08-29
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rebuild strict READY_FOR_SNAP list
        env:
          POST_TO_SNAPCHAT: "0"
          DRY_RUN: "1"
        run: python ready_story_publish.py --refresh-only

      - name: Sync READY choices into repair workflow
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ready = json.loads(Path('state/ready_to_post.json').read_text(encoding='utf-8'))['stories']
          path = Path('.github/workflows/story.yml')
          text = path.read_text(encoding='utf-8')
          start = '          # READY_STORY_OPTIONS_START\n'
          end = '          # READY_STORY_OPTIONS_END\n'
          if start not in text or end not in text:
              raise SystemExit('READY story option markers missing from story.yml')
          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          options = ''.join(f'          - {json.dumps(story, ensure_ascii=False)}\n' for story in ready)
          path.write_text(before + start + options + end + after, encoding='utf-8')
          print(f'Synced {len(ready)} READY choices')
          PY

      - name: Commit READY list when it changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ready_to_post.json .github/workflows/story.yml
          if git diff --cached --quiet; then
            echo "READY list and repair dropdown unchanged"
          else
            git commit -m "state: refresh READY_FOR_SNAP pool"
            git push origin HEAD:repair/all-story-visuals-2026-08-29
          fi

      - name: Sync READY choices to live workflow on main
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/story-main
          git worktree add /tmp/story-main origin/main
          python - <<'PY'
          import json
          from pathlib import Path

          ready = json.loads(Path('state/ready_to_post.json').read_text(encoding='utf-8'))['stories']
          path = Path('/tmp/story-main/.github/workflows/story.yml')
          text = path.read_text(encoding='utf-8')
          start = '          # READY_STORY_OPTIONS_START\n'
          end = '          # READY_STORY_OPTIONS_END\n'
          if start not in text or end not in text:
              raise SystemExit('READY story option markers missing from main story.yml')
          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          options = ''.join(f'          - {json.dumps(story, ensure_ascii=False)}\n' for story in ready)
          path.write_text(before + start + options + end + after, encoding='utf-8')
          print(f'Synced {len(ready)} READY choices to main')
          PY
          cd /tmp/story-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/story.yml
          if git diff --cached --quiet; then
            echo "Live dropdown unchanged"
            exit 0
          fi
          git commit -m "ops: sync READY story dropdown"
          git push origin HEAD:main
