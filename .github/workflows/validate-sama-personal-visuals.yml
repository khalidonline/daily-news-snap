name: Validate SAMA personal visuals

on:
  push:
    branches:
      - validation/sama-personal-visuals

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/all-story-visuals-2026-08-29
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Render SAMA from locked editorial cache
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_PROVIDER: "bundle"
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          BUNDLE_BASE: ${{ vars.BUNDLE_BASE }}
          POST_TO_SNAPCHAT: "0"
          DRY_RUN: "1"
          STORY: "قصة تأسيس مؤسسة النقد ساما"
          STORY_OPERATION_MODE: "visual_only"
          STORY_REPAIR_FRAMES: "1,2,3,4,5,6"
          STORY_ALLOW_REPEAT: "1"
          ALLOW_GENERATED: "0"
          ALLOW_STORY_GENERATION: "0"
          STORY_FRAMES: "6"
          MEDIA_MODE: "github"
          THEME: "light"
          BRAND: "ملخص تنفيذي - قصة"
          FONT_FAMILY: "Almarai"
        run: python guarded_story_publish.py
      - name: Keep SAMA frames for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sama-personal-visuals-${{ github.run_id }}
          path: out/*.png
          retention-days: 7
          if-no-files-found: ignore
