name: Story to Snapchat

on:
  schedule:
    - cron: "0 11 * * *"       # 14:00 KSA daily
  workflow_dispatch:
    inputs:
      custom_story:
        description: "بحث سريع: اكتب اسم القصة أو كلمة مميزة (يتجاوز القائمة)"
        type: string
        required: false
      ready_story:
        description: "أو اختر قصة جاهزة للنشر من القائمة"
        type: choice
        required: true
        options:
          # READY_STORY_OPTIONS_START
          - "لماذا اختفت BlackBerry من السوق؟"
          - "كيف بنت TSMC احتكاراً على رقائق العالم"
          - "قصة Samsung: من متجر بقالة إلى عملاق إلكترونيات"
          - "كيف خسرت Kodak السوق الذي اخترعته بنفسها"
          - "قصة أرامكو: من اكتشاف الزيت إلى أكبر اكتتاب في التاريخ"
          - "قصة أزمة 2008: كيف بدأت وكيف انتهت؟"
          - "لماذا ارتبط الريال السعودي بالدولار وكيف؟"
          - "قصة الرياض: من بلدة مسورة إلى عاصمة اقتصادية"
          - "كيف تحولت العلا من واحة إلى وجهة عالمية؟"
          - "قصة جدة التاريخية: بوابة الحج منذ قرون"
          - "قصة نيويورك: كيف صارت عاصمة المال؟"
          - "من هو مؤسس أرامكو الحقيقي؟ قصة الاكتشاف الأول"
          - "من بنى Alibaba؟ قصة معلم إنجليزي رُفض 30 مرة"
          - "قصة CP/M: النظام الذي كاد يسبق Microsoft ثم اختفى"
          - "Jack Bogle: أنشأ صندوق المؤشرات ورفض أن يصبح ملياردير"
          - "سليمان الراجحي: من حمّال في السوق إلى مؤسس أكبر بنك ثم تبرّع بثروته"
          - "صالح الراجحي: الشريك الذي بنى المؤسسة وابتعد عن الأضواء"
          - "من هم أول الموظفين السعوديين في أرامكو؟"
          - "قصة القهوة السعودية"
          - "قصة المكيّف الذي جعل مدن الخليج ممكنة"
          - "قصة ماء زمزم وكيف يُعبأ ويوزّع"
          - "قصة مصرف الراجحي من صرافة إلى أكبر بنك"
          - "قصة المراعي من مزرعة إلى أكبر شركة ألبان"
          - "قصة صالح كامل ودلة البركة"
          - "قصة ربط الريال بالدولار وقصته"
          - "قصة كريم من الفكرة إلى استحواذ أوبر"
          - "قصة دخول لوسيد ومصنعها في السعودية"
          - "قصة سكة حديد الرياض الدمام 1951"
          - "قصة Rolex وصناعة الفخامة"
          - "قصة Publix: سلسلة متاجر يملكها موظفوها بالكامل"
          # READY_STORY_OPTIONS_END
      dry_run:
        description: "Render only — don't publish"
        type: boolean
        default: false
      post:
        description: "Publish to Snapchat now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: story
  cancel-in-progress: true

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/all-story-visuals-2026-08-29
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and publish one strict-ready story
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_PROVIDER: "bundle"
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          BUNDLE_BASE: ${{ vars.BUNDLE_BASE }}
          POST_TO_SNAPCHAT: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.post)) && '1' || '0' }}
          MONTHLY_POST_LIMIT: "145"
          STORY: ${{ inputs.custom_story || inputs.ready_story || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          MEDIA_MODE: "github"
          THEME: "light"
          BRAND: "ملخص تنفيذي - قصة"
          FONT_FAMILY: "Almarai"
          STORY_MODEL: "claude-opus-5"
          STORY_FRAMES: "6"
          ALLOW_GENERATED: "0"
          ALLOW_STORY_GENERATION: "0"
          STORY_ALLOW_REPEAT: "1"
          IMAGE_GEN: "byteplus"
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ vars.ARK_MODEL }}
        run: python ready_story_publish.py

      - name: Keep the frames for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-frames-${{ github.run_id }}
          path: out/*.png
          retention-days: 7
          if-no-files-found: ignore
