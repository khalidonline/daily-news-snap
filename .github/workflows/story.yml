name: Story to Snapchat

on:
  schedule:
    - cron: "0 11 * * *"       # 14:00 KSA daily
  push:
    paths:
      - ".github/story-live-trigger"
  workflow_dispatch:
    inputs:
      story:
        description: "القصة — اتركها فارغة لاختيار قصة من READY_FOR_SNAP"
        type: string
        required: false
      dry_run:
        description: "Render only — don't publish"
        type: boolean
        default: false
      post:
        description: "Publish to Snapchat now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: story
  cancel-in-progress: true

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # The strict visual repairs live here while backlog work continues.
          # Scheduled publishing must use the same authoritative repaired pool.
          ref: repair/all-story-visuals-2026-08-29
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and publish one strict-ready story
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_PROVIDER: "bundle"
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          BUNDLE_BASE: ${{ vars.BUNDLE_BASE }}
          POST_TO_SNAPCHAT: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.post)) && '1' || '0' }}
          MONTHLY_POST_LIMIT: "145"
          STORY: ${{ inputs.story }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          MEDIA_MODE: "github"
          THEME: "light"
          BRAND: "ملخص تنفيذي - قصة"
          FONT_FAMILY: "Almarai"
          STORY_MODEL: "claude-opus-5"
          STORY_FRAMES: "6"
          ALLOW_GENERATED: "0"
          ALLOW_STORY_GENERATION: "0"
          STORY_ALLOW_REPEAT: "1"
          IMAGE_GEN: "byteplus"
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ vars.ARK_MODEL }}
        run: python ready_story_publish.py

      - name: Keep the frames for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-frames-${{ github.run_id }}
          path: out/*.png
          retention-days: 7
          if-no-files-found: ignore
