name: Story to Snapchat

on:
  schedule:
    - cron: "0 17 * * *"       # 20:00 KSA daily
  workflow_dispatch:
    inputs:
      story:
        description: "القصة — اتركها فارغة لاختيار قصة من stories.txt"
        type: string
        required: false
      dry_run:
        description: "Render only — don't publish"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: story
  cancel-in-progress: true

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and post the story
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_PROVIDER: "bundle"
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          # hybrid on purpose: six frames get read before they go out.
          # Telegram delivers them; posting is a manual decision.
          POST_TO_SNAPCHAT: "0"      # 0 = hybrid, 1 = post automatically
          MONTHLY_POST_LIMIT: "145"
          STORY: ${{ inputs.story }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          MEDIA_MODE: "github"
          THEME: "light"
          BRAND: "ملخص تنفيذي - قصة"
          FONT_FAMILY: "Almarai"
          IMAGE_SOURCE: "openverse"
          STORY_MODEL: "claude-opus-5"
          STORY_FRAMES: "6"          # 4 to 7
          ALLOW_GENERATED: "1"
          ALLOW_STORY_GENERATION: "0"   # real photos only for stories
          STORY_ALLOW_REPEAT: "1"       # reuse a photo rather than lose the story
          IMAGE_GEN: "byteplus"
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ vars.ARK_MODEL }}
        run: python story_bot.py

      # A dry run returns before it notifies, and this is the only workflow
      # with no artifact — so a story dry run used to produce nothing you
      # could look at anywhere. Six frames are worth inspecting before they
      # go out as a series.
      - name: Keep the frames for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-frames-${{ github.run_id }}
          path: out/*.png
          retention-days: 7
          if-no-files-found: ignore
