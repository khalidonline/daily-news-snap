name: Daily Story review / manual Snapchat

on:
  push:
    paths:
      - "scheduler/triggers/story.txt"
  schedule:
    - cron: "0 11 * * *"       # temporary fallback: 14:00 KSA daily
  repository_dispatch:
    types: [story-schedule]
  workflow_dispatch:
    inputs:
      scheduled_slot:
        description: "Scheduler-only ISO KSA slot; leave empty for manual run"
        type: string
        required: false
      custom_story:
        description: "بحث سريع: اكتب اسم القصة أو كلمة مميزة (يتجاوز القائمة)"
        type: string
        required: false
      ready_story:
        description: "أو اختر قصة جاهزة للمراجعة من القائمة"
        type: choice
        required: true
        options:
          # READY_STORY_OPTIONS_START
          - "قصة الرياض: من بلدة مسورة إلى عاصمة اقتصادية"
          # READY_STORY_OPTIONS_END
      operation_mode:
        description: "Editorial operation mode"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - visual_only
          - regenerate_editorial
      repair_frames:
        description: "Visual-only: comma-separated frame numbers to force repair (example: 2,5)"
        type: string
        required: false
      dry_run:
        description: "Render review artifact only"
        type: boolean
        default: true
      post:
        description: "Reserved — approval is required before any delivery"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout scheduler state from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve Story schedule slot
        env:
          REQUESTED_SLOT: ${{ github.event.client_payload.slot || inputs.scheduled_slot || '' }}
        run: |
          python3 shared_schedule_gate.py due \
            --bot story \
            --event-name "${{ github.event_name }}" \
            --requested-slot "$REQUESTED_SLOT" \
            --requested-slot-file scheduler/triggers/story.txt \
            --state state/story_schedule_slots.json \
            --github-env "$GITHUB_ENV"
          cp shared_schedule_gate.py /tmp/shared_schedule_gate.py

      - name: Resolve dated owner Story selection
        if: ${{ env.RUN_SCHEDULED_BOT != '0' && github.event_name != 'workflow_dispatch' }}
        run: |
          python3 scheduled_story_selection.py \
            --selection state/story_selection.json \
            --catalog stories.txt \
            --github-env "$GITHUB_ENV"

      - name: Checkout Story repair branch
        if: ${{ env.RUN_SCHEDULED_BOT != '0' }}
        uses: actions/checkout@v4
        with:
          ref: repair/all-story-visuals-2026-08-29
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: ${{ env.RUN_SCHEDULED_BOT != '0' }}
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: ${{ env.RUN_SCHEDULED_BOT != '0' }}

      - name: Build frozen Story review artifact
        if: ${{ env.RUN_SCHEDULED_BOT != '0' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_TO_SNAPCHAT: "0"
          STORY_HUMAN_APPROVED: "0"
          MONTHLY_POST_LIMIT: "145"
          STORY: ${{ inputs.custom_story || inputs.ready_story || env.SCHEDULED_STORY || '' }}
          STORY_OPERATION_MODE: ${{ inputs.operation_mode || 'auto' }}
          STORY_REPAIR_FRAMES: ${{ inputs.repair_frames || '' }}
          STORY_REGENERATION_NONCE: ${{ inputs.operation_mode == 'regenerate_editorial' && github.run_id || '' }}
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' && '1' || (inputs.dry_run && '1' || '') }}
          MEDIA_MODE: "github"
          THEME: "light"
          BRAND: "ملخص تنفيذي - قصة"
          FONT_FAMILY: "Almarai"
          STORY_MODEL: "claude-opus-5"
          STORY_MODEL_INPUT_USD_PER_M: "5"
          STORY_MODEL_OUTPUT_USD_PER_M: "25"
          STORY_AUX_MAX_PAID_RESPONSES: "50"
          STORY_FRAMES: "6"
          ALLOW_GENERATED: "0"
          ALLOW_STORY_GENERATION: "0"
          STORY_ALLOW_REPEAT: "1"
          IMAGE_GEN: "byteplus"
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ vars.ARK_MODEL }}
        run: python guarded_story_publish.py

      - name: Story cost summary
        if: ${{ always() && env.RUN_SCHEDULED_BOT != '0' }}
        run: python story_cost_report.py --last 1 >> "$GITHUB_STEP_SUMMARY"

      - name: Keep exact Story deck for approval
        if: ${{ always() && env.RUN_SCHEDULED_BOT != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: story-review-${{ github.run_id }}
          path: |
            out/*.png
            out/story-review.json
            state/model_usage.jsonl
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark Story slot complete on main
        if: ${{ success() && env.RUN_SCHEDULED_BOT != '0' && env.SCHEDULE_SLOT_ID != '' }}
        run: |
          git stash push --include-untracked -m "story-slot-transition"
          git checkout main
          git pull --ff-only origin main
          python3 /tmp/shared_schedule_gate.py mark --slot "$SCHEDULE_SLOT_ID" --state state/story_schedule_slots.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/story_schedule_slots.json
          git commit -m "state: complete story slot $SCHEDULE_SLOT_ID"
          git pull --rebase origin main
          git push origin HEAD:main
