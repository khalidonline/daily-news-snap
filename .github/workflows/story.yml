name: Daily Story to Telegram / manual Snapchat

on:
  schedule:
    - cron: "0 11 * * *"       # 14:00 KSA daily — Telegram only
  workflow_dispatch:
    inputs:
      custom_story:
        description: "بحث سريع: اكتب اسم القصة أو كلمة مميزة (يتجاوز القائمة)"
        type: string
        required: false
      ready_story:
        description: "أو اختر قصة جاهزة للنشر من القائمة"
        type: choice
        required: true
        options:
          # READY_STORY_OPTIONS_START
          - "قصة الرياض: من بلدة مسورة إلى عاصمة اقتصادية"
          # READY_STORY_OPTIONS_END
      operation_mode:
        description: "Editorial operation mode"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - visual_only
          - regenerate_editorial
      repair_frames:
        description: "Visual-only: comma-separated frame numbers to force repair (example: 2,5)"
        type: string
        required: false
      dry_run:
        description: "Render only — don't publish"
        type: boolean
        default: false
      post:
        description: "Manual only — publish to Snapchat now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: story
  cancel-in-progress: true

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/all-story-visuals-2026-08-29
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and deliver story
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_PROVIDER: "bundle"
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          BUNDLE_BASE: ${{ vars.BUNDLE_BASE }}
          POST_TO_SNAPCHAT: ${{ (github.event_name == 'workflow_dispatch' && inputs.post) && '1' || '0' }}
          MONTHLY_POST_LIMIT: "145"
          STORY: ${{ inputs.custom_story || inputs.ready_story || '' }}
          STORY_OPERATION_MODE: ${{ inputs.operation_mode || 'auto' }}
          STORY_REPAIR_FRAMES: ${{ inputs.repair_frames || '' }}
          STORY_REGENERATION_NONCE: ${{ inputs.operation_mode == 'regenerate_editorial' && github.run_id || '' }}
          DRY_RUN: ${{ github.event_name == 'schedule' && '1' || (inputs.dry_run && '1' || '') }}
          MEDIA_MODE: "github"
          THEME: "light"
          BRAND: "ملخص تنفيذي - قصة"
          FONT_FAMILY: "Almarai"
          STORY_MODEL: "claude-opus-5"
          STORY_FRAMES: "6"
          ALLOW_GENERATED: "0"
          ALLOW_STORY_GENERATION: "0"
          STORY_ALLOW_REPEAT: "1"
          IMAGE_GEN: "byteplus"
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ vars.ARK_MODEL }}
        run: python guarded_story_publish.py

      - name: Keep the frames for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-frames-${{ github.run_id }}
          path: out/*.png
          retention-days: 7
          if-no-files-found: ignore
