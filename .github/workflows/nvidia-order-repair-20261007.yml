name: Repair approved NVIDIA story order
on:
  push:
    paths:
      - '.github/workflows/nvidia-order-repair-20261007.yml'
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Run owner-approved NVIDIA order repair 20261007-1333'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f94dee278276691131b85d1c4c69514c699a70f2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-v2-images.txt pytest
      - name: Offline safety checks
        run: |
          python -m pytest -q tests/test_v2_bundle.py tests/test_v2_publication_selection.py tests/test_v2_readability.py
          python -m py_compile approved/nvidia-order-repair-20261007/publish.py
      - name: Deliver authorized second card after verified first
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: .
        run: python approved/nvidia-order-repair-20261007/publish.py
