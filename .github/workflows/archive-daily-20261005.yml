name: Save final daily packages 20261005
on:
  push:
    paths:
      - '.github/workflows/archive-daily-20261005.yml'
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  save:
    if: github.event.head_commit.message == 'Save exact final daily packages 20261005 authorized'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 08dce7b5877dea29eb37034adaf46692979cc17f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Test Saved Story guards
        run: python -m unittest discover -s tests -p test_v2_saved_story_api.py -v
      - name: Save exact published editions with live reconciliation and quota reserve
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: .
        run: python approved/saved-stories/daily-20261005/save_batch.py
