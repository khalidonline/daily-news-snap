name: Apply daily sports balance

on:
  push:
    branches:
      - fix/daily-sports-balance
    paths:
      - .github/workflows/patch-daily-sports-balance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply rolling sports balance guard
        run: python scripts/patch_daily_sports_balance.py
      - name: Commit patched runner
        run: |
          rm .github/workflows/patch-daily-sports-balance.yml
          rm scripts/patch_daily_sports_balance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_news_runner.py .github/workflows/patch-daily-sports-balance.yml scripts/patch_daily_sports_balance.py
          git commit -m "fix: enforce rolling daily sports balance"
          git push
