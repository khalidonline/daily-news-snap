name: Recover 11am News card once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-news-11am-once.yml"

permissions:
  contents: write

concurrency:
  group: news-brief
  cancel-in-progress: false

jobs:
  recover:
    if: "github.event.head_commit.message == 'ops: recover 11am News card once'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Render and send exact recovery card
        env:
          RUN_SCHEDULED_BOT: "1"
          NEWS_RECOVERY_STORY_B64: ""
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.NEWS_MODEL || 'claude-sonnet-5' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_PROVIDER: "bundle"
          DRY_RUN: ""
          MEDIA_MODE: "github"
          POST_TO_SNAPCHAT: "0"
          MONTHLY_POST_LIMIT: "145"
          BRIEF_TITLE: "ملخص تنفيذي - خبر"
          BRAND: "ملخص تنفيذي - خبر"
          FONT_FAMILY: "Almarai"
          REQUIRE_PHOTO: "1"
          IMAGE_SOURCE: "auto"
          LOOKBACK_HOURS: "48"
          REMEMBER_DAYS: "3"
          MODEL_BOT: "news"
          MODEL_USAGE_PATH: "out/model_usage.jsonl"
          VISION_MAX_PAID_RESPONSES: "12"
        run: python daily_news_fresh_runner.py

      - name: Verify card
        run: test -n "$(find out -maxdepth 1 -name '*.png' -print -quit)"

# armed after installation
