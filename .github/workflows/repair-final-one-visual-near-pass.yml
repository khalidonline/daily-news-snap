name: Repair final one-visual near-PASS stories

on:
  push:
    branches:
      - fix/final-one-visual-near-pass

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-one-visual-near-pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Add and verify ticket-pricing and Tokyo visuals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import story_runtime as sr

          ticket_story = "لماذا تختلف أسعار التذاكر بين يوم وآخر؟ قصة التسعير"
          tokyo_story = "لماذا صارت طوكيو أكبر مدينة في العالم؟"

          for story in (ticket_story, tokyo_story):
              before, _ = sr.approved_runtime_visuals(story)
              print("BEFORE", story, len(before), [p.name for p in before])
              if len(before) != 3:
                  raise SystemExit(f"expected 3 visuals before repair for {story}, got {len(before)}")

          def commons_download(source_name, dest_name):
              encoded = urllib.parse.quote(source_name)
              url = f"https://commons.wikimedia.org/wiki/Special:Redirect/file/{encoded}"
              req = urllib.request.Request(url, headers={"User-Agent": "daily-news-snap/1.0 (Story visual curation)"})
              with urllib.request.urlopen(req, timeout=45) as response:
                  Path("images", dest_name).write_bytes(response.read())

          commons_download("Airplane On Boarding Passes (44325226790).jpg", "airplane-boarding-passes.jpg")
          commons_download("Tokyo Skyline.jpg", "tokyo-skyline-2005.jpg")

          index = Path("images/images.txt")
          additions = [
              "airplane-boarding-passes.jpg | أسعار التذاكر, تذاكر الطيران, airline ticket pricing, airline tickets, flight prices, boarding passes | Jernej Furman / CC BY 2.0 — Wikimedia Commons",
              "tokyo-skyline-2005.jpg | Tokyo, طوكيو, Tokyo skyline, أفق طوكيو, urban Tokyo | Ningyou / Public domain — Wikimedia Commons",
          ]
          text = index.read_text(encoding="utf-8").rstrip()
          for line in additions:
              if line not in text:
                  text += "\n" + line
          index.write_text(text + "\n", encoding="utf-8")

          for story in (ticket_story, tokyo_story):
              after, _ = sr.approved_runtime_visuals(story)
              photos, logos, status = sr.coverage(story)
              print("AFTER", story, len(after), [p.name for p in after])
              print("STATUS", story, status, len(photos), len(logos))
              if len(after) < 4 or status != "PASS":
                  raise SystemExit(f"repair did not make {story} PASS")
          PY

          git config user.name "story-visual-repair-bot"
          git config user.email "actions@github.com"
          git add images/airplane-boarding-passes.jpg images/tokyo-skyline-2005.jpg images/images.txt
          git commit -m "assets: complete ticket-pricing and Tokyo visuals"
          git push origin HEAD:fix/final-one-visual-near-pass
