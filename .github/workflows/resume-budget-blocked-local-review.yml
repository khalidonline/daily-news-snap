name: Resume budget-blocked local review
on:
  push:
    branches: [main]
    paths:
      - 'resume-review-trigger.txt'
permissions:
  contents: write
  actions: read
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'khalidonline/daily-news-snap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install established renderer dependencies
        run: python -m pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Restore exact rendered frames from budget-blocked run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen
          gh run download 35985727972 -n agentic-packages-35985727972-1 -D frozen
          test -f frozen/local/bef7d2108be5f8ec/1/card-00.jpg
          test -f frozen/local/bef7d2108be5f8ec/1/card-04.jpg
      - name: Resume final reviewer only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_BUDGET_GITHUB_TOKEN: ${{ secrets.DAILY_BUDGET_GITHUB_TOKEN || github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTOPILOT_DAILY_LIMIT_MICRO_USD: '3000000'
        run: >-
          python resume_budget_blocked_review.py
          --source-slot autopilot-2026-09-24-local-shadow-f8519ad8abf12116
          --frames-root frozen/local/bef7d2108be5f8ec/1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resumed-local-review-${{ github.run_id }}
          path: resume-review-result.json
          retention-days: 14
