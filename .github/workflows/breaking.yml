name: Breaking news watch

# THE breaking-news schedule lives here, in one place:
#
#   */30 5-19 UTC  (every 30 min, 08:00–22:30 KSA) — the watcher. A small
#                  model scans the beats; when the full pipeline confirms a
#                  breaking event, the card is built and sent to Telegram for
#                  review. During the review phase nothing posts to Snapchat.
#                  The script accepts delayed starts until 23:00 KSA so
#                  GitHub cron jitter cannot discard the final 22:30 cycle.
#                  Quiet cycles exit quickly, commit nothing, and send one
#                  Telegram line — silence is a result, not a failure.
#
# There is NO evening replacement post: no breaking card unless something
# clears the gates. Direct Snapchat publishing stays disabled until the owner
# explicitly ends the Telegram review phase.

on:
  push:
    paths:
      - "scheduler/triggers/breaking.txt"
  schedule:
    - cron: "*/30 5-19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Review mode is enforced — classify/build only, never post"
        type: boolean
        default: true
      confirmed_event:
        description: "Optional already-confirmed event to reproduce; bypasses classifier and forces dry run"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # never cancel a run that may be building/delivering a review card; the
  # state lock in breaking_watch.py prevents duplicate work
  group: breaking
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Load confirmed-event recovery trigger
        if: ${{ github.event_name == 'push' }}
        run: |
          if [ "$(sed -n '1p' scheduler/triggers/breaking.txt)" = "confirmed" ]; then
            {
              echo "TRIGGER_CONFIRMED_EVENT=$(sed -n '2p' scheduler/triggers/breaking.txt)"
              echo "PINNED_EVENT_URL=$(sed -n '3p' scheduler/triggers/breaking.txt)"
            } >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Watch for confirmed breaking news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_PROVIDER: "bundle"
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          BUNDLE_BASE: ${{ vars.BUNDLE_BASE }}
          # Review phase is fail-closed at both levels: the watcher itself sees
          # DRY_RUN=1, and breaking_watch_entry.py forces POST_TO_SNAPCHAT=0
          # before launching the full breaking-card pipeline.
          DRY_RUN: "1"
          POST_TO_SNAPCHAT: "0"
          CONFIRMED_BREAKING_EVENT: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmed_event || '' }}
          MEDIA_MODE: "github"
          MONTHLY_POST_LIMIT: "145"
          BRIEF_TITLE: "ملخص تنفيذي - أعمال وتقنية"
          BRAND: "ملخص تنفيذي - خبر"
          FONT_FAMILY: "Almarai"
          REQUIRE_SAUDI_CONTEXT: ${{ vars.REQUIRE_SAUDI_CONTEXT }}
          MIN_TERM_HITS: ${{ vars.MIN_TERM_HITS }}
          MIN_PHOTO_SCORE: ${{ vars.MIN_PHOTO_SCORE }}
          THEME: "light"
          STORIES_PER_DAY: "1"
          CANDIDATES: "8"
          REQUIRE_PHOTO: "1"
          IMAGE_SOURCE: "spa"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          LOOKBACK_HOURS: "10"
          REMEMBER_DAYS: "3"
          WATCH_MODEL: ${{ vars.WATCH_MODEL }}
          MODEL_BOT: "breaking"
          MODEL_USAGE_PATH: "out/model_usage.jsonl"
          MODEL_MAX_USD_PER_RUN: "1"
          BREAKING_MAX_PAID_RESPONSES: "1"
          NEWS_MAX_PAID_RESPONSES: "2"
          VISION_MAX_PAID_RESPONSES: "30"
        run: python breaking_watch_entry.py

      - name: Model cost summary
        if: always()
        run: python model_usage.py summarize --path out/model_usage.jsonl >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the card for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breaking-card-${{ github.run_id }}
          path: |
            out/*.png
            out/model_usage.jsonl
          retention-days: 7
          if-no-files-found: ignore
