name: Reconcile and publish approved Apple 20260925
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apple-recovery-20260925-1942.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  recover:
    if: github.event.head_commit.message == 'Read Apple daily quota and reconcile refusal'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0273d845fb749169de249b4631b00aef0cc6d883
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Reconcile exact upload and publish saved cards
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          AUTOPILOT_DAILY_LIMIT_MICRO_USD: '3000000'
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error, urllib.parse
          from datetime import datetime, timezone
          from publishing_v2.bundle_api import BundleClient, GitHubJournal
          import publishing_v2.apple_correction as correction
          original = urllib.request.urlopen
          def observed(req, *args, **kwargs):
              try:
                  return original(req, *args, **kwargs)
              except urllib.error.HTTPError as exc:
                  raw = exc.read(65536).decode('utf-8', 'replace').lower()
                  print(json.dumps({'http_failure': exc.code, 'method': req.get_method(),
                    'path': urllib.parse.urlsplit(req.full_url).path,
                    'response_kind': 'json' if raw.lstrip().startswith('{') else 'other',
                    'markers': [s for s in ['cloudflare','1010','permission','forbidden','subscription','quota','limit','unauthorized','team','plan'] if s in raw]}), flush=True)
                  raise
          urllib.request.urlopen = observed
          client = BundleClient()
          account = client.call('/social-account/by-type?' + urllib.parse.urlencode({'type':'SNAPCHAT','teamId':client.team}))
          from publishing_v2.bundle_api import verify_account
          verify_account(account,client.team)
          usage = client.call('/organization/usage/daily-limits?' + urllib.parse.urlencode({'socialAccountId':account['id']}))
          print(json.dumps({'daily_quota':{k:usage.get(k) for k in ('date','type','posts')}}),flush=True)
          identity = '68dbb5b911fa8b48b01b0aeb175941ae002cc1ec2289168b211998f378010443'
          journal = GitHubJournal(identity)
          state = journal.read()
          row = state.get('1',{})
          if row.get('status') != 'SENDING' or row.get('post_id') or not row.get('upload_id'):
              raise SystemExit('Unexpected state; do not change journal')
          upload = client.call('/upload/' + urllib.parse.quote(row['upload_id'],safe=''))
          if upload.get('id') != row['upload_id'] or upload.get('teamId') != client.team or upload.get('posts') != []:
              raise SystemExit('Upload absence not confirmed; preserve uncertain state')
          proof={'status':'NOT_CREATED','checked_at':datetime.now(timezone.utc).isoformat(),
             'method':'provider_exact_upload_posts_empty','upload_id':row['upload_id'],
             'evidence_url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          state['reconciliation']=proof
          journal.save(state)
          print(json.dumps({'current_attempt':'NOT_CREATED','linked_posts':0,'daily_quota':usage.get('posts')}),flush=True)
          PY
