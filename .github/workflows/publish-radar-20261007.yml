name: Publish approved radar explainer
on:
  push:
    paths:
      - '.github/workflows/publish-radar-20261007.yml'
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Run approved radar explainer 20261007-112153'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d443ee152827d87da364bffad31a5728beb627b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-v2-images.txt pytest
      - name: Offline guard tests
        run: python -m pytest -q tests/test_v2_bundle.py tests/test_v2_readability.py tests/test_v2_publication_selection.py
      - name: Publish approved two cards and reconcile
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVED_COMMIT: 5d443ee152827d87da364bffad31a5728beb627b
          PYTHONPATH: .
        run: python approved/radar-explainer-20261007/publish-approved.py
