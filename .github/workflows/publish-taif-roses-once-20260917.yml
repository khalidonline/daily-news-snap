name: Publish approved Taif roses once

on:
  push:
    paths:
      - '.github/workflows/publish-taif-roses-once-20260917.yml'

permissions:
  contents: write

concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish approved Taif roses once 20260917 0900 Riyadh'
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved package
        uses: actions/checkout@v4
        with:
          ref: ac61f0ea1d2d46c166ccf461c8150f6bc36dad77

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify publication window
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          manifest = json.loads(Path("approved/taif-roses-20260917/manifest.json").read_text())
          now = datetime.now(timezone.utc)
          not_before = datetime.fromisoformat(manifest["not_before"].replace("Z", "+00:00"))
          expires_at = datetime.fromisoformat(manifest["expires_at"].replace("Z", "+00:00"))
          if not (not_before <= now < expires_at):
              raise SystemExit(f"Outside publication window: {now.isoformat()}")
          print("Publication window verified.")
          PY

      - name: Publish four approved cards
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m publishing_v2.bundle_api publish --manifest approved/taif-roses-20260917/manifest.json
