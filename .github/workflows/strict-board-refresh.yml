name: Refresh strict visual board

on:
  push:
    branches:
      - repair/all-story-visuals-2026-08-29
    paths:
      - ".github/strict-board-trigger"

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/all-story-visuals-2026-08-29
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Load authoritative board engine
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin repair/story-visual-coverage
          rm -rf /tmp/story-repair-engine
          mkdir -p /tmp/story-repair-engine
          git archive origin/repair/story-visual-coverage | tar -x -C /tmp/story-repair-engine
      - name: Build current strict board
        env:
          PYTHONPATH: /tmp/story-repair-engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          sys.path.insert(0, '/tmp/story-repair-engine')
          from tools.bulk_visual_board import build_board, repair_backlog, write_board

          rows = build_board()
          write_board(rows)
          passed = sum(r.status == 'PASS' for r in rows)
          failing = len(rows) - passed
          print(f"STRICT_BOARD PASS={passed} TOTAL={len(rows)} UNRESOLVED={failing}")
          print("NEAR_PASS_BEGIN")
          for r in repair_backlog(rows):
              deficit = r.need_photos + int(r.need_logo)
              if deficit > 2:
                  break
              print(
                  f"deficit={deficit} photos={len(r.photos)} logos={len(r.logos)} "
                  f"need_photos={r.need_photos} need_logo={int(r.need_logo)} | {r.story}"
              )
          print("NEAR_PASS_END")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: strict-visual-board
          path: out/bulk-visual-repair/
