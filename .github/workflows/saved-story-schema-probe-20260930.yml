name: Probe Bundle Saved Story schema
on:
  push:
    paths:
      - .github/workflows/saved-story-schema-probe-20260930.yml
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'khalidonline/daily-news-snap' && github.event.head_commit.message == 'Probe Bundle Saved Story schema 20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and inspect public OpenAPI schema
        run: |
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('https://api.bundle.social/swagger-json', timeout=30) as r:
              spec=json.load(r)
          print('OPENAPI', spec.get('openapi') or spec.get('swagger'))
          for path, methods in spec.get('paths', {}).items():
              blob=json.dumps(methods, sort_keys=True)
              if 'SAVED_STORY' in blob or ('post' in path.lower() and 'snapchat' in blob.lower()):
                  print('PATH', path)
                  print(json.dumps(methods, indent=2, sort_keys=True))
          for name, schema in spec.get('components', {}).get('schemas', {}).items():
              blob=json.dumps(schema, sort_keys=True)
              if 'SAVED_STORY' in blob or ('SNAPCHAT' in blob and 'uploadIds' in blob):
                  print('SCHEMA', name)
                  print(json.dumps(schema, indent=2, sort_keys=True))
          PY
