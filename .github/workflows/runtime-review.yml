name: Runtime visual review

on:
  pull_request:
    paths:
      - "tools/build_runtime_review.py"
      - "images/**"
      - "stories.txt"
      - "story_runtime.py"
      - "runtime_relevance.py"
      - ".github/workflows/runtime-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build runtime review artifact
        run: PYTHONPATH=. python tools/build_runtime_review.py
      - name: Upload runtime review
        uses: actions/upload-artifact@v4
        with:
          name: runtime-visual-review-${{ github.run_id }}
          path: out/runtime-review/**
          retention-days: 7
