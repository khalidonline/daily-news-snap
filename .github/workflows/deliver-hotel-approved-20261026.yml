name: Deliver approved hotel challenge only
on:
  push:
    branches: [main]
    paths: ['.github/hotel-approved-v2.trigger']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pillow
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Restore sealed video and reproduce hash-pinned review frames
        run: |
          tar -xJf approved/tourism-hotel-20261026.tar.xz
          for t in 0.5 3.5 4.5 5.5 6.5 7.5 8.5 11.5; do
            ffmpeg -nostdin -v error -y -ss "$t" -i approved/tourism-hotel-20261026/challenge.mp4 -frames:v 1 "approved/tourism-hotel-20261026/frame-$t.png"
          done
      - name: Validate and publish exact approved bytes to both destinations
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          POST_TO_SNAPCHAT: '1'
          DRY_RUN: '0'
        run: python -m approved.tourism-hotel-20261026.deliver
