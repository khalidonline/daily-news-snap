name: Prepare one Tawari fixed draft
on:
  workflow_dispatch:
    inputs:
      lane:
        description: Prepare exactly one editorial lane
        type: choice
        options: [daily, local]
        default: daily
      selection:
        description: Repository JSON path to a current source-bound evidence brief
        type: string
        required: true
      recovery:
        description: Optional reviewed held-recovery request path (blank for a new attempt)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  preview:
    if: github.repository == 'khalidonline/daily-news-snap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      # Required for existing budget/state journals, not content authorization.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install established renderer dependencies
        run: python -m pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Validate explicit evidence brief before paid work
        env:
          SELECTION: ${{ inputs.selection }}
          LANE: ${{ inputs.lane }}
          RECOVERY: ${{ inputs.recovery }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from publishing_v2.autopilot.free_selection import load_brief
          root = Path.cwd().resolve()
          path = Path(os.environ['SELECTION']).resolve()
          if not path.is_relative_to(root) or not path.is_file() or path.suffix != '.json':
              raise ValueError('repository_evidence_brief_required')
          brief = load_brief(path)
          if os.environ['LANE'] not in {'daily', 'local'} or brief.get('version') != 1 or brief.get('lane') != os.environ['LANE']:
              raise ValueError('matching_single_lane_brief_required')
          if os.environ.get('RECOVERY'):
              recovery = Path(os.environ['RECOVERY']).resolve()
              if not recovery.is_relative_to(root / 'editorial/recovery') or not recovery.is_file():
                  raise ValueError('repository_recovery_request_required')
          PY
      - name: Prepare one fixed information draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_BUDGET_GITHUB_TOKEN: ${{ secrets.DAILY_BUDGET_GITHUB_TOKEN || github.token }}
          AUTOPILOT_SELECTION_PATH: ${{ inputs.selection }}
          AUTOPILOT_RECOVERY_REQUEST: ${{ inputs.recovery }}
          AUTOPILOT_LANE: ${{ inputs.lane }}
          AUTOPILOT_MODE: fixed-preview
          AUTOPILOT_EDITOR_MODEL: claude-sonnet-5
          AUTOPILOT_RESEARCHER_MODEL: claude-opus-5
          AUTOPILOT_WRITER_MODEL: claude-opus-5
          AUTOPILOT_VISUAL_MODEL: claude-sonnet-5
          AUTOPILOT_REVIEWER_MODEL: claude-sonnet-5
          POST_TO_SNAPCHAT: '0'
          DRY_RUN: '1'
        run: python -m publishing_v2.autopilot.runtime --mode fixed-preview --lane "$AUTOPILOT_LANE"
      - name: Resolve this attempt's staged package
        id: package
        if: always()
        run: |
          python - <<'PYTHON'
          import json, os, re, subprocess
          from pathlib import Path
          summary = Path('autopilot-output/summary.json')
          if summary.is_file():
              result = json.loads(summary.read_text())
              rows = result.get('results', [])
              if result.get('mode') != 'fixed-preview' or len(rows) != 1:
                  raise ValueError('single_fixed_preview_result_required')
              handoff = rows[0].get('information_package') or {}
              value = handoff.get('package')
              if value:
                  if not isinstance(value, str) or not re.fullmatch(r'approved/tawari-[0-9]{8}-(daily|local)-[0-9a-f]{12}', value):
                      raise ValueError('invalid_staged_package_path')
                  root, path = Path.cwd().resolve(), Path(value)
                  if not path.is_dir() or not path.resolve().is_relative_to(root / 'approved'):
                      raise ValueError('staged_package_missing_or_unsafe')
                  if any(p.is_symlink() for p in [path, *path.rglob('*')]):
                      raise ValueError('staged_package_symlink_forbidden')
                  if subprocess.check_output(['git', 'ls-files', '--', value]).strip():
                      raise ValueError('historical_package_is_not_new_trial_output')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                      out.write('path=' + value + '/\n')
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tawari-fixed-draft-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            autopilot-output/
            ${{ steps.package.outputs.path }}
          retention-days: 14
