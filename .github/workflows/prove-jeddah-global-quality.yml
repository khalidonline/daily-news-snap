name: Prove Jeddah global Story quality gate

on:
  push:
    branches: [review/jeddah-global-quality-proof]
    paths:
      - '.github/workflows/prove-jeddah-global-quality.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/jeddah-global-quality-proof
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Render cached Jeddah deck through global quality gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POST_TO_SNAPCHAT: '0'
          STORY_HUMAN_APPROVED: '0'
          DRY_RUN: '1'
          STORY: 'قصة أول مطار في جدة وتطور الطيران المدني'
          STORY_OPERATION_MODE: 'auto'
          STORY_ALLOW_REPEAT: '1'
          STORY_FRAMES: '6'
          MEDIA_MODE: 'github'
          THEME: 'light'
          BRAND: 'ملخص تنفيذي - قصة'
          FONT_FAMILY: 'Almarai'
          STORY_MODEL: 'claude-opus-5'
          ALLOW_GENERATED: '0'
          ALLOW_STORY_GENERATION: '0'
          STORY_SUPPRESS_TELEGRAM: '1'
        run: python guarded_story_publish.py
      - name: Upload blocked diagnostic deck
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jeddah-global-quality-proof-${{ github.run_id }}
          path: |
            out/*.png
            out/story-review.json
          retention-days: 1
          if-no-files-found: ignore
