name: Dates schema and receipt diagnosis
on:
  push:
    paths: ['.github/workflows/dates-diagnose-20261004.yml']
permissions:
  contents: read
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose dates 20261004 1220 read only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: 'b26f4a76109a7177b4a9326cfd379e3fa1801982'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read current schema and inventory only
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse
          from publishing_v2.bundle_api import BundleClient
          req=urllib.request.Request('https://api.bundle.social/swagger-json',headers={'User-Agent':'ExecutiveSaudiPublisher/1.0'})
          doc=json.load(urllib.request.urlopen(req))
          print('SCHEMA_ROOT',list(doc))
          def walk(x,path=''):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k=='SNAPCHAT': print('SNAP_SCHEMA',path+'/'+k,json.dumps(v))
                      elif k in ('/api/v1/post/','/post/','/api/v1/post','/post'): print('POST_SCHEMA',path+'/'+k,json.dumps(v)[:3000])
                      walk(v,path+'/'+k)
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,path+'/'+str(i))
          walk(doc)
          c=BundleClient();c.check()
          offset=0;matches=[];examples=[]
          ids={'c7127bc3-266c-4037-84b8-11442b361c1d','ca5aafa8-ae4e-43d4-b96a-10b2ab32e85e'}
          while True:
              r=c.call('/post/?'+urllib.parse.urlencode({'teamId':c.team,'offset':offset,'limit':100}))
              assert isinstance(r.get('items'),list) and type(r.get('total')) is int
              for row in r['items']:
                  snap=(row.get('data') or {}).get('SNAPCHAT') or {}
                  if ids.intersection(snap.get('uploadIds') or []) or row.get('referenceKey')=='story-d2ec1f199c92e70c4d5652675d5b39c6daac2f74f0412fd03d0d57024be0b355':
                      matches.append({k:row.get(k) for k in ('id','status','referenceKey','data','externalData')})
                  if len(examples)<3 and row.get('status')=='POSTED' and snap.get('type')=='STORY':
                      examples.append({k:row.get(k) for k in ('id','status','referenceKey','data','externalData')})
              offset+=len(r['items'])
              if offset>=r['total']: break
              assert r['items'] and offset<10000
          print('MATCHES',json.dumps(matches))
          print('SUCCESS_EXAMPLES',json.dumps(examples))
          print('QUOTA',json.dumps(c.ensure_capacity(0) or c.ensure_capacity(1)))
          PY
