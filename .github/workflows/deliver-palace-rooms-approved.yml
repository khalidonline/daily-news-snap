name: Deliver approved palace rooms challenge only
on:
  push:
    branches: [main]
    paths: ['.github/palace-rooms-approved.trigger']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: timeout 120 python -m pip install pillow
      - name: Ensure FFmpeg with bounded installation
        timeout-minutes: 7
        run: command -v ffmpeg || (sudo timeout 90 apt-get update -qq && sudo timeout 300 apt-get install -y --no-install-recommends ffmpeg)
      - name: Restore sealed video and restore original hash-pinned review frames
        run: |
          cat approved/palace-rooms-20261110.tar.xz.part-* | tar -xJf -
      - name: Validate and publish exact approved bytes to both destinations
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          POST_TO_SNAPCHAT: '1'
          DRY_RUN: '0'
        run: python -m approved.palace-rooms-20261110.deliver
