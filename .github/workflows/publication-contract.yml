name: Publication contract - offline only
on: [pull_request, push]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=12.1' pytest fonttools
      - run: python -m publishing_v2.route_inventory
      - run: python -m pytest tests/test_v2_design_contract.py tests/test_v2_route_inventory.py -q
