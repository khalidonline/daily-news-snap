name: Publication contract - offline only
on: [pull_request, push]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bounded video tooling
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: python -m pip install 'Pillow>=12.1' pytest fonttools
      - run: python -m publishing_v2.route_inventory
      - run: >-
          python -m pytest tests/test_v2_design_contract.py tests/test_v2_route_inventory.py
          tests/test_v2_prepared_information.py tests/test_v2_deliver_information.py
          tests/test_v2_bundle.py tests/test_v2_bundle_group.py tests/test_v2_saved_story_api.py
          tests/test_v2_challenge_contract.py tests/test_v2_challenge_visual_review.py
          tests/test_v2_deliver_challenge.py tests/test_v2_challenge_request.py -q
