name: Deliver approved Halloween card and archive
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'khalidonline/daily-news-snap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pillow
      - name: Validate exact approved final card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m publishing_v2.bundle_api validate --manifest approved/halloween-20261031/manifest.json
      - name: Publish to public Story without regeneration
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          POST_TO_SNAPCHAT: '1'
          DRY_RUN: '0'
        run: python -m publishing_v2.bundle_api publish --manifest approved/halloween-20261031/manifest.json
      - name: Archive confirmed Story to public profile
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          POST_TO_SNAPCHAT: '1'
          DRY_RUN: '0'
        run: python -m publishing_v2.saved_story_api --approval approved/halloween-20261031/archive-approval.json
