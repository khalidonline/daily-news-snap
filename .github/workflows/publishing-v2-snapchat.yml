name: Approved Snapchat API
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publishing-v2-snapchat.yml', 'publishing_v2/bundle_api.py']
  workflow_dispatch:
    inputs:
      mode:
        description: Check connection, validate files without publishing, or publish
        type: choice
        options: [check, validate, publish]
        default: check
      manifest:
        description: Repository path to approved JSON manifest (validate or publish)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'khalidonline/daily-news-snap' && github.ref == 'refs/heads/main' && inputs.mode != 'validate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify API key and connected Snapchat account (read only)
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
        run: python -m publishing_v2.bundle_api check
  validate:
    if: github.repository == 'khalidonline/daily-news-snap' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.mode == 'validate' || inputs.mode == 'publish')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify exact approved media without publishing credentials
        env:
          APPROVED_MANIFEST: ${{ inputs.manifest }}
        run: python -m publishing_v2.bundle_api validate --manifest "$APPROVED_MANIFEST"
  publish:
    needs: [check, validate]
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Publish approved media sequentially with durable receipts
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_MANIFEST: ${{ inputs.manifest }}
        run: python -m publishing_v2.bundle_api publish --manifest "$APPROVED_MANIFEST"
