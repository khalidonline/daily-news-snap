name: Save approved final 9 October Stories
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-final-20261009-once.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  archive:
    if: github.event.head_commit.message == 'Diagnose guarded final archive batch 20261009 only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 95cd30e7bb10e30cf73ef7570d4e893f40903d21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact project requirements
        run: pip install -r requirements.txt
      - name: Test Saved Story path and guarded batch syntax
        run: |
          python -m unittest discover -s tests -p test_v2_saved_story_api.py -q
          python -m py_compile approved/saved-stories/daily-20261009/save_batch.py
      - name: Save exact published files with live receipts inventory quota and budget checks
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: .
        run: python approved/saved-stories/daily-20261009/save_batch.py

