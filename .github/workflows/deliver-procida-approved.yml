name: Deliver approved Procida challenge only
on:
  push:
    branches: [main]
    paths: ['.github/procida-approved.trigger']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: timeout 120 python -m pip install pillow
      - name: Ensure FFmpeg with bounded installation
        timeout-minutes: 7
        run: |
          set -euo pipefail
          if command -v ffmpeg && command -v ffprobe; then exit 0; fi
          if ! sudo timeout 75 apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 install -y --no-install-recommends ffmpeg; then
            list="$RUNNER_TEMP/procida-ubuntu.list"
            echo 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' > "$list"
            echo 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe' >> "$list"
            opts=(-o "Dir::Etc::sourcelist=$list" -o Dir::Etc::sourceparts=- -o Acquire::Retries=1 -o Acquire::https::Timeout=15 -o Acquire::Languages=none)
            sudo timeout 150 apt-get "${opts[@]}" update
            sudo timeout 170 apt-get "${opts[@]}" install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Restore sealed video and restore original hash-pinned review frames
        run: |
          cat approved/procida-20261111.tar.xz.part-* | tar -xJf -
      - name: Validate and publish exact approved bytes to both destinations
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          POST_TO_SNAPCHAT: '1'
          DRY_RUN: '0'
        run: python -m approved.procida-20261111.deliver
