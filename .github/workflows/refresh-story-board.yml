name: Refresh Story visual board

on:
  push:
    branches:
      - validation/story-board-refresh-2026-08-30

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/story-board-refresh-2026-08-30
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Diagnose remaining one-visual repairs
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          import story_runtime as sr
          targets = [
              "لماذا تختلف أسعار التذاكر بين يوم وآخر؟ قصة التسعير",
              "لماذا صارت طوكيو أكبر مدينة في العالم؟",
          ]
          for story in targets:
              photos, logos, status = sr.coverage(story)
              print("STORY", story)
              print("STATUS", status)
              print("VISUALS", len(photos), [p.name for p in photos])
              print("LOGOS", len(logos), [p.name for p in logos])
          PY
