name: Refresh Story visual board

on:
  push:
    branches:
      - validation/story-board-refresh-2026-08-30

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/story-board-refresh-2026-08-30
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build current-runtime Story visual board
        shell: bash
        run: |
          mkdir -p out/story-board-refresh
          PYTHONPATH=. python - <<'PY' | tee out/story-board-refresh/board.txt
          import story_runtime as sr
          import story_bot as sb

          rows = []
          for story in sb.load_stories():
              photos, logos, status = sr.coverage(story)
              rows.append((story, len(photos), len(logos), status))

          passed = [r for r in rows if r[3] == "PASS"]
          unresolved = [r for r in rows if r[3] != "PASS"]
          print(f"TOTAL={len(rows)}")
          print(f"PASS={len(passed)}")
          print(f"UNRESOLVED={len(unresolved)}")

          print("\nNEAR-PASS QUEUE")
          for story, photos, logos, status in sorted(unresolved, key=lambda r: (-r[1], r[0])):
              if photos >= 2:
                  print(f"{status} | {story} | visuals={photos} | optional_logos={logos}")

          print("\nALL UNRESOLVED")
          for story, photos, logos, status in sorted(unresolved, key=lambda r: (-r[1], r[0])):
              print(f"{status} | {story} | visuals={photos} | optional_logos={logos}")

          print("\nPASS STORIES")
          for story, photos, logos, status in sorted(passed, key=lambda r: r[0]):
              print(f"PASS | {story} | visuals={photos} | optional_logos={logos}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-board-refresh-${{ github.run_id }}
          path: out/story-board-refresh/board.txt
          retention-days: 7
          if-no-files-found: warn
