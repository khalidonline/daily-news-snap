name: Bulk visual repair

on:
  pull_request:
    paths:
      - "tools/bulk_visual_*.py"
      - "tests/test_bulk_visual_*.py"
      - "images/**"
      - "stories.txt"
      - ".github/workflows/bulk-visual-repair.yml"
  workflow_dispatch:
    inputs:
      batch_stories:
        description: Maximum stories attempted in this bounded run (clamped to 12)
        required: false
        default: "12"
      max_candidates_per_beat:
        description: Maximum candidates discovered for each visual beat
        required: false
        default: "12"
      max_batches:
        description: Legacy compatibility input (accepted but unused)
        required: false
        default: "12"

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unprivileged repair tests
        run: python -m unittest -v tests/test_bulk_visual_*.py tests/test_runtime_relevance.py tests/test_apply_repair_assets.py

  repair:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'repair/story-visual-coverage'
    concurrency:
      group: bulk-visual-repair-writer
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/story-visual-coverage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests before writes
        run: python -m unittest -v tests/test_bulk_visual_*.py tests/test_runtime_relevance.py tests/test_apply_repair_assets.py
      - name: Run bounded repair controller
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BATCH_STORIES: ${{ inputs.batch_stories || '12' }}
          MAX_CANDIDATES: ${{ inputs.max_candidates_per_beat || '12' }}
        shell: bash
        run: |
          set -euo pipefail
          requested="${BATCH_STORIES:-12}"
          if ! [[ "$requested" =~ ^[0-9]+$ ]] || [ "$requested" -lt 1 ]; then requested=12; fi
          MAX_STORIES=12
          if [ "$requested" -lt "$MAX_STORIES" ]; then MAX_STORIES="$requested"; fi

          git config user.name "story-visual-repair-bot"
          git config user.email "actions@github.com"

          set +e
          PYTHONPATH=. python tools/bulk_visual_run.py \
            --max-stories "$MAX_STORIES" \
            --max-candidates-per-beat "$MAX_CANDIDATES" \
            --story-timeout-seconds 150 \
            --soft-deadline-seconds 1500
          rc=$?
          set -e

          if [ "$rc" -eq 3 ]; then exit 3; fi
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] || [ "$rc" -eq 10 ]; then exit 0; fi
          exit "$rc"
      - name: Authoritative repair summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Bulk visual repair"
            echo
            if [ ! -f tools/bulk_visual_board.py ]; then
              echo "Authoritative board unavailable because checkout did not complete."
            else
              PYTHONPATH=. python - <<'PY' || echo "Authoritative board generation failed."
          import json
          from pathlib import Path

          from tools.bulk_visual_board import build_board

          summary_path = Path("out/bulk-visual-repair/run-summary.json")
          if summary_path.is_file():
              try:
                  summary = json.loads(summary_path.read_text(encoding="utf-8"))
                  print(f"Bounded run outcome: **{summary.get('outcome', 'UNKNOWN')}**")
                  print(
                      "Counters: "
                      f"attempted={summary.get('attempted', 0)}, "
                      f"timed_out={summary.get('timed_out', 0)}, "
                      f"progress={summary.get('progress_count', 0)}, "
                      f"no_progress={summary.get('no_progress_count', 0)}"
                  )
                  print()
              except (OSError, ValueError, TypeError):
                  print("Bounded run summary could not be parsed.")
                  print()

          board = build_board()
          passed = sum(row.status == "PASS" for row in board)
          print(f"Authoritative board: **{passed}/{len(board)} PASS**")
          failed = [row for row in board if row.status != "PASS"]
          if failed:
              print()
              print("### Unresolved stories")
              unresolved_path = Path("out/bulk-visual-repair/unresolved.json")
              unresolved = []
              if unresolved_path.is_file():
                  try:
                      payload = json.loads(unresolved_path.read_text(encoding="utf-8"))
                      unresolved = payload if isinstance(payload, list) else payload.get("unresolved", [])
                  except (OSError, ValueError, TypeError):
                      unresolved = []
              reasons = {
                  str(item.get("story")): item.get("reason") or item.get("result")
                  for item in unresolved
                  if isinstance(item, dict) and item.get("story")
              }
              for row in failed:
                  reason = reasons.get(row.story)
                  suffix = f" — {reason}" if reason else ""
                  print(f"- {row.story}: {row.status}{suffix}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulk-visual-repair-${{ github.run_id }}
          path: |
            out/bulk-visual-repair/**
            out/runtime-review/**
          if-no-files-found: warn
          retention-days: 7
