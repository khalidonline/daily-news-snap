name: Bulk visual repair

on:
  pull_request:
    paths:
      - "tools/bulk_visual_*.py"
      - "tests/test_bulk_visual_*.py"
      - "images/**"
      - "stories.txt"
      - ".github/workflows/bulk-visual-repair.yml"
  workflow_dispatch:
    inputs:
      batch_stories:
        description: Maximum stories processed in each bounded batch
        required: false
        default: "15"
      max_candidates_per_beat:
        description: Maximum candidates discovered for each visual beat
        required: false
        default: "12"
      max_batches:
        description: Maximum bounded batches attempted by this job
        required: false
        default: "12"

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unprivileged repair tests
        run: python -m unittest -v tests/test_bulk_visual_*.py tests/test_runtime_relevance.py tests/test_apply_repair_assets.py

  repair:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'repair/story-visual-coverage'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/story-visual-coverage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests before writes
        run: python -m unittest -v tests/test_bulk_visual_*.py tests/test_runtime_relevance.py tests/test_apply_repair_assets.py
      - name: Repair in bounded pushed batches
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BATCH_STORIES: ${{ inputs.batch_stories || '15' }}
          MAX_CANDIDATES: ${{ inputs.max_candidates_per_beat || '12' }}
          MAX_BATCHES: ${{ inputs.max_batches || '12' }}
          TARGET_BRANCH: repair/story-visual-coverage
        shell: bash
        run: |
          set -euo pipefail
          for batch in $(seq 1 "$MAX_BATCHES"); do
            set +e
            PYTHONPATH=. python tools/bulk_visual_repair.py \
              --batch-stories "$BATCH_STORIES" \
              --max-candidates-per-beat "$MAX_CANDIDATES"
            rc=$?
            set -e

            # A zero-progress first chunk is not a catalogue-wide no-progress
            # result. Probe later unresolved rows one at a time so hard logo-only
            # identities cannot starve independently repairable photo/story rows.
            # Only a complete unresolved pass with no safe write may remain rc=2.
            if [ "$rc" -eq 2 ]; then
              mapfile -t later_stories < <(
                PYTHONPATH=. python - <<'PY'
          import os
          from tools.bulk_visual_board import build_board, repair_backlog

          backlog = repair_backlog(build_board())
          skip = max(0, int(os.environ.get("BATCH_STORIES", "15")))
          for row in backlog[skip:]:
              print(row.story)
          PY
              )
              scan_rc=2
              for story in "${later_stories[@]}"; do
                set +e
                PYTHONPATH=. python tools/bulk_visual_repair.py \
                  --story "$story" \
                  --batch-stories 1 \
                  --max-candidates-per-beat "$MAX_CANDIDATES"
                story_rc=$?
                set -e
                if [ "$story_rc" -eq 3 ]; then scan_rc=3; break; fi
                if [ "$story_rc" -eq 10 ]; then scan_rc=10; break; fi
              done
              if [ "$scan_rc" -eq 10 ]; then rc=10; fi
              if [ "$scan_rc" -eq 3 ]; then exit 3; fi
            fi

            python -m unittest -v tests/test_bulk_visual_*.py tests/test_runtime_relevance.py
            PYTHONPATH=. python tools/build_runtime_review.py

            if ! git diff --quiet -- images stories.txt; then
              git config user.name "story-visual-repair-bot"
              git config user.email "actions@github.com"
              git add images stories.txt
              git commit -m "assets: bulk repair story visual coverage batch ${batch}"
              git pull --rebase origin "$TARGET_BRANCH"
              git push origin HEAD:"$TARGET_BRANCH"
            fi

            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$rc" -eq 10 ]; then continue; fi
            exit "$rc"
          done
          exit 2
      - name: Authoritative repair summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Bulk visual repair"
            echo
            if [ ! -f tools/bulk_visual_board.py ]; then
              echo "Authoritative board unavailable because checkout did not complete."
            else
              PYTHONPATH=. python - <<'PY' || echo "Authoritative board generation failed."
          import json
          from pathlib import Path

          from tools.bulk_visual_board import build_board

          board = build_board()
          passed = sum(row.status == "PASS" for row in board)
          print(f"Authoritative board: **{passed}/{len(board)} PASS**")
          failed = [row for row in board if row.status != "PASS"]
          if failed:
              print()
              print("### Unresolved stories")
              unresolved_path = Path("out/bulk-visual-repair/unresolved.json")
              unresolved = []
              if unresolved_path.is_file():
                  try:
                      payload = json.loads(unresolved_path.read_text(encoding="utf-8"))
                      unresolved = payload if isinstance(payload, list) else payload.get("unresolved", [])
                  except (OSError, ValueError, TypeError):
                      unresolved = []
              reasons = {
                  str(item.get("story")): item.get("reason") or item.get("result")
                  for item in unresolved
                  if isinstance(item, dict) and item.get("story")
              }
              for row in failed:
                  reason = reasons.get(row.story)
                  suffix = f" — {reason}" if reason else ""
                  print(f"- {row.story}: {row.status}{suffix}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulk-visual-repair-${{ github.run_id }}
          path: |
            out/bulk-visual-repair/**
            out/runtime-review/**
          if-no-files-found: warn
          retention-days: 7
