name: Deploy publishing v2 offline evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publishing-v2-cloud-bootstrap
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'khalidonline/daily-news-snap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation dependency
        run: python -m pip install -r requirements-v2-images.txt
      - name: Test isolated evaluation
        run: python -m unittest discover -s tests -p 'test_v2_*.py' -v
      - name: Authenticate through GitHub federation
        id: cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: daily-news-snap-508412
          workload_identity_provider: projects/1052421432660/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: snap-github@daily-news-snap-508412.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 1200s
          create_credentials_file: true
          export_environment_variables: true
      - name: Audit deployer permissions
        env:
          CLOUD_ACCESS_TOKEN: ${{ steps.cloud.outputs.access_token }}
        run: python -m publishing_v2.cloud_permissions
      - uses: google-github-actions/setup-gcloud@v3
      - name: Create allowlisted build context
        run: |
          context="$RUNNER_TEMP/publishing-v2-context"
          mkdir -p "$context/evaluation"
          cp -R publishing_v2 "$context/publishing_v2"
          cp evaluation/event_packages.json evaluation/failure_cases.json "$context/evaluation/"
          cp deploy/publishing-v2/Dockerfile deploy/publishing-v2/.dockerignore "$context/"
          echo "BUILD_CONTEXT=$context" >> "$GITHUB_ENV"
      - name: Deploy and execute one offline job
        run: bash deploy/publishing-v2/deploy.sh
      - name: Record bounded success
        run: echo 'Cloud Run completed one offline execution only; editorial, photo, delivery, and production acceptance remain unverified.' >> "$GITHUB_STEP_SUMMARY"
