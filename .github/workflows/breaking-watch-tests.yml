name: Breaking watch tests

on:
  push:
    paths:
      - "breaking_watch.py"
      - "breaking_news_runner.py"
      - "breaking_watch_entry.py"
      - "news_bot.py"
      - "tests/test_breaking_watch.py"
      - "tests/test_breaking_watch_notifications.py"
      - "tests/test_breaking_watch_seen_memory.py"
      - "tests/test_breaking_visual_relevance.py"
      - "tests/test_breaking_manual_reproduction.py"
      - "tests/test_breaking_recommendations.py"
      - ".github/workflows/breaking.yml"
      - ".github/workflows/breaking-watch-tests.yml"
  pull_request:
    paths:
      - "breaking_watch.py"
      - "breaking_news_runner.py"
      - "breaking_watch_entry.py"
      - "news_bot.py"
      - "tests/test_breaking_watch.py"
      - "tests/test_breaking_watch_notifications.py"
      - "tests/test_breaking_watch_seen_memory.py"
      - "tests/test_breaking_visual_relevance.py"
      - "tests/test_breaking_manual_reproduction.py"
      - "tests/test_breaking_recommendations.py"
      - ".github/workflows/breaking.yml"
      - ".github/workflows/breaking-watch-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Run breaking watcher regressions
        run: |
          python -m unittest tests.test_breaking_watch tests.test_breaking_watch_notifications tests.test_breaking_watch_seen_memory -v
          python -m unittest tests.test_breaking_visual_relevance -v
          python -m unittest tests.test_breaking_manual_reproduction -v
          python -m unittest tests.test_breaking_recommendations -v
          python -m py_compile breaking_watch.py breaking_news_runner.py breaking_watch_entry.py news_bot.py
