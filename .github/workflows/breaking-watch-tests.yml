name: Breaking watch tests

on:
  push:
    paths:
      - "breaking_watch.py"
      - "tests/test_breaking_watch.py"
      - ".github/workflows/breaking.yml"
      - ".github/workflows/breaking-watch-tests.yml"
  pull_request:
    paths:
      - "breaking_watch.py"
      - "tests/test_breaking_watch.py"
      - ".github/workflows/breaking.yml"
      - ".github/workflows/breaking-watch-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run breaking watcher regressions
        run: |
          python -m unittest tests.test_breaking_watch -v
          python -m py_compile breaking_watch.py
