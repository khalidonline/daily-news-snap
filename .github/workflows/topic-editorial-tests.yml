name: Topic editorial tests

on:
  push:
    paths:
      - "topic_editorial.py"
      - "topic_snapchat.py"
      - "topic_bot.py"
      - "topics.txt"
      - "voice.txt"
      - "state/topic_performance.json"
      - "tests/test_topic_editorial.py"
      - "tests/test_topic_snapchat.py"
      - "tests/test_topic_transport.py"
      - ".github/workflows/topic.yml"
      - ".github/workflows/topic-editorial-tests.yml"
  pull_request:
    paths:
      - "topic_editorial.py"
      - "topic_snapchat.py"
      - "topic_bot.py"
      - "topics.txt"
      - "voice.txt"
      - "state/topic_performance.json"
      - "tests/test_topic_editorial.py"
      - "tests/test_topic_snapchat.py"
      - "tests/test_topic_transport.py"
      - ".github/workflows/topic.yml"
      - ".github/workflows/topic-editorial-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Saudi Snapchat topic regressions
        run: |
          python -m unittest tests.test_topic_editorial tests.test_topic_snapchat tests.test_topic_transport -v
          python -m py_compile topic_editorial.py topic_snapchat.py topic_bot.py
