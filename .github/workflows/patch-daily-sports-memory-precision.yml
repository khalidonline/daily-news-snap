name: Apply sports memory precision

on:
  push:
    branches:
      - fix/daily-sports-balance
    paths:
      - .github/workflows/patch-daily-sports-memory-precision.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten legacy sports memory detector
        run: python scripts/patch_daily_sports_memory_precision.py
      - name: Commit patched detector
        run: |
          rm .github/workflows/patch-daily-sports-memory-precision.yml
          rm scripts/patch_daily_sports_memory_precision.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_news_runner.py .github/workflows/patch-daily-sports-memory-precision.yml scripts/patch_daily_sports_memory_precision.py
          git commit -m "fix: tighten legacy sports memory matching"
          git push
