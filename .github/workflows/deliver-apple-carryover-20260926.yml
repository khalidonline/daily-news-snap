name: Deliver saved Apple carryover
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deliver-apple-carryover-20260926.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Deliver approved Apple carryover 20260926 now'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2650972174b16b2145ab0d5197a7c9dc9ab4bf14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Reconcile and deliver saved approved media
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from publishing_v2.bundle_api import BundleClient, GitHubJournal, load_package, check_predecessors, publish
          manifest = "approved/apple-local-ai-20260925-corrected/manifest.json"
          identity, title, media = load_package(manifest)
          assert identity == "68dbb5b911fa8b48b01b0aeb175941ae002cc1ec2289168b211998f378010443"
          assert len(media) == 4
          client = BundleClient()
          client.check()
          run = "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
          queue = GitHubJournal("deferred-approved-packages")
          pending = queue.read()
          pending["policy"] = {"retain_saved_media": True, "no_paid_regeneration_on_delivery_retry": True, "next_day_recheck": ["attention", "approval_expiry", "provider_quota", "receipts"], "one_package_per_delivery": True, "never_extend_expiry_automatically": True}
          pending[identity] = {"title": title, "manifest": manifest, "source_commit": "2650972174b16b2145ab0d5197a7c9dc9ab4bf14", "status": "PENDING_DELIVERY", "expires_at": json.loads(Path(manifest).read_text())["expires_at"], "run": run}
          queue.save(pending)
          journal = GitHubJournal(identity)
          state = journal.read()
          for key, row in list(state.items()):
              if not key.isdigit() or row.get("post_id"): continue
              upload_id = row.get("upload_id")
              assert upload_id == "84585995-d42c-408a-86fa-9d392b4b28b7", "Unknown uncertain intent"
              upload = client.call("/upload/" + upload_id)
              assert upload.get("id") == upload_id and upload.get("teamId") == client.team, "Upload identity mismatch"
              assert upload.get("posts") == [], "Upload has posts or missing evidence; reconciliation required"
              proof = {"status": "NOT_CREATED", "checked_at": datetime.now(timezone.utc).isoformat(), "method": "provider_exact_upload_posts_empty", "upload_id": upload_id, "evidence_url": run}
              state.setdefault("reconciled_attempts", []).append({"card": key, "intent": row, "proof": proof})
              state["reconciliation"] = proof
              del state[key]
              journal.save(state)
              print("Prior create freshly reconciled: NOT_CREATED; original intent archived")
          check_predecessors(json.loads(Path(manifest).read_text()).get("predecessors", []))
          required = sum(str(i+1) not in state for i in range(len(media)))
          usage = client.ensure_capacity(required)
          print("Verified quota:", json.dumps(usage.get("posts") if usage else {"required":0}))
          try:
              publish(client, journal, title, media)
          except Exception:
              pending[identity]["status"] = "DELIVERY_BLOCKED_RETAIN_MEDIA"
              queue.save(pending)
              raise
          confirmed = journal.read()
          assert all(confirmed.get(str(i+1), {}).get("status") == "POSTED" for i in range(4))
          assert len({confirmed[str(i+1)]["post_id"] for i in range(4)}) == 4
          pending[identity]["status"] = "POSTED"
          pending[identity]["posted_at"] = datetime.now(timezone.utc).isoformat()
          pending[identity]["post_ids"] = [confirmed[str(i+1)]["post_id"] for i in range(4)]
          pending[identity]["additional_model_cost_usd"] = 0
          queue.save(pending)
          print("CONFIRMED: 4/4 POSTED; additional model cost USD 0")
          
          PY
