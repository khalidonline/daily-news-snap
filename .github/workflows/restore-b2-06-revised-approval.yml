name: Restore the approved B2-06 corrected manifest
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-b2-06-revised-approval.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact manifest from approved archive
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, tarfile
          archive = pathlib.Path('approved/app-origins-revised.tar.xz')
          files = []
          with tarfile.open(archive) as bundle:
              for item in bundle:
                  path = pathlib.Path(item.name)
                  if not item.isfile() or path.suffix != '.json' or path.is_absolute() or '..' in path.parts:
                      continue
                  data = bundle.extractfile(item).read()
                  obj = json.loads(data)
                  if isinstance(obj, dict) and obj.get('approved') is True and 'expires_at' in obj:
                      files.append((path, data))
          assert len(files) == 1, [str(p) for p, _ in files]
          path, data = files[0]
          print(path)
          assert not path.exists() and path.parts[0] == 'approved'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(data)
          subprocess.run(['git', 'add', '--', str(path)], check=True)
          PY
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Restore exact B2-06 revised publication approval"
          git push origin HEAD:main
