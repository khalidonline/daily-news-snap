name: Reviewer and visual model experiment

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  benchmark:
    if: github.repository == 'khalidonline/daily-news-snap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: python -m pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Verify experiment safeguards
        run: python -m unittest tests.test_reviewer_visual_experiment -v
      - name: Restore frozen production artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen/agentic frozen/replay
          gh run download 35849539333 -n agentic-packages-35849539333-1 -D frozen/agentic
          gh run download 35916577071 -n saved-replay-35916577071 -D frozen/replay
          test -f frozen/agentic/daily.json
          test -f frozen/agentic/local.json
          test -f frozen/replay/result.json
      - name: Run reviewer and visual comparison
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_BUDGET_GITHUB_TOKEN: ${{ secrets.DAILY_BUDGET_GITHUB_TOKEN || github.token }}
        run: >-
          python reviewer_visual_experiment.py
          --agentic-root frozen/agentic
          --replay-root frozen/replay
          --output role-experiment-output
      - name: Publish concise result
        if: always()
        run: |
          if [ -f role-experiment-output/summary.json ]; then
            echo '## Reviewer / visual benchmark' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat role-experiment-output/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewer-visual-model-experiment-${{ github.run_id }}
          path: role-experiment-output/
          retention-days: 30
