name: Repair Ali Al-Naimi visuals

on:
  push:
    branches:
      - fix/ali-alnaimi-visuals

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ali-alnaimi-visuals
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Confirm RED starting point
        run: |
          python - <<'PY'
          import story_runtime as sr
          story = "علي النعيمي: من صبي في أرامكو إلى وزير يحرّك أسواق النفط"
          photos, _, status = sr.coverage(story)
          print("BEFORE", status, len(photos), [p.name for p in photos])
          if len(photos) != 2:
              raise SystemExit(f"expected two visuals before repair, got {len(photos)}")
          PY
      - name: Add two distinct Ali Al-Naimi ministerial photos
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/The%20Minister%20for%20Petroleum%20and%20Mineral%20Resources%20of%20Saudi%20Arabia%2C%20Mr.%20Ali%20I.%20Al-Naimi%20calls%20on%20the%20Prime%20Minister%2C%20Dr.%20Manmohan%20Singh%20in%20New%20Delhi%20on%20January%2005%2C%202005.jpg" \
            -o images/ali-alnaimi-2005-india.jpg
          curl -L --fail --retry 3 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/The%20Union%20Minister%20of%20Petroleum%20and%20Natural%20Gas%2C%20Shri%20Murli%20Deora%20with%20the%20Minister%20of%20Oil%20and%20Mineral%20Resources%20of%20Saudi%20Arabia%2C%20Mr.%20Ali%20Al%20Naimi%2C%20in%20Riyadh%20on%20February%2028%2C%202010.jpg" \
            -o images/ali-alnaimi-2010-bilateral.jpg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          story = "علي النعيمي: من صبي في أرامكو إلى وزير يحرّك أسواق النفط"
          assets = {
              "ali-alnaimi-2005-india.jpg": "Government of India via Wikimedia Commons; Ali Al-Naimi meeting Prime Minister Manmohan Singh, New Delhi, 2005",
              "ali-alnaimi-2010-bilateral.jpg": "Government of India via Wikimedia Commons; Ali Al-Naimi with Murli Deora, Riyadh, 2010",
          }
          index = Path("images/images.txt")
          text = index.read_text(encoding="utf-8")
          for filename, credit in assets.items():
              path = Path("images") / filename
              with Image.open(path) as im:
                  print(filename, im.size, im.format)
                  if min(im.size) < 500:
                      raise SystemExit(f"image too small: {filename} {im.size}")
              if filename not in text:
                  text += f"{filename} | {story}, علي النعيمي, Ali Al-Naimi, Saudi oil minister, وزير البترول | {credit}\n"
          index.write_text(text, encoding="utf-8")
          PY
      - name: Verify GREEN runtime coverage
        run: |
          python - <<'PY'
          import story_runtime as sr
          story = "علي النعيمي: من صبي في أرامكو إلى وزير يحرّك أسواق النفط"
          photos, logos, status = sr.coverage(story)
          names = [p.name for p in photos]
          print("AFTER", status, len(photos), names)
          required = {"ali-alnaimi-2005-india.jpg", "ali-alnaimi-2010-bilateral.jpg"}
          if status != "PASS" or len(photos) < 4 or not required.issubset(names):
              raise SystemExit("Ali Al-Naimi story did not reach PASS with four protagonist visuals")
          PY
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "story-visual-repair-bot"
          git config user.email "actions@github.com"
          git add images/images.txt images/ali-alnaimi-2005-india.jpg images/ali-alnaimi-2010-bilateral.jpg
          git commit -m "assets: complete Ali Al-Naimi protagonist coverage"
          git push origin HEAD:fix/ali-alnaimi-visuals
