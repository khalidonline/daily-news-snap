name: Isolated MemAdapter pilot 20261010
on:
  push:
    branches: [main]
    paths: ['.github/workflows/memadapter-pilot-20261010.yml']
permissions:
  contents: write
concurrency:
  group: memadapter-pilot-20261010
  cancel-in-progress: false
jobs:
  pilot:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'experiment: finish untouched MemAdapter cases 8 to 10'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 50235a44cf1f8e708a4ceef51711ecf536798b34
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize frozen experiment only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          bundle=json.loads(Path('docs/experiments/memadapter-20261010-resume-inputs.json').read_text())
          root=Path('memadapter-pilot')
          for name,content in bundle['files'].items():
              path=root/name
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content)
          PY
          python memadapter-pilot/run.py --dry
      - name: Compare with shared budget and no publishing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAILY_BUDGET_GITHUB_TOKEN: ${{ secrets.DAILY_BUDGET_GITHUB_TOKEN || github.token }}
        run: python -u memadapter-pilot/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memadapter-pilot-20261010
          path: memadapter-pilot/results.json
          retention-days: 30
