name: Review saved package without new research
on:
  workflow_dispatch:
    inputs:
      source_slot:
        description: Saved autopilot shadow journal identifier
        type: string
        required: true
      resume_slot:
        description: Optional budget-blocked replay journal; review only, no writer
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  replay:
    if: github.repository == 'khalidonline/daily-news-snap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install established renderer dependencies
        run: python -m pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Verify saved replay without paid calls
        run: PYTHONPATH=.:tests python -m unittest tests.test_v2_saved_replay tests.test_v2_editorial_density -q
      - name: Rewrite and review saved package only
        env:
          RESUME_SLOT: ${{ inputs.resume_slot }}
          SOURCE_SLOT: ${{ inputs.source_slot }}
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_BUDGET_GITHUB_TOKEN: ${{ secrets.DAILY_BUDGET_GITHUB_TOKEN || github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTOPILOT_DAILY_LIMIT_MICRO_USD: '8000000'
          AUTOPILOT_WRITER_MODEL: 'claude-opus-5'
          AUTOPILOT_REVIEWER_MODEL: 'claude-opus-5'
          POST_TO_SNAPCHAT: '0'
          DRY_RUN: '1'
        run: python -m publishing_v2.autopilot.replay --source-slot "$SOURCE_SLOT" --resume-slot "$RESUME_SLOT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-replay-${{ github.run_id }}
          path: replay-output/
          retention-days: 14
