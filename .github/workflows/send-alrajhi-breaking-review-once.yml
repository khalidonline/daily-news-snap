name: Send Al Rajhi breaking review once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/send-alrajhi-breaking-review-once.yml

permissions:
  actions: read
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Build updated review card
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/alrajhi-card
          gh run download 34023665948 -n breaking-card-34023665948 -D /tmp/alrajhi-card
          curl -L --fail --retry 3 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/d/dd/KAFD_20230411_114620.jpg' -o /tmp/alrajhi-card/alrajhi.jpg
          cat > /tmp/patch_card.py <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          card_path = Path('/tmp/alrajhi-card/2026-09-06-12pm-brief.png')
          photo_path = Path('/tmp/alrajhi-card/alrajhi.jpg')
          out_path = Path('/tmp/alrajhi-card/alrajhi-breaking-updated.png')
          card = Image.open(card_path).convert('RGB')
          photo = Image.open(photo_path).convert('RGB')
          box = (96, 509, 984, 1201)
          w, h = box[2] - box[0], box[3] - box[1]
          fitted = ImageOps.fit(photo, (w, h), method=Image.Resampling.LANCZOS, centering=(0.43, 0.5))
          mask = Image.new('L', (w, h), 0)
          ImageDraw.Draw(mask).rounded_rectangle((0, 0, w - 1, h - 1), radius=34, fill=255)
          card.paste(fitted, box[:2], mask)
          card.save(out_path, quality=95)
          PY
          python /tmp/patch_card.py

      - name: Send updated card to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          curl -sS --fail \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "photo=@/tmp/alrajhi-card/alrajhi-breaking-updated.png" \
            -F "caption=نسخة محدثة — الصورة: Ahmed / Wikimedia Commons (CC BY-SA 4.0)" \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto" \
            | python -c "import json,sys; p=json.load(sys.stdin); assert p.get('ok'), p; print('telegram: updated Al Rajhi review card sent')"
