name: AlUla near-pass visual repair

on:
  push:
    branches:
      - repair/all-story-visuals-2026-08-29
    paths:
      - ".github/alula-near-pass-trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/all-story-visuals-2026-08-29
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch reviewed AlUla landmark photo and identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/logos
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          UA='daily-news-snap/1.0 (https://github.com/khalidonline/daily-news-snap; story visual repair)'
          def wiki_image(host,title,destination,width=1600):
              params=urlencode({'action':'query','format':'json','prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':width,'titles':'File:'+title})
              req=Request(f'https://{host}/w/api.php?'+params,headers={'User-Agent':UA})
              with urlopen(req,timeout=25) as r: payload=json.load(r)
              page=next(iter(payload['query']['pages'].values()))
              if 'missing' in page or not page.get('imageinfo'): raise SystemExit(f'missing file on {host}: {title}')
              info=page['imageinfo'][0]; url=info.get('thumburl') or info['url']
              with urlopen(Request(url,headers={'User-Agent':UA}),timeout=30) as r: Path(destination).write_bytes(r.read())
              print(f'fetched {title} from {host} -> {destination}')
          wiki_image('commons.wikimedia.org',"Elephant rock, Al-'Ula (2024).jpg",'images/targeted-alula-elephant-rock-2024.jpg')
          # The city wordmark is exposed by the Al-Ula Wikipedia page; query Wikipedia directly
          # because some fair-use/simple identity files live in the local file namespace.
          try:
              wiki_image('en.wikipedia.org','AlUla Logo.svg','images/logos/experiencealula.com-current.png',1280)
          except SystemExit:
              wiki_image('en.wikipedia.org','Al Ula Seal.svg','images/logos/experiencealula.com-current.png',1280)
          PY

      - name: Validate photo and normalize identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from image_precheck import dhash, DHASH_MAX_DISTANCE
          new=Path('images/targeted-alula-elephant-rock-2024.jpg')
          with Image.open(new) as im: im.verify()
          with Image.open(new) as im:
              if im.width<600 or im.height<400: raise SystemExit(f'candidate too small: {im.size}')
              print(f'candidate verified: {im.size}')
          nh=dhash(new)
          if nh is None: raise SystemExit('could not fingerprint AlUla candidate')
          for old in Path('images').glob('*'):
              if old==new or not old.is_file() or old.suffix.lower() not in {'.jpg','.jpeg','.png','.webp'}: continue
              oh=dhash(old)
              if oh is None: continue
              d=(nh^oh).bit_count()
              if d<=DHASH_MAX_DISTANCE: raise SystemExit(f'AlUla candidate duplicates {old} distance={d}')
          print('distinctness gate PASS')

          p=Path('images/logos/experiencealula.com-current.png')
          with Image.open(p) as src: rgba=src.convert('RGBA')
          corners=[rgba.getpixel((0,0)),rgba.getpixel((rgba.width-1,0)),rgba.getpixel((0,rgba.height-1)),rgba.getpixel((rgba.width-1,rgba.height-1))]
          if all(a>220 and r>240 and g>240 and b>240 for r,g,b,a in corners):
              data=[]
              for r,g,b,a in rgba.getdata(): data.append((r,g,b,0 if r>245 and g>245 and b>245 else a))
              rgba.putdata(data)
          bbox=rgba.getchannel('A').getbbox()
          if not bbox: raise SystemExit('AlUla identity became empty')
          rgba=rgba.crop(bbox); pad=max(16,int(max(rgba.size)*0.05))
          canvas=Image.new('RGBA',(rgba.width+2*pad,rgba.height+2*pad),(255,255,255,0)); canvas.alpha_composite(rgba,(pad,pad)); canvas.save(p)
          if canvas.width<250 or canvas.height<80: raise SystemExit(f'AlUla identity too small: {canvas.size}')
          print(f'clean identity normalized: {canvas.size}')
          PY

      - name: Register and verify AlUla story
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          story='كيف تحولت العلا من واحة إلى وجهة عالمية؟'
          manifest=Path('images/images.txt'); text=manifest.read_text(encoding='utf-8').rstrip()
          line="targeted-alula-elephant-rock-2024.jpg | AlUla, العلا, جبل الفيل, Elephant Rock | Saudi Photos — Wikimedia Commons"
          if line not in text: text+='\n'+line
          manifest.write_text(text+'\n',encoding='utf-8')
          rp=Path('images/relevance.json'); rel=json.loads(rp.read_text(encoding='utf-8'))
          rel.setdefault('assets',{})['targeted-alula-elephant-rock-2024.jpg']={'stories':{story:'DIRECT'},'source_url':"https://commons.wikimedia.org/wiki/File:Elephant_rock,_Al-'Ula_(2024).jpg",'note':'Elephant Rock in AlUla; direct destination-development visual.'}
          rp.write_text(json.dumps(rel,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          ip=Path('images/logos/index.json'); idx=json.loads(ip.read_text(encoding='utf-8'))
          idx['experiencealula.com']=['AlUla','العلا','Experience AlUla','Royal Commission for AlUla','RCU','الهيئة الملكية لمحافظة العلا','experiencealula.com']
          ip.write_text(json.dumps(idx,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          sp=Path('stories.txt'); s=sp.read_text(encoding='utf-8'); old='كيف تحولت العلا من واحة إلى وجهة عالمية؟ | AlUla, العلا'; new='كيف تحولت العلا من واحة إلى وجهة عالمية؟ | AlUla, العلا | entity: Royal Commission for AlUla, RCU, Experience AlUla | logo:experiencealula.com'
          if old not in s: raise SystemExit('expected AlUla story line missing')
          sp.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git fetch origin repair/story-visual-coverage
          rm -rf /tmp/alula-board-engine && mkdir -p /tmp/alula-board-engine
          git archive origin/repair/story-visual-coverage | tar -x -C /tmp/alula-board-engine
          PYTHONPATH=/tmp/alula-board-engine python - <<'PY'
          import sys
          sys.path.insert(0,'/tmp/alula-board-engine')
          from tools.bulk_visual_board import build_board
          row=build_board(['كيف تحولت العلا من واحة إلى وجهة عالمية؟'])[0]
          print(f'{row.story}: {row.status} photos={len(row.photos)} logos={len(row.logos)}')
          if row.status!='PASS' or len(row.photos)<4 or len(row.logos)<1: raise SystemExit('AlUla story failed authoritative coverage')
          PY

      - name: Commit accepted repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name story-visual-repair-bot
          git config user.email actions@github.com
          git add images/targeted-alula-elephant-rock-2024.jpg images/logos/experiencealula.com-current.png images/images.txt images/relevance.json images/logos/index.json stories.txt
          git commit -m "repair: close AlUla near-pass gap"
          git pull --rebase origin repair/all-story-visuals-2026-08-29
          git push origin HEAD:repair/all-story-visuals-2026-08-29
