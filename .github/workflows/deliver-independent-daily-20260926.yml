name: Deliver independent Daily
on:
  push:
    paths: ['.github/workflows/deliver-independent-daily-20260926.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  deliver:
    if: github.event.head_commit.message == 'Deliver approved Daily independently after lane guard verification'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6f4e9845503b6190a68bf3ecc65520de3d9c19f6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Test lane and delivery protections without model credentials
        run: PYTHONPATH=tests:. python -m unittest test_independent_readiness test_v2_autopilot_runtime test_v2_bundle test_v2_delivery test_v2_saved_replay -q
      - name: Restore reviewed media
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36230061018 --repo khalidonline/daily-news-snap --name repaired-saved-trial --dir repair-output
      - name: Deliver one saved reviewed Daily
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          from publishing_v2.bundle_api import GitHubJournal,BundleClient
          from publishing_v2.autopilot.runtime import rollout_ready,promotable_shadow,publish_package
          from publishing_v2.autopilot.pipeline import Pipeline
          from publishing_v2.autopilot import policy
          slot='autopilot-2026-09-26-daily-shadow-5771c0d01ff16a95'
          source=GitHubJournal(slot).read()
          now=lambda:datetime.now(timezone.utc)
          # Preserve original generation engine and sealed review. No restamping.
          if not rollout_ready(GitHubJournal('autopilot-readiness').read(),source['engine'],now(),lane='daily'):
              raise RuntimeError('daily_not_ready')
          approved=promotable_shadow(source,source['engine'],'daily',now(),slot)
          if not approved: raise RuntimeError('saved_review_not_promotable')
          paths=[Path(p) for p in approved['paths']]
          policy.verify_seal(approved['package'],paths,approved['approval'],now())
          BundleClient().ensure_capacity(4)
          live=GitHubJournal('autopilot-2026-09-26-daily-live')
          existing=live.read()
          if existing and existing.get('source_shadow_slot')!=slot: raise RuntimeError('different_daily_exists')
          if not existing:
              approved['audit'].append({'event':'independent_lane_delivery','at':now().isoformat(),'generation_engine_unchanged':True})
              live.save(approved)
          class NoProduction:
              receipts=[]
              def run(self,*a,**k):raise RuntimeError('production_forbidden_in_delivery')
          p=Pipeline(agent=NoProduction(),sources=None,render=None,store=live,publish=publish_package,output=Path('delivery-output'),now=now,engine=source['engine'])
          result=p.run('daily','live',rollout_verified=True)
          Path('delivery-output').mkdir(exist_ok=True)
          Path('delivery-output/result.json').write_text(json.dumps({'status':result['status'],'receipt':result.get('receipt'),'reason':result.get('reason')},ensure_ascii=False))
          if result['status']!='published':raise RuntimeError(result.get('reason','delivery_unconfirmed'))
          print(json.dumps(result['receipt']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-daily-delivery
          path: delivery-output/
