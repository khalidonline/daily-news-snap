name: Patch dedupe token normalization once

on:
  push:
    branches:
      - fix/daily-source-dedupe-20260829
    paths:
      - ".github/workflows/patch-dedupe-token.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-source-dedupe-20260829
      - name: Normalize attached Arabic clitics for dedupe
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("daily_news_runner.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _dedupe_tokens(text):
              normalized = _ARABIC_DIACRITICS_RE.sub("", str(text or ""))
              normalized = normalized.translate(_ARABIC_NORMALIZATION).casefold()
              tokens = set()
              for token in _DEDUPE_TOKEN_RE.findall(normalized):
                  if len(token) < 3 or token in _DEDUPE_STOPWORDS:
                      continue
                  tokens.add(token)
              return tokens
          '''
          new = '''def _normalize_dedupe_token(token):
              # Arabic commonly attaches conjunctions/prepositions to the noun.
              # Normalize only the high-confidence forms around the definite article
              # so "للنصر", "والنصر" and "بالنصر" compare as "النصر".
              if len(token) > 5 and token[0] in {"و", "ف"} and token[1:3] == "لل":
                  token = token[1:]
              if token.startswith("لل") and len(token) > 4:
                  return "ال" + token[2:]
              if len(token) > 4 and token[:3] in {"وال", "فال", "بال", "كال"}:
                  return token[1:]
              return token


          def _dedupe_tokens(text):
              normalized = _ARABIC_DIACRITICS_RE.sub("", str(text or ""))
              normalized = normalized.translate(_ARABIC_NORMALIZATION).casefold()
              tokens = set()
              for token in _DEDUPE_TOKEN_RE.findall(normalized):
                  token = _normalize_dedupe_token(token)
                  if len(token) < 3 or token in _DEDUPE_STOPWORDS:
                      continue
                  tokens.add(token)
              return tokens
          '''
          if old not in text:
              raise SystemExit("expected dedupe snippet not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/patch-dedupe-token.yml
          git config user.name "khalidonline"
          git config user.email "69767138+khalidonline@users.noreply.github.com"
          git add daily_news_runner.py .github/workflows/patch-dedupe-token.yml
          git commit -m "fix: normalize Arabic clitics in story dedupe"
          git push origin HEAD:fix/daily-source-dedupe-20260829
