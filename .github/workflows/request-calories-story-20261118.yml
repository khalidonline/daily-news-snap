name: Request approved calories Story on 18 November
on:
  push:
    branches: [main]
    paths: ['.github/workflows/request-calories-story-20261118.yml']
permissions:
  actions: write
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Request the approved Story publisher once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(TZ=Asia/Riyadh date +%F)" = 2026-11-18
          test "$(date -u +%s)" -ge "$(date -u -d '2026-11-18T06:00:00Z' +%s)"
          gh workflow run publish-approved-package.yml --repo khalidonline/daily-news-snap --ref main -f package=calories-comparison-20261118 -f mode=legacy-story
