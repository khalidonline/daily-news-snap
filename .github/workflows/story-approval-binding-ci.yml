name: Story approval binding CI

on:
  pull_request:
    paths:
      - '.github/workflows/story-approved-to-telegram.yml'
      - 'tests/test_story_approval_artifact_binding.py'
      - '.github/workflows/story-approval-binding-ci.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/story-approved-to-telegram.yml'
      - 'tests/test_story_approval_artifact_binding.py'
      - '.github/workflows/story-approval-binding-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: pytest -q tests/test_story_approval_artifact_binding.py
