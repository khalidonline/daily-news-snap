name: Save approved final 10 October Stories
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-final-20261010-once.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  archive:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'reconcile ambiguous daily archive 20261010 only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bad0d130d120f3afd8aa4f66f69df15fafbf2ac3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact project requirements
        run: pip install -r requirements.txt
      - name: Test Saved Story path and guarded batch syntax
        run: |
          python -m unittest discover -s tests -p test_v2_saved_story_api.py -q
          python -m py_compile approved/saved-stories/daily-20261010/save_batch.py
      - name: Save exact published files with live receipts inventory quota and budget checks
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: .
        run: python approved/saved-stories/daily-20261010/save_batch.py
