name: Temporary material fetch (never merged)
on:
  pull_request:
    paths: ['.github/workflows/material-probe.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Fetch today's Saudi feed items, article text and photos
        run: |
          python3 - <<'PY'
          import hashlib, html, json, os, re, urllib.request
          from datetime import datetime, timedelta, timezone
          from email.utils import parsedate_to_datetime
          from xml.etree import ElementTree
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          FEEDS = ['https://www.alyaum.com/rssFeed/1005', 'https://www.okaz.com.sa/rssFeed/0',
                   'https://www.argaam.com/ar/rss/ho-main-news?sectionid=1523', 'https://www.arriyadiyah.com/rss',
                   'https://www.almowaten.net/feed/', 'https://aawsat.com/feed']
          def get(url, limit=4_000_000):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read(limit)
          def plain(raw):
              raw = re.sub(r'(?is)<(script|style|noscript)[^>]*>.*?</\1>', ' ', raw)
              return ' '.join(html.unescape(re.sub(r'<[^>]+>', ' ', raw)).split())
          os.makedirs('material/img', exist_ok=True)
          now = datetime.now(timezone.utc); rows = []
          for feed in FEEDS:
              try:
                  root = ElementTree.fromstring(get(feed))
              except Exception as e:
                  print('FEED FAIL', feed, e); continue
              for item in list(root.iter('item'))[:14]:
                  try:
                      pub = parsedate_to_datetime(item.findtext('pubDate', ''))
                      if not now - timedelta(hours=36) <= pub <= now + timedelta(hours=1): continue
                  except Exception:
                      continue
                  link = item.findtext('link', '')
                  row = {'feed': feed, 'title': item.findtext('title', ''), 'link': link, 'published': pub.isoformat(),
                         'summary': plain(item.findtext('description', '') or '')[:1500]}
                  try:
                      page = get(link).decode('utf-8', 'replace')
                      og = re.search(r'<meta[^>]+(?:property|name)="og:image"[^>]+content="([^"]+)"', page) or \
                           re.search(r'<meta[^>]+content="([^"]+)"[^>]+(?:property|name)="og:image"', page)
                      body = plain(page)
                      row['text'] = body[:9000]
                      if og:
                          url = html.unescape(og.group(1)); row['og_image'] = url
                          raw = get(url, 12_000_000)
                          name = hashlib.sha256(url.encode()).hexdigest()[:16] + '.jpg'
                          open('material/img/' + name, 'wb').write(raw); row['image_file'] = name
                  except Exception as e:
                      row['error'] = type(e).__name__ + ' ' + str(getattr(e, 'code', ''))
                  rows.append(row)
          json.dump(rows, open('material/items.json', 'w'), ensure_ascii=False, indent=1)
          print('items', len(rows), 'with images', sum('image_file' in r for r in rows))
          PY
      - name: Commit material to this throwaway branch
        run: |
          git config user.name "material-fetch"
          git config user.email "material-fetch@users.noreply.github.com"
          git add material
          git commit -m "Fetched material for the manual test package" || exit 0
          git push origin HEAD:${{ github.head_ref }}
