name: Publish owner-approved Albaik story and public profile
on:
  push:
    branches: [codex/albaik-approved-20261024]
    paths: [.github/workflows/albaik-approved-20261024.yml]
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e9b522db0b7231c4421b8cc0184cef5c4096f492
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install Pillow pytest
      - name: Validate exact approved card and delivery protections
        run: |
          python -m publishing_v2.bundle_api validate --manifest approved/albaik-20261024/manifest.json
          python -m pytest tests/test_albaik.py tests/test_v2_bundle.py tests/test_v2_bundle_group.py tests/test_v2_readability.py tests/test_v2_saved_story_api.py -q
      - name: Deliver only approved Albaik and verify both destinations
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVED_COMMIT: e9b522db0b7231c4421b8cc0184cef5c4096f492
          PYTHONPATH: .
        run: python approved/albaik-20261024/publish-approved.py
