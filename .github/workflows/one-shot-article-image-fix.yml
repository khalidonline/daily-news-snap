name: One-shot article image relevance fix

on:
  push:
    paths:
      - ".github/workflows/one-shot-article-image-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reject-unrelated-article-images
      - name: Remove neutral article fallback
        run: sed -i '/if neutral\[2\] == "article":/,/print(f"      auto image: rejecting neutral fallback from {neutral\[2\]}")/c\            print(f"      auto image: rejecting neutral fallback from {neutral[2]}")' daily_news_runner.py
      - name: Commit fix to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_news_runner.py
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix: require direct relevance for article images"
          git push origin HEAD:fix/reject-unrelated-article-images
