name: Runtime relevance tests

on:
  pull_request:
    paths:
      - "runtime_relevance.py"
      - "story_runtime.py"
      - "publish_cards.py"
      - "tests/test_publish_cards_selector.py"
      - "tests/test_runtime_relevance.py"
      - "tools/bulk_visual_*.py"
      - "tests/test_bulk_visual_*.py"
      - "images/relevance.json"
      - "images/images.txt"
      - "images/logos/**"
      - "images/bogle-vanguard-*.jpg"
      - "stories.txt"
      - ".github/workflows/story.yml"
      - ".github/workflows/runtime-relevance-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Relevance policy unit tests
        run: python -m unittest -v tests/test_runtime_relevance.py
      - name: Publisher selector unit tests
        run: python -m unittest -v tests/test_publish_cards_selector.py
      - name: Compile guarded story entrypoint
        run: python -m py_compile runtime_relevance.py story_runtime.py story_bot.py publish_cards.py preflight_stories.py image_precheck.py news_bot.py
      - name: Image precheck self-test
        run: python image_precheck.py --selftest
      - name: Bulk board invariants
        run: |
          PYTHONPATH=. python - <<'PY'
          from tools.bulk_visual_board import build_board

          board = build_board()
          assert len(board) == 123, len(board)
          for row in board:
              if row.status == "PASS":
                  assert row.need_photos == 0, (row.story, row.need_photos)
                  assert row.need_logo is False, (row.story, row.need_logo)
          PY
      - name: Jack Bogle regression — repaired runtime coverage is PASS
        run: |
          python - <<'PY'
          import story_runtime as sr

          story = 'Jack Bogle: أنشأ صندوق المؤشرات ورفض أن يصبح ملياردير'
          photos, logos, status = sr.coverage(story)
          print('Bogle photos:', [p.name for p in photos])
          print('Bogle logos:', [p.name for p in logos])
          print('Bogle status:', status)
          assert status == 'PASS', status
          assert len(photos) >= 4, len(photos)
          assert len(logos) >= 1, len(logos)
          PY
