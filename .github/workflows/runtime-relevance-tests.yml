name: Runtime relevance tests

on:
  push:
    paths:
      - "runtime_relevance.py"
      - "story_runtime.py"
      - "story_bot.py"
      - "story_focus.py"
      - "ready_story_publish.py"
      - "tests/test_runtime_relevance.py"
      - "tests/test_ready_story_publish.py"
      - "tests/test_story_workflow_choices.py"
      - "tests/test_story_focus.py"
      - "tests/test_city_visual_fallback.py"
      - "images/relevance.json"
      - "images/images.txt"
      - "images/bogle-vanguard-*.jpg"
      - "images/logos/**"
      - ".github/workflows/story.yml"
      - ".github/workflows/runtime-relevance-tests.yml"
  pull_request:
    paths:
      - "runtime_relevance.py"
      - "story_runtime.py"
      - "story_bot.py"
      - "story_focus.py"
      - "ready_story_publish.py"
      - "tests/test_runtime_relevance.py"
      - "tests/test_ready_story_publish.py"
      - "tests/test_story_workflow_choices.py"
      - "tests/test_story_focus.py"
      - "tests/test_city_visual_fallback.py"
      - "images/relevance.json"
      - "images/images.txt"
      - "images/bogle-vanguard-*.jpg"
      - "images/logos/**"
      - ".github/workflows/story.yml"
      - ".github/workflows/runtime-relevance-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Relevance policy unit tests
        run: python -m unittest -v tests/test_runtime_relevance.py
      - name: Ready-pool publishing unit tests
        run: python -m unittest -v tests/test_ready_story_publish.py
      - name: Story workflow choice regression
        run: python -m unittest -v tests/test_story_workflow_choices.py
      - name: Story subject and visual focus regressions
        run: python -m unittest -v tests/test_story_focus.py
      - name: City visual fallback regressions
        run: python -m unittest -v tests/test_city_visual_fallback.py
      - name: Compile guarded story entrypoint
        run: python -m py_compile runtime_relevance.py story_runtime.py story_bot.py story_focus.py preflight_stories.py image_precheck.py news_bot.py
      - name: Image precheck self-test
        run: python image_precheck.py --selftest
      - name: Jack Bogle regression — require repaired source coverage
        run: |
          PYTHONPATH=. python - <<'PY'
          import story_runtime as sr
          story = "Jack Bogle: أنشأ صندوق المؤشرات ورفض أن يصبح ملياردير"
          photos, logos, status = sr.coverage(story)
          print("Bogle photos:", [p.name for p in photos])
          print("Bogle logos:", [p.name for p in logos])
          print("Bogle status:", status)
          if len(photos) < 4:
              raise SystemExit(f"expected at least 4 approved Bogle photos, got {len(photos)}")
          if not logos:
              raise SystemExit("expected a verified Vanguard logo")
          if status != "PASS":
              raise SystemExit(f"expected Bogle PASS, got {status}")
          PY
