name: Publish approved dates 20261004
on:
  push:
    paths: ['.github/workflows/publish-dates-20261004.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'khalidonline/daily-news-snap' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish approved dates request 20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6a479d8edf0decc6ea49df5d6c56bc057b53b62b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-v2-images.txt pytest
      - name: Offline publisher checks
        run: |
          python -m pytest -q tests/test_v2_bundle.py tests/test_v2_bundle_group.py
          python -m publishing_v2.bundle_api validate --manifest approved/dates-20261004/manifest.json
      - name: Verify time, cost record, receipts and actual quota
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,base64
          from pathlib import Path
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          from publishing_v2.bundle_api import BundleClient,GitHubJournal,HTTPFailure,load_package
          m=json.loads(Path('approved/dates-20261004/manifest.json').read_text())
          now=datetime.now(timezone.utc)
          assert datetime.fromisoformat(m['not_before'].replace('Z','+00:00')) <= now < datetime.fromisoformat(m['expires_at'].replace('Z','+00:00'))
          identity,_,_=load_package('approved/dates-20261004/manifest.json')
          j=GitHubJournal(identity)
          state=j.read()
          print('Existing receipt states:',{k:v.get('status') for k,v in state.items()})
          day=now.astimezone(ZoneInfo('Asia/Riyadh')).date().isoformat()
          try:
              r=j.call('/contents/daily/'+day+'.json?ref=cost-ledger')
              ledger=json.loads(base64.b64decode(r['content']))
              total=sum(v.get('charged_micro_usd',0)+(v.get('reserved_micro_usd',0) if v.get('status')!='settled' else 0) for v in ledger.get('reservations',{}).values())
              print('Ledger date:',day,'committed micro USD:',total)
              assert total <= 3000000
          except HTTPFailure as e:
              if e.code!=404: raise
              print('No daily ledger: daily total UNKNOWN. This publish-only run has no paid model calls.')
          c=BundleClient();c.check()
          usage=c.ensure_capacity(3)
          print('Actual quota before; preserve at least two operations:',json.dumps(usage))
          PY
      - name: Publish approved sealed JPGs once for one week
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          POST_TO_SNAPCHAT: '1'
          DRY_RUN: '0'
        run: python -m publishing_v2.bundle_api publish --manifest approved/dates-20261004/manifest.json
