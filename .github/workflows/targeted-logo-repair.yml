name: Targeted official-logo repair

on:
  push:
    branches:
      - repair/all-story-visuals-2026-08-29
    paths:
      - ".github/targeted-logo-repair-trigger"

permissions:
  contents: write

concurrency:
  group: targeted-official-logo-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/all-story-visuals-2026-08-29
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Apply declared story identities and fetch verified current logos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from logo_fetch import (
              LOGOS_DIR,
              _commons_fileinfo,
              _commons_licence_ok,
              _download,
              _renders_as_a_mark,
              fetch_current,
              update_index,
              wikidata_p154_logo,
          )

          manifest = json.loads(Path('logo_repair_assets.json').read_text(encoding='utf-8'))
          stories = Path('stories.txt').read_text(encoding='utf-8')
          for spec in manifest.get('assets', []):
              before = spec['line_before']
              after = spec['line_after']
              if after not in stories:
                  if before not in stories:
                      raise SystemExit(f"story line not found for {spec['story']}")
                  stories = stories.replace(before, after, 1)
              LOGOS_DIR.mkdir(parents=True, exist_ok=True)
              got = fetch_current(spec['domain'], spec['names'], require_domain=spec['domain'])
              if not got:
                  filename = wikidata_p154_logo(spec['names'], spec['domain'])
                  if filename:
                      title = f"File:{filename}"
                      for page, info in _commons_fileinfo([title]):
                          if not _commons_licence_ok(info):
                              continue
                          link = info.get('thumburl') or info.get('url')
                          if not link:
                              continue
                          dest = LOGOS_DIR / f"{spec['domain']}-current.png"
                          _download(link, dest)
                          if _renders_as_a_mark(dest):
                              got = dest
                              print(
                                  f"verified Wikidata P154 logo: {spec['story']} -> {got} "
                                  f"(P856={spec['domain']})"
                              )
                              break
              if not got:
                  raise SystemExit(f"no verified current logo for {spec['domain']}")
              update_index(spec['domain'], spec['names'] + [spec['domain']])
              print(f"verified logo: {spec['story']} -> {got}")
          Path('stories.txt').write_text(stories, encoding='utf-8')
          PY

      - name: Commit accepted identity and logo assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "story-visual-repair-bot"
          git config user.email "actions@github.com"
          git add stories.txt images/logos/ logo_repair_assets.json
          if ! git diff --cached --quiet; then
            git commit -m "repair: add verified official story logo"
            git pull --rebase origin repair/all-story-visuals-2026-08-29
            git push origin HEAD:repair/all-story-visuals-2026-08-29
          fi

      - name: Strict targeted gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin repair/story-visual-coverage
          rm -rf /tmp/story-repair-engine
          mkdir -p /tmp/story-repair-engine
          git archive origin/repair/story-visual-coverage | tar -x -C /tmp/story-repair-engine
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, '/tmp/story-repair-engine')
          from tools.bulk_visual_board import build_board
          manifest = json.loads(Path('logo_repair_assets.json').read_text(encoding='utf-8'))
          stories = [a['story'] for a in manifest.get('assets', [])]
          rows = build_board(stories)
          for row in rows:
              print(f"FINAL {row.story}: {row.status}; photos={list(row.photos)}; logos={list(row.logos)}")
          if any(row.status != 'PASS' for row in rows):
              raise SystemExit("one or more targeted logo repairs still fail strict visual gate")
          PY

      - name: Refresh evidence-backed READY state
        env:
          POST_TO_SNAPCHAT: "0"
          DRY_RUN: "1"
        shell: bash
        run: |
          set -euo pipefail
          python publication_ready_pool.py
          git config user.name "story-visual-repair-bot"
          git config user.email "actions@github.com"
          git add state/ready_to_post.json
          if ! git diff --cached --quiet; then
            git commit -m "state: refresh evidence-backed READY pool"
            git pull --rebase origin repair/all-story-visuals-2026-08-29
            git push origin HEAD:repair/all-story-visuals-2026-08-29
          fi
