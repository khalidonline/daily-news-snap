name: Archive read-only audit 20261003-2352
on:
  push:
    paths: ['.github/workflows/archive-audit-20261003-2352.yml']
permissions:
  contents: read
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  audit:
    if: github.event.head_commit.message == 'Read archive state request 20261003-2352'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f2094a14df7696a09c4e5596682edff8f85e03ec
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read quota budget and Saved Story inventory
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          from publishing_v2.saved_story_api import SavedClient
          from daily_budget import GitHubStore,day_key
          c=SavedClient();c.check()
          report={'checked_at':datetime.now(timezone.utc).isoformat(),'read_only':True,'paid_model_requests':0,'reserve_operations':2}
          report['quota']=c.ensure_capacity(1)
          _,ledger=GitHubStore(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN']).read(day_key())
          report['budget']={'day':day_key(),'ledger_present':ledger is not None,'charged_micro_usd':sum(e['charged_micro_usd'] for e in ledger.get('entries',{}).values()) if ledger is not None else None}
          offset=0; stories=[]
          while True:
              result=c.call('/post/?teamId='+c.team+'&offset='+str(offset)+'&limit=100')
              rows=result.get('items');total=result.get('total')
              assert isinstance(rows,list) and type(total) is int
              for row in rows:
                  assert row.get('teamId')==c.team
                  snap=(row.get('data') or {}).get('SNAPCHAT') or {}
                  if snap.get('type')=='SAVED_STORY' and not row.get('deletedAt') and row.get('status')!='DELETED':
                      stories.append({k:row.get(k) for k in ['id','title','status','referenceKey'] } | {'uploadIds':snap.get('uploadIds'),'snapTitle':snap.get('title')})
              offset+=len(rows)
              if offset>=total:break
              assert rows and offset<=10000
          report['saved_stories']=stories
          report['available_after_reserve']=max(0,report['quota']['remaining']-2) if 'remaining' in report['quota'] else None
          Path('archive-audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: archive-audit-20261003-2352
          path: archive-audit.json
