name: Inspect pending archives 20261001
on:
  push:
    paths: ['.github/workflows/inspect-archives-20261001.yml']
permissions:
  contents: read
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect pending archives 20261001 owner request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5a1353b66205d097642ec366558059cf4174004b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read provider inventory and quota
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
        run: |
          python - <<'PY'
          import json, urllib.parse
          from publishing_v2.bundle_api import BundleClient
          c=BundleClient();c.check()
          print('QUOTA',json.dumps(c.ensure_capacity(1)))
          offset=0
          while True:
            page=c.call('/post/?'+urllib.parse.urlencode({'teamId':c.team,'offset':offset,'limit':100}))
            assert isinstance(page.get('items'),list) and type(page.get('total')) is int
            for p in page['items']:
              s=(p.get('data') or {}).get('SNAPCHAT') or {}
              if s:
                print('POST',json.dumps({k:p.get(k) for k in ['id','title','status','deletedAt','referenceKey','createdAt']}|{'snap':s},ensure_ascii=False))
            offset+=len(page['items'])
            if offset>=page['total']:break
            assert page['items'] and offset<10000
          PY
