name: Publish approved NVIDIA Sega package
on:
  push:
    paths:
      - '.github/workflows/publish-nvidia-approved-20261007.yml'
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Run approved NVIDIA Sega delivery 20261007-1209'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3471057f662aaa024d91d9af42bf2b739e5c38c2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-v2-images.txt pytest
      - name: Offline safety and photo-credit checks
        run: python -m pytest -q tests/test_v2_bundle.py tests/test_v2_bundle_group.py tests/test_v2_publication_selection.py tests/test_v2_readability.py tests/test_v2_autopilot_credits.py tests/test_v2_public_image_credits.py tests/test_v2_sharealike_credit.py
      - name: Validate quota budget and publish exact approved files
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVED_COMMIT: 3471057f662aaa024d91d9af42bf2b739e5c38c2
          PYTHONPATH: .
        run: python approved/nvidia-sega-20261007/publish-approved.py
