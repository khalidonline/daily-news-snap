name: Publish approved mental health and eggs 20261010
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-two-20261010-once.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'publish approved mental health and eggs 20261010 once'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7924dd558b9df19c0463ddc83c1c82423e774362
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Validate sealed cards and publisher safeguards
        run: |
          python -c "import base64; from pathlib import Path; [p.with_suffix('').write_bytes(base64.b64decode(p.read_text(),validate=True)) for slug in ['mental-health-20261010','brown-eggs-20261010'] for p in (Path('approved')/slug).glob('*.jpg.b64')]"
          python -m unittest tests.test_v2_owner_design tests.test_v2_readability
          python -m publishing_v2.bundle_api validate --manifest approved/mental-health-20261010/manifest.json
          python -m publishing_v2.bundle_api validate --manifest approved/brown-eggs-20261010/manifest.json
      - name: Check live quota and budget then publish approved cards
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_COMMIT: 7924dd558b9df19c0463ddc83c1c82423e774362
          PYTHONPATH: .
          POST_TO_SNAPCHAT: '1'
          DRY_RUN: '0'
        run: python -u approved/mental-health-20261010/publish-approved.py
