name: Save compact archive pair 20261003
on:
  push:
    paths: ['.github/workflows/archive-compact-20261003.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  save:
    if: github.event.head_commit.message == 'Save compact pair approved 20261003-130159'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7f357f288d27b85eafc5534f1e115258f9e27b4a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest -r requirements.txt -r requirements-v2-images.txt
      - run: |
          python -m pytest -q tests/test_v2_saved_story_api.py
          PYTHONPATH=. python approved/archive-compact-20261003/save.py --validate
      - name: Save independent editions
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: python approved/archive-compact-20261003/save.py
