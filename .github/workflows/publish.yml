name: Publish built cards

# Posts a story that story_bot already built, exactly as it was reviewed.
# No research call, no image search, no re-rendering — the frames in cards/
# are the frames that go out. Manual only: this is the review step.

on:
  workflow_dispatch:
    inputs:
      stamp:
        description: "Story name, part of name, or timestamp — blank = latest (e.g. سليمان or 2026-08-22-2pm)"
        type: string
        required: false
      dry_run:
        description: "Preview only — do not publish"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-cards
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt imageio-ffmpeg

      - name: Publish the cards
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_PROVIDER: "bundle"
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          BUNDLE_BASE: ${{ vars.BUNDLE_BASE }}
          MEDIA_MODE: "github"
          MONTHLY_POST_LIMIT: "145"
          CARDS_STAMP: ${{ inputs.stamp }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        # Safety wrapper refuses a multi-frame live Bundle publish because
        # Bundle/Snapchat cannot guarantee separate photo Story snaps.
        run: python safe_publish_cards.py
