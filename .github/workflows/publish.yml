name: Telegram story review

# Simple manual review workflow:
# Jack Bogle is the default story. The story field is optional; leaving it
# unchanged builds one fresh six-card Jack Bogle deck with the standard visual
# coverage, verifies it, and sends it privately to Telegram. Snapchat is never
# called here.

on:
  workflow_dispatch:
    inputs:
      story:
        description: "Story — leave unchanged to review Jack Bogle"
        type: string
        required: false
        default: "Jack Bogle: أنشأ صندوق المؤشرات ورفض أن يصبح ملياردير"

permissions:
  contents: write

concurrency:
  group: telegram-story-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt imageio-ffmpeg

      - name: Build one fresh story and send to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH_MODE: "telegram_review"
          STORY: ${{ inputs.story || 'Jack Bogle: أنشأ صندوق المؤشرات ورفض أن يصبح ملياردير' }}

          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STORY_MODEL: "claude-opus-5"
          STORY_FRAMES: "6"
          STORY_ALLOW_REPEAT: "1"
          THEME: "light"
          BRAND: "ملخص تنفيذي - قصة"
          FONT_FAMILY: "Almarai"
          ALLOW_GENERATED: "0"
          ALLOW_STORY_GENERATION: "0"
          POST_TO_SNAPCHAT: "0"
          MEDIA_MODE: "github"
        run: python safe_publish_cards.py
