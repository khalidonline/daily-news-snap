name: Telegram story review

# Simple manual review workflow:
# choose one story + number of picture cards, build one fresh six-card deck,
# verify it, and send it privately to Telegram. Snapchat is never called here.

on:
  workflow_dispatch:
    inputs:
      story:
        description: "Story name (for example: Jack Bogle or سليمان الراجحي)"
        type: string
        required: true
      photo_count:
        description: "Number of picture cards"
        type: choice
        required: true
        default: "4"
        options:
          - "1"
          - "2"
          - "3"
          - "4"

permissions:
  contents: write

concurrency:
  group: telegram-story-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt imageio-ffmpeg

      - name: Build one fresh story and send to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH_MODE: "telegram_review"
          STORY: ${{ inputs.story }}
          PHOTO_COUNT: ${{ inputs.photo_count }}

          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STORY_MODEL: "claude-opus-5"
          STORY_FRAMES: "6"
          STORY_ALLOW_REPEAT: "1"
          THEME: "light"
          BRAND: "ملخص تنفيذي - قصة"
          FONT_FAMILY: "Almarai"
          ALLOW_GENERATED: "0"
          ALLOW_STORY_GENERATION: "0"
          POST_TO_SNAPCHAT: "0"
          MEDIA_MODE: "github"
        run: python safe_publish_cards.py
