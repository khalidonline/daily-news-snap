name: Publish built cards

# Manual review/release workflow for stories already built by story_bot.
# Telegram is the private review stage; Snapchat is the public release stage.
# No research call, no image search, no re-rendering.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Action"
        type: choice
        required: true
        default: telegram_review
        options:
          - telegram_review
          - snapchat
      stamp:
        description: "Story name, part of name, or timestamp — blank = latest (e.g. سليمان or 2026-08-22-2pm)"
        type: string
        required: false
      dry_run:
        description: "Preview in workflow logs only — send/publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-cards
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt imageio-ffmpeg

      - name: Review or publish the cards
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_PROVIDER: "bundle"
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          BUNDLE_BASE: ${{ vars.BUNDLE_BASE }}
          MEDIA_MODE: "github"
          MONTHLY_POST_LIMIT: "145"
          PUBLISH_MODE: ${{ inputs.mode }}
          CARDS_STAMP: ${{ inputs.stamp }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        # telegram_review: private album/caption review only; no Bundle/quota.
        # snapchat: public release path, still protected by the multi-frame gate.
        run: python safe_publish_cards.py
