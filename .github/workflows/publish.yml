name: Publish built cards

# Manual private-review/public-release workflow.
# Telegram review normally uses an already-built deck. If that baked deck is
# stale under the current visual standard, review mode rebuilds the same story
# once with Snapchat disabled, verifies the fresh cards, then sends Telegram.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Action"
        type: choice
        required: true
        default: telegram_review
        options:
          - telegram_review
          - snapchat
      stamp:
        description: "Story name, part of name, or timestamp — blank = latest (e.g. سليمان or 2026-08-22-2pm)"
        type: string
        required: false
      dry_run:
        description: "Preview in workflow logs only — send/publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-cards
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt imageio-ffmpeg

      - name: Review or publish the cards
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_PROVIDER: "bundle"
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          BUNDLE_BASE: ${{ vars.BUNDLE_BASE }}
          MEDIA_MODE: "github"
          MONTHLY_POST_LIMIT: "145"
          PUBLISH_MODE: ${{ inputs.mode }}
          CARDS_STAMP: ${{ inputs.stamp }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

          # Needed only when telegram_review detects an old/incomplete baked
          # deck and rebuilds that same story. The subprocess strips Telegram
          # and Bundle credentials and forces POST_TO_SNAPCHAT=0.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STORY_MODEL: "claude-opus-5"
          STORY_FRAMES: "6"
          STORY_ALLOW_REPEAT: "1"
          THEME: "light"
          BRAND: "ملخص تنفيذي - قصة"
          FONT_FAMILY: "Almarai"
          ALLOW_GENERATED: "0"
          ALLOW_STORY_GENERATION: "0"

        # telegram_review: private review only; stale decks auto-rebuild once.
        # snapchat: public release path, protected by the multi-frame gate.
        run: python safe_publish_cards.py
