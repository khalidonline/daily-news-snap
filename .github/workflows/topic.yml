name: Topic brief to Snapchat

on:
  schedule:
    - cron: "0 6 * * *"        # 09:00 KSA daily
  workflow_dispatch:
    inputs:
      topic:
        description: "الموضوع — اكتب موضوعاً محدداً، أو اتركه فارغاً"
        type: string
        required: false
      season:
        description: "موسم — اسم موسم من seasons.txt (مثل: الدوري، كأس آسيا، رمضان)"
        type: string
        required: false
      dry_run:
        description: "Render the card but don't post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # A manual run and the 09:00 KSA run must never publish/update topic state together.
  group: topic-brief
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Research and post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_PROVIDER: "bundle"        # bundle | ayrshare | zernio
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          BUNDLE_BASE: ${{ vars.BUNDLE_BASE }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_ACCOUNT_ID: ${{ vars.ZERNIO_ACCOUNT_ID }}
          ZERNIO_BASE: ${{ vars.ZERNIO_BASE }}
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REQUIRE_PHOTO: "1"
          TOPIC_ATTEMPTS: "3"
          SCORE_TRIGGER: ${{ vars.SCORE_TRIGGER }}
          SCORE_SEASON: ${{ vars.SCORE_SEASON }}
          SCORE_MONTHLY: ${{ vars.SCORE_MONTHLY }}         # 0 = allow text-only cards
          ALLOW_GENERATED: "1"       # topic cards only — never news
          IMAGE_GEN: "byteplus"      # byteplus | fal
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_URL: ${{ vars.ARK_URL }}
          ARK_MODEL: ${{ vars.ARK_MODEL }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          TOPIC: ${{ inputs.topic }}
          FORCE_SEASON: ${{ inputs.season }}
          TOPICS_FILE: "topics.txt"
          VOICE_FILE: "voice.txt"
          TOPIC_PERFORMANCE_FILE: "state/topic_performance.json"
          THEME: "light"
          BRAND: "معلومة تهمك"
          KICKER: "معلومة تهمك"
          FONT_FAMILY: "Almarai"
          REQUIRE_SAUDI_CONTEXT: ${{ vars.REQUIRE_SAUDI_CONTEXT }}
          MIN_TERM_HITS: ${{ vars.MIN_TERM_HITS }}
          MIN_PHOTO_SCORE: ${{ vars.MIN_PHOTO_SCORE }}
          # Topic Brief prioritizes direct subject relevance over image freshness.
          # A verified SAMA/company/person artifact may therefore be reused.
          LIBRARY_REUSE_DAYS: "0"
          COOLDOWN_DAYS: "21"
          HARD_COOLDOWN_DAYS: "21"
          SELECT_MODEL: "claude-haiku-4-5-20251001"
          LOOKBACK_HOURS: "30"
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          MEDIA_MODE: "github"
          POST_TO_SNAPCHAT: "1"   # 0 = hybrid, 1 = post automatically
          # one cap shared with daily.yml: state/quota.json is a single file,
          # so the two must name the same number or each would stop the other
          # at its own limit
          MONTHLY_POST_LIMIT: "145"
          IMAGE_SOURCE: "auto"      # best relevant eligible photo wins; source is secondary
          POINTS: "3"
          MAX_SEARCHES: "6"
        run: python topic_snapchat.py

      - name: Keep the card for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic-card
          path: out/*.png
          retention-days: 7
          if-no-files-found: ignore
