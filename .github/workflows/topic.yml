name: Topic brief to Snapchat

on:
  schedule:
    - cron: "0 6 * * *"        # 09:00 KSA daily
  workflow_dispatch:
    inputs:
      topic:
        description: "الموضوع — leave blank to use today's topic from topics.txt"
        type: string
        required: false
      dry_run:
        description: "Render the card but don't post"
        type: boolean
        default: false
      image_source:
        description: "Where the photo comes from"
        type: choice
        options:
          - openverse
          - none
          - article
          - stock
        default: openverse

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Research and post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          TOPICS_FILE: "topics.txt"
          VOICE_FILE: "voice.txt"
          THEME: "light"
          BRAND: "ملخص تنفيذي"
          FONT_FAMILY: "NotoNaskhArabic"
          COOLDOWN_DAYS: "21"
          HARD_COOLDOWN_DAYS: "5"
          SELECT_MODEL: "claude-sonnet-5"
          LOOKBACK_HOURS: "30"
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          MEDIA_MODE: "github"
          IMAGE_SOURCE: ${{ inputs.image_source }}
          POINTS: "3"
          MAX_SEARCHES: "6"
        run: python topic_bot.py

      - name: Keep the card for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic-card
          path: out/*.png
          retention-days: 7
          if-no-files-found: ignore
