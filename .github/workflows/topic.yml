name: Topic brief to Snapchat

on:
  schedule:
    - cron: "0 6 * * *"        # 09:00 KSA daily
  workflow_dispatch:
    inputs:
      topic:
        description: "الموضوع — اكتب موضوعاً محدداً، أو اتركه فارغاً"
        type: string
        required: false
      season:
        description: "موسم — اسم موسم من seasons.txt (مثل: الدوري، كأس آسيا، رمضان)"
        type: string
        required: false
      model:
        description: "النموذج — جرّب الاثنين وقارن"
        type: choice
        options:
          - claude-opus-5
          - claude-sonnet-5
        default: claude-opus-5
      dry_run:
        description: "Render the card but don't post"
        type: boolean
        default: false
      image_source:
        description: "Where the photo comes from"
        type: choice
        options:
          - spa
          - generate
          - openverse
          - none
          - article
          - stock   # Pexels
        default: spa

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Research and post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REQUIRE_PHOTO: "1"
          TOPIC_ATTEMPTS: "3"         # 0 = allow text-only cards
          ALLOW_GENERATED: "1"       # topic cards only — never news
          IMAGE_GEN: "byteplus"      # byteplus | fal
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_URL: ${{ vars.ARK_URL }}
          ARK_MODEL: ${{ vars.ARK_MODEL }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          TOPIC: ${{ inputs.topic }}
          TOPIC_MODEL: ${{ inputs.model || 'claude-opus-5' }}
          FORCE_SEASON: ${{ inputs.season }}
          TOPICS_FILE: "topics.txt"
          VOICE_FILE: "voice.txt"
          THEME: "light"
          BRAND: "ملخص تنفيذي"
          FONT_FAMILY: "Almarai"
          REQUIRE_SAUDI_CONTEXT: ${{ vars.REQUIRE_SAUDI_CONTEXT }}
          MIN_TERM_HITS: ${{ vars.MIN_TERM_HITS }}
          MIN_PHOTO_SCORE: ${{ vars.MIN_PHOTO_SCORE }}
          COOLDOWN_DAYS: "21"
          HARD_COOLDOWN_DAYS: "5"
          SELECT_MODEL: "claude-haiku-4-5-20251001"
          LOOKBACK_HOURS: "30"
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          MEDIA_MODE: "github"
          POST_TO_SNAPCHAT: "0"   # 0 = hybrid, 1 = post automatically
          MONTHLY_POST_LIMIT: "60"
          IMAGE_SOURCE: ${{ inputs.image_source || 'spa' }}
          POINTS: "3"
          MAX_SEARCHES: "6"
        run: python topic_bot.py

      - name: Keep the card for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic-card
          path: out/*.png
          retention-days: 7
          if-no-files-found: ignore
