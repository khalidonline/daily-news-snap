name: Topic brief to Snapchat

on:
  schedule:
    - cron: "0 6 * * *"        # temporary fallback: 09:00 KSA daily
  repository_dispatch:
    types: [topic-schedule, topic-recovery]
  workflow_dispatch:
    inputs:
      scheduled_slot:
        description: "Scheduler-only ISO KSA slot; leave empty for manual run"
        type: string
        required: false
      topic:
        description: "الموضوع — اكتب موضوعاً محدداً، أو اتركه فارغاً"
        type: string
        required: false
      season:
        description: "موسم — اسم أو alias من seasons.txt (مثل: LEAP، ليب، رمضان)"
        type: string
        required: false
      dry_run:
        description: "Render the card but don't post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: topic-brief
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Check exact Topic recovery duplicate
        if: ${{ github.event.action == 'topic-recovery' && github.event.client_payload.brief_b64 != '' }}
        env:
          RECOVERY_BRIEF_B64: ${{ github.event.client_payload.brief_b64 }}
        run: |
          python3 topic_delivery_guard.py check \
            --payload-b64 "$RECOVERY_BRIEF_B64" \
            --state state/topic_telegram_deliveries.json \
            --github-env "$GITHUB_ENV"

      - name: Authorize exact Topic recovery
        if: ${{ github.event.action == 'topic-recovery' && github.event.client_payload.brief_b64 != '' && env.RECOVERY_ALREADY_DELIVERED != '1' }}
        env:
          RECOVERY_BRIEF_B64: ${{ github.event.client_payload.brief_b64 }}
        run: |
          echo "RUN_SCHEDULED_BOT=1" >> "$GITHUB_ENV"
          echo "SCHEDULE_SLOT_ID=" >> "$GITHUB_ENV"
          echo "exact Topic recovery — schedule gate bypassed after delivery dedupe"

      - name: Resolve Topic schedule slot
        if: ${{ env.RUN_SCHEDULED_BOT == '' }}
        env:
          REQUESTED_SLOT: ${{ github.event.client_payload.slot || inputs.scheduled_slot || '' }}
        run: |
          python3 shared_schedule_gate.py due \
            --bot topic \
            --event-name "${{ github.event_name }}" \
            --requested-slot "$REQUESTED_SLOT" \
            --requested-slot-file scheduler/triggers/topic.txt \
            --state state/topic_schedule_slots.json \
            --github-env "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        if: ${{ env.RUN_SCHEDULED_BOT != '0' }}
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: ${{ env.RUN_SCHEDULED_BOT != '0' }}

      - name: Resolve manual season alias
        if: ${{ env.RUN_SCHEDULED_BOT != '0' && github.event_name == 'workflow_dispatch' }}
        env:
          REQUESTED_SEASON: ${{ inputs.season }}
        run: |
          resolved="$(python season_aliases.py "$REQUESTED_SEASON" seasons.txt)"
          echo "FORCE_SEASON=$resolved" >> "$GITHUB_ENV"
          if [ -n "$REQUESTED_SEASON" ] && [ "$resolved" != "$REQUESTED_SEASON" ]; then
            echo "season alias: $REQUESTED_SEASON -> $resolved"
          fi

      - name: Research and post
        if: ${{ env.RUN_SCHEDULED_BOT != '0' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.TOPIC_MODEL || 'claude-sonnet-5' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_PROVIDER: "bundle"
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          BUNDLE_BASE: ${{ vars.BUNDLE_BASE }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_ACCOUNT_ID: ${{ vars.ZERNIO_ACCOUNT_ID }}
          ZERNIO_BASE: ${{ vars.ZERNIO_BASE }}
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REQUIRE_PHOTO: "1"
          TOPIC_ATTEMPTS: "3"
          SCORE_TRIGGER: ${{ vars.SCORE_TRIGGER }}
          SCORE_SEASON: ${{ vars.SCORE_SEASON }}
          SCORE_MONTHLY: ${{ vars.SCORE_MONTHLY }}
          ALLOW_GENERATED: "0"
          IMAGE_GEN: "byteplus"
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_URL: ${{ vars.ARK_URL }}
          ARK_MODEL: ${{ vars.ARK_MODEL }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          TOPIC: ${{ inputs.topic }}
          TOPIC_RECOVERY_BRIEF_B64: ${{ github.event.client_payload.brief_b64 || '' }}
          TOPICS_FILE: "topics.txt"
          VOICE_FILE: "voice.txt"
          TOPIC_PERFORMANCE_FILE: "state/topic_performance.json"
          THEME: "light"
          BRAND: "معلومة تهمك"
          KICKER: "معلومة تهمك"
          FONT_FAMILY: "Almarai"
          REQUIRE_SAUDI_CONTEXT: ${{ vars.REQUIRE_SAUDI_CONTEXT }}
          MIN_TERM_HITS: ${{ vars.MIN_TERM_HITS }}
          MIN_PHOTO_SCORE: ${{ vars.MIN_PHOTO_SCORE }}
          LIBRARY_REUSE_DAYS: "0"
          COOLDOWN_DAYS: "21"
          HARD_COOLDOWN_DAYS: "21"
          SELECT_MODEL: "claude-haiku-4-5-20251001"
          LOOKBACK_HOURS: "30"
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          MEDIA_MODE: "github"
          POST_TO_SNAPCHAT: "0"
          MONTHLY_POST_LIMIT: "145"
          IMAGE_SOURCE: "auto"
          POINTS: "3"
          MAX_SEARCHES: "6"
          MODEL_BOT: "topic"
          MODEL_USAGE_PATH: "out/model_usage.jsonl"
          MODEL_MAX_USD_PER_RUN: "1.50"
          TOPIC_SELECT_MAX_PAID_RESPONSES: "1"
          TOPIC_MAX_PAID_RESPONSES: "2"
          VISION_MAX_PAID_RESPONSES: "20"
          IMAGE_GEN_MAX_PAID_RESPONSES: "2"
          ARK_IMAGE_USD_PER_CALL: ${{ vars.ARK_IMAGE_USD_PER_CALL }}
          FAL_IMAGE_USD_PER_CALL: ${{ vars.FAL_IMAGE_USD_PER_CALL }}
        run: |
          mkdir -p out
          set -o pipefail
          python topic_snapchat.py 2>&1 | tee out/topic_run.log
          if [ "${DRY_RUN:-}" != "1" ] && ! grep -Fq "telegram: sent" out/topic_run.log; then
            echo "Topic card was not confirmed delivered to Telegram"
            exit 1
          fi

      - name: Verify Topic card was produced
        if: ${{ env.RUN_SCHEDULED_BOT != '0' }}
        run: |
          if ! compgen -G "out/*.png" > /dev/null; then
            echo "Topic run completed without producing a card"
            exit 1
          fi

      - name: Record confirmed Topic Telegram delivery
        if: ${{ success() && env.RUN_SCHEDULED_BOT != '0' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
        run: |
          python3 topic_delivery_guard.py record \
            --topics-used state/topics_used.json \
            --state state/topic_telegram_deliveries.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/topic_telegram_deliveries.json
          if ! git diff --cached --quiet; then
            git commit -m "state: confirm Topic Telegram delivery"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Model cost summary
        if: ${{ always() && env.RUN_SCHEDULED_BOT != '0' }}
        run: python model_usage.py summarize --path out/model_usage.jsonl >> "$GITHUB_STEP_SUMMARY"

      - name: Mark Topic slot complete
        if: ${{ success() && env.RUN_SCHEDULED_BOT != '0' && env.SCHEDULE_SLOT_ID != '' }}
        run: |
          python3 shared_schedule_gate.py mark --slot "$SCHEDULE_SLOT_ID" --state state/topic_schedule_slots.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/topic_schedule_slots.json
          git commit -m "state: complete topic slot $SCHEDULE_SLOT_ID"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Keep the card for review
        if: ${{ always() && env.RUN_SCHEDULED_BOT != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: topic-card
          path: |
            out/*.png
            out/topic_recovery_brief.json
            out/topic_run.log
            out/model_usage.jsonl
          retention-days: 7
          if-no-files-found: ignore
