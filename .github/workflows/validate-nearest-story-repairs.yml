name: Validate nearest Story repairs

on:
  push:
    paths:
      - '.github/workflows/validate-nearest-story-repairs.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nearest-story-repairs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Dry-run SAMA and Jeddah Airport
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POST_TO_SNAPCHAT: '0'
          DRY_RUN: '1'
          MEDIA_MODE: 'github'
          THEME: 'light'
          BRAND: 'ملخص تنفيذي - قصة'
          FONT_FAMILY: 'Almarai'
          STORY_MODEL: 'claude-opus-5'
          STORY_FRAMES: '6'
          STORY_ALLOW_REPEAT: '1'
          ALLOW_GENERATED: '0'
          ALLOW_STORY_GENERATION: '0'
          STORY_OPERATION_MODE: 'auto'
          STORY_SUPPRESS_TELEGRAM: '1'
          IMAGE_GEN: 'byteplus'
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ vars.ARK_MODEL }}
        run: |
          set +e
          passed=0
          failed=0
          for story in \
            'قصة تأسيس مؤسسة النقد ساما' \
            'قصة أول مطار في جدة وتطور الطيران المدني'
          do
            echo "===== VALIDATE_REPAIR: $story ====="
            STORY="$story" python guarded_story_publish.py
            rc=$?
            if [ "$rc" -eq 0 ]; then
              passed=$((passed + 1))
            else
              failed=$((failed + 1))
              echo "REPAIR_BLOCKED: $story (exit $rc)"
            fi
          done
          echo "REPAIR_RESULT passed=$passed failed=$failed"
          test "$failed" -eq 0
