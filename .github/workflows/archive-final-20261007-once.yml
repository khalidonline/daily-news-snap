name: Save approved final 7 October Stories
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-final-20261007-once.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  archive:
    if: github.event.head_commit.message == 'Run authorized final archive batch 20261007 only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 976c27c4749972d0612e6a482b6bb874f72f1167
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test existing archive protections and exact final composition
        run: |
          python -m unittest discover -s tests -p test_v2_saved_story_api.py -q
          python -m unittest discover -s approved/saved-stories/daily-20261007 -p test_batch.py -q
      - name: Save exact published files with live receipts inventory quota and budget checks
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: .
        run: python approved/saved-stories/daily-20261007/save_batch.py
