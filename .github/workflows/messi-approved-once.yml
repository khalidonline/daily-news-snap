name: Publish approved Messi package
on:
  push:
    paths: ['.github/workflows/messi-approved-once.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Run Messi owner approval 20261007-174228-checked'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9be5f741851487e3f1849636e2330ef02d50b519
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Offline publisher and readability checks
        run: |
          python -m unittest discover -s tests -p 'test_v2_bundle.py' -q
          python -m unittest discover -s tests -p 'test_v2_readability.py' -q
          python -m unittest discover -s tests -p 'test_v2_primary_images.py' -q
      - name: Validate quota ledger and publish exact approved files
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPROVED_COMMIT: 9be5f741851487e3f1849636e2330ef02d50b519
          POST_TO_SNAPCHAT: '1'
          DRY_RUN: '0'
        run: PYTHONPATH=. python approved/messi-20261007/publish-approved.py
