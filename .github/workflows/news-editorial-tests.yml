name: News editorial tests

on:
  push:
    paths:
      - "news_editorial.py"
      - "news_editorial_prompt.txt"
      - "daily_news_runner.py"
      - "tests/test_news_editorial.py"
      - "tests/test_auto_image_selector.py"
      - "tests/test_news_feed_ingestion.py"
      - "tests/test_news_scope_edges.py"
      - "tests/test_post_model_scope.py"
      - "tests/test_daily_review_workflow.py"
      - "tests/test_health_scope_live.py"
      - "tests/test_daily_source_dedupe.py"
      - "tests/test_daily_source_dedupe_clitics.py"
      - "tests/test_daily_source_dedupe_precision.py"
      - ".github/workflows/daily.yml"
      - ".github/workflows/news-editorial-tests.yml"
  pull_request:
    paths:
      - "news_editorial.py"
      - "news_editorial_prompt.txt"
      - "daily_news_runner.py"
      - "tests/test_news_editorial.py"
      - "tests/test_auto_image_selector.py"
      - "tests/test_news_feed_ingestion.py"
      - "tests/test_news_scope_edges.py"
      - "tests/test_post_model_scope.py"
      - "tests/test_daily_review_workflow.py"
      - "tests/test_health_scope_live.py"
      - "tests/test_daily_source_dedupe.py"
      - "tests/test_daily_source_dedupe_clitics.py"
      - "tests/test_daily_source_dedupe_precision.py"
      - ".github/workflows/daily.yml"
      - ".github/workflows/news-editorial-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Saudi Snapchat editorial regressions
        # Includes exact source identity, legacy headline fallback and Arabic clitics.
        run: |
          python -m unittest tests.test_news_editorial tests.test_auto_image_selector tests.test_news_feed_ingestion tests.test_news_scope_edges tests.test_post_model_scope tests.test_daily_review_workflow tests.test_health_scope_live tests.test_daily_source_dedupe tests.test_daily_source_dedupe_clitics tests.test_daily_source_dedupe_precision -v
          python -m py_compile news_editorial.py daily_news_runner.py
