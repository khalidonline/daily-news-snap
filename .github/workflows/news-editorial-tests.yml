name: News editorial tests

on:
  push:
    paths:
      - "news_editorial.py"
      - "news_editorial_prompt.txt"
      - "daily_news_runner.py"
      - "tests/test_news_editorial.py"
      - "tests/test_auto_image_selector.py"
      - ".github/workflows/daily.yml"
      - ".github/workflows/news-editorial-tests.yml"
  pull_request:
    paths:
      - "news_editorial.py"
      - "news_editorial_prompt.txt"
      - "daily_news_runner.py"
      - "tests/test_news_editorial.py"
      - "tests/test_auto_image_selector.py"
      - ".github/workflows/daily.yml"
      - ".github/workflows/news-editorial-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Saudi Snapchat editorial regressions
        run: |
          python -m unittest tests.test_news_editorial tests.test_auto_image_selector -v
          python -m py_compile news_editorial.py daily_news_runner.py
