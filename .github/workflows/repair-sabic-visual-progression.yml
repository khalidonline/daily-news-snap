name: Repair SABIC visual progression

on:
  push:
    branches:
      - fix/sabic-visual-progression

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sabic-visual-progression
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Confirm RED starting point
        run: |
          python - <<'PY'
          import story_runtime as sr
          story = "قصة سابك من فكرة إلى عملاق بتروكيماويات"
          photos, _, status = sr.coverage(story)
          print("BEFORE", status, len(photos), [p.name for p in photos])
          if len(photos) != 2:
              raise SystemExit(f"expected two visuals before repair, got {len(photos)}")
          PY
      - name: Add SABIC global expansion and leadership visuals
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/SABIC%20plastics%20plant%20and%20technical%20centre%20in%20Washington%2C%20West%20Virginia..JPG" \
            -o images/sabic-west-virginia-2014.jpg
          curl -L --fail --retry 3 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Abdulrahman%20Al%20Fageeh%20at%20WEF%20Special%20Meeting%20on%20Global%20Collaboration%2C%20Growth%20and%20Energy%20for%20Development%2C%202024.png" \
            -o images/sabic-ceo-wef-2024.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          story = "قصة سابك من فكرة إلى عملاق بتروكيماويات"
          assets = {
              "sabic-west-virginia-2014.jpg": "Snoopywv via Wikimedia Commons — CC BY-SA 3.0; SABIC plastics plant and technical centre, Washington, West Virginia, 2014",
              "sabic-ceo-wef-2024.png": "World Economic Forum via Wikimedia Commons — CC BY 3.0; SABIC CEO Abdulrahman Al-Fageeh at WEF, 2024",
          }
          index = Path("images/images.txt")
          text = index.read_text(encoding="utf-8")
          for filename, credit in assets.items():
              path = Path("images") / filename
              with Image.open(path) as im:
                  print(filename, im.size, im.format)
                  if min(im.size) < 500:
                      raise SystemExit(f"image too small: {filename} {im.size}")
              if filename not in text:
                  text += f"{filename} | {story}, سابك, SABIC, Saudi Basic Industries, بتروكيماويات | {credit}\n"
          index.write_text(text, encoding="utf-8")
          PY
      - name: Verify GREEN runtime coverage
        run: |
          python - <<'PY'
          import story_runtime as sr
          story = "قصة سابك من فكرة إلى عملاق بتروكيماويات"
          photos, logos, status = sr.coverage(story)
          names = [p.name for p in photos]
          print("AFTER", status, len(photos), names)
          required = {"sabic-west-virginia-2014.jpg", "sabic-ceo-wef-2024.png"}
          if status != "PASS" or len(photos) < 4 or not required.issubset(names):
              raise SystemExit("SABIC story did not reach PASS with four distinct visual beats")
          PY
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "story-visual-repair-bot"
          git config user.email "actions@github.com"
          git add images/images.txt images/sabic-west-virginia-2014.jpg images/sabic-ceo-wef-2024.png
          git commit -m "assets: complete SABIC visual progression"
          git push origin HEAD:fix/sabic-visual-progression
