name: Repair McDonald's Saudi visuals

on:
  push:
    branches:
      - fix/mcdonalds-saudi-visuals

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcdonalds-saudi-visuals
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Confirm RED starting point
        run: |
          python - <<'PY'
          import story_runtime as sr
          story = "قصة ماكدونالدز في السعودية وعائلات الامتياز"
          photos, _, status = sr.coverage(story)
          print("BEFORE", status, len(photos), [p.name for p in photos])
          if len(photos) != 2:
              raise SystemExit(f"expected two visuals before repair, got {len(photos)}")
          PY
      - name: Add Saudi branch expansion visuals
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mcdonalds%20Restaurant%20Riyadh.JPG" \
            -o images/mcdonalds-riyadh-2009.jpg
          curl -L --fail --retry 3 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Jubail%20083105.jpg" \
            -o images/mcdonalds-jubail.jpg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          story = "قصة ماكدونالدز في السعودية وعائلات الامتياز"
          assets = {
              "mcdonalds-riyadh-2009.jpg": "Haitham Alfalah via Wikimedia Commons — CC BY 3.0; McDonald's on King Abdullah Road, Riyadh, 2009",
              "mcdonalds-jubail.jpg": "Wikimedia Commons; McDonald's branch in Jubail, Saudi Arabia",
          }
          index = Path("images/images.txt")
          text = index.read_text(encoding="utf-8")
          for filename, credit in assets.items():
              path = Path("images") / filename
              with Image.open(path) as im:
                  print(filename, im.size, im.format)
                  if min(im.size) < 500:
                      raise SystemExit(f"image too small: {filename} {im.size}")
              if filename not in text:
                  text += f"{filename} | {story}, ماكدونالدز السعودية, McDonald's Saudi Arabia, Riyadh, Jubail, امتياز | {credit}\n"
          index.write_text(text, encoding="utf-8")
          PY
      - name: Verify GREEN runtime coverage
        run: |
          python - <<'PY'
          import story_runtime as sr
          story = "قصة ماكدونالدز في السعودية وعائلات الامتياز"
          photos, logos, status = sr.coverage(story)
          names = [p.name for p in photos]
          print("AFTER", status, len(photos), names)
          required = {"mcdonalds-riyadh-2009.jpg", "mcdonalds-jubail.jpg"}
          if status != "PASS" or len(photos) < 4 or not required.issubset(names):
              raise SystemExit("McDonald's Saudi story did not reach PASS with four Saudi branch visuals")
          PY
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "story-visual-repair-bot"
          git config user.email "actions@github.com"
          git add images/images.txt images/mcdonalds-riyadh-2009.jpg images/mcdonalds-jubail.jpg
          git commit -m "assets: complete McDonald's Saudi visual coverage"
          git push origin HEAD:fix/mcdonalds-saudi-visuals
