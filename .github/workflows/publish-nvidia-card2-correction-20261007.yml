name: Publish approved NVIDIA card 2 correction
on:
  push:
    paths:
      - '.github/workflows/publish-nvidia-card2-correction-20261007.yml'
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Run approved NVIDIA card2 correction 20261007-1321'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1b0550809c3f1b052f70ea720287a721b6069aca
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-v2-images.txt pytest
      - name: Offline safety checks
        run: |
          python -m pytest -q tests/test_v2_bundle.py tests/test_v2_publication_selection.py tests/test_v2_readability.py
          python -m py_compile approved/nvidia-card2-corrected-20261007/publish-approved.py
          python -c "import base64; from pathlib import Path; p=Path('approved/nvidia-card2-corrected-20261007/card-01.jpg'); p.write_bytes(base64.b64decode(Path(str(p)+'.b64').read_text(),validate=True))"
          python -m publishing_v2.bundle_api validate --manifest approved/nvidia-card2-corrected-20261007/manifest.json
      - name: Publish only approved replacement and verify
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVED_COMMIT: 1b0550809c3f1b052f70ea720287a721b6069aca
          PYTHONPATH: .
        run: python approved/nvidia-card2-corrected-20261007/publish-approved.py
