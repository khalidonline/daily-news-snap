name: Verify guarded Snapchat metrics
on:
  push:
    paths: ['.github/workflows/verify-metrics-quality-20261001.yml']
permissions:
  contents: read
jobs:
  collect:
    if: github.event.head_commit.message == 'Verify guarded Snapchat metrics dependencies 20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cd12581783682fc1adafb87a926de30712320b2c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing test dependencies
        run: pip install -r requirements.txt
      - name: Test metric interpretation
        run: |
          python -m unittest discover -s tests -p test_v2_metrics_quality.py
          python -m unittest discover -s tests -p test_v2_package_insights.py
      - name: Read metrics without force refresh or publication
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
        run: |
          python -m publishing_v2.metrics_quality --targets review/growth-20261001/targets.json --output /tmp/metrics.json
          cat /tmp/metrics.json
