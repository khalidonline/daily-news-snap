name: Publish owner-approved dishwasher only
on:
  push:
    branches: [codex/dishwasher-approved-20261020]
    paths: [.github/workflows/dishwasher-approved-20261020.yml]
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 73f84af2faec9ebcf8429d2346a168b5dd57dbad
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - name: Restore exact image bytes and validate offline
        run: |
          base64 --decode approved/dishwasher-20261020/card.png.b64 > approved/dishwasher-20261020/card.png
          python -m publishing_v2.bundle_api validate --manifest approved/dishwasher-20261020/manifest.json
          python -m unittest discover -s tests -p test_v2_readability.py -q
      - name: Publish and verify Snapchat receipt
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVED_COMMIT: 73f84af2faec9ebcf8429d2346a168b5dd57dbad
          PYTHONPATH: .
        run: python approved/dishwasher-20261020/publish-approved.py
