name: Save seven approved prior packages
on:
  push:
    paths:
      - .github/workflows/save-seven-profile-20261001.yml
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  save:
    if: github.repository == 'khalidonline/daily-news-snap' && github.event.head_commit.message == 'Save seven owner-approved prior packages 20261001 unique archive'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bbb56977424808097e88618f6b4e3787597a11f7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_v2_saved_story_api.py
      - name: Save seven exact reviewed packages sequentially
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          approvals=json.loads(Path('approved/archive-seven-20261001.json').read_text())
          results=[]
          for approval in approvals:
              path=Path('/tmp/archive-approval.json')
              path.write_text(json.dumps(approval,ensure_ascii=False))
              result=subprocess.run([sys.executable,'-m','publishing_v2.saved_story_api','--approval',str(path)])
              results.append({'identity':approval['identity'],'title':approval['title'],'exit_code':result.returncode})
              print(json.dumps(results[-1],ensure_ascii=False),flush=True)
          print(json.dumps(results,ensure_ascii=False),flush=True)
          sys.exit(int(any(r['exit_code'] for r in results)))
          PY
