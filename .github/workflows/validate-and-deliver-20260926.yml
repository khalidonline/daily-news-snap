name: Repair saved trial
on:
  push:
    paths: ['.github/workflows/validate-and-deliver-20260926.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  repair:
    if: github.event.head_commit.message == 'Validate saved local and deliver reviewed Daily'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1264d0da881cd83d6f68b01b3d22ee2d09454d05
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Restore exact saved production files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36114785468 --repo khalidonline/daily-news-snap --name agentic-packages-36114785468-1 --dir local-saved
      - name: Repair only saved package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_BUDGET_GITHUB_TOKEN: ${{ secrets.DAILY_BUDGET_GITHUB_TOKEN || github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          AUTOPILOT_DAILY_LIMIT_MICRO_USD: '3000000'
          AUTOPILOT_EDITOR_MODEL: claude-sonnet-5
          AUTOPILOT_RESEARCHER_MODEL: claude-opus-5
          AUTOPILOT_WRITER_MODEL: claude-opus-5
          AUTOPILOT_VISUAL_MODEL: claude-sonnet-5
          AUTOPILOT_REVIEWER_MODEL: claude-sonnet-5
        run: python validate_saved_local_20260926.py
      - name: Restore reviewed Daily files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36230061018 --repo khalidonline/daily-news-snap --name repaired-saved-trial --dir repair-output
      - name: Deliver saved Daily only after readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_BUDGET_GITHUB_TOKEN: ${{ secrets.DAILY_BUDGET_GITHUB_TOKEN || github.token }}
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          AUTOPILOT_EDITOR_MODEL: claude-sonnet-5
          AUTOPILOT_RESEARCHER_MODEL: claude-opus-5
          AUTOPILOT_WRITER_MODEL: claude-opus-5
          AUTOPILOT_VISUAL_MODEL: claude-sonnet-5
          AUTOPILOT_REVIEWER_MODEL: claude-sonnet-5
          AUTOPILOT_DAILY_LIMIT_MICRO_USD: '3000000'
          POST_TO_SNAPCHAT: '1'
          DRY_RUN: '0'
        run: |
          python - <<'PY'
          import sys
          from datetime import datetime,timezone
          from publishing_v2.bundle_api import GitHubJournal,BundleClient
          from publishing_v2.autopilot.runtime import rollout_ready,engine_id,main
          if not rollout_ready(GitHubJournal('autopilot-readiness').read(),engine_id(),datetime.now(timezone.utc)):
              raise RuntimeError('readiness_blocked_no_fallback')
          BundleClient().ensure_capacity(4)
          sys.argv=['saved-delivery','--mode','live','--lane','daily','--output','delivery-output']
          raise SystemExit(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-saved-trial
          path: |
            repair-output/
            validation-output/
            delivery-output/
          include-hidden-files: true
