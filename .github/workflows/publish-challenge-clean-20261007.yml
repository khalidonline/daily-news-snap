name: Publish corrected football challenge
on:
  push:
    paths:
      - '.github/workflows/publish-challenge-clean-20261007.yml'
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Run approved challenge strip removal 20261007-0959'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4778407d46f7ae50c3bb6fde894476b9e4e342f5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-v2-images.txt pytest
      - name: Offline guard tests
        run: python -m pytest -q tests/test_v2_bundle.py tests/test_v2_bundle_group.py tests/test_v2_readability.py tests/test_v2_primary_images.py tests/test_v2_publication_selection.py
      - name: Publish exact corrected card and reconcile
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVED_COMMIT: 4778407d46f7ae50c3bb6fde894476b9e4e342f5
          PYTHONPATH: .
        run: python approved/gulf-challenge-clean-20261007/publish-approved.py
