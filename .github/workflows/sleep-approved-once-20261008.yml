name: Publish approved sleep competition
on:
  push:
    paths:
      - '.github/workflows/sleep-approved-once-20261008.yml'
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Run approved sleep v4 20261008 only'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 430daa3de314203fe3df00b1c2489b15add17db5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Test publication safeguards
        run: |
          python -m unittest discover -s tests -p 'test_v2_bundle.py'
          python -m unittest discover -s tests -p 'test_v2_readability.py'
          python -m unittest discover -s tests -p 'test_v2_primary_images.py'
      - name: Verify quota and publish reviewed bytes
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVED_COMMIT: 430daa3de314203fe3df00b1c2489b15add17db5
          PYTHONPATH: .
        run: python approved/sleep-competition-20261008/publish-approved.py
