name: Approved Story sequential delivery test

on:
  push:
    branches: [fix/story-telegram-complete-fallback]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_approved_story_sequential_delivery.py
