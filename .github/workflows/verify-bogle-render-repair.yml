name: Verify Bogle rendered visual repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-bogle-render-repair.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Keep contextual Bogle photos available to non-person frames
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("images/images.txt")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "bogle-vanguard-1959.jpg": "Vanguard, The Vanguard Group",
              "bogle-vanguard-1989.jpg": "Vanguard, The Vanguard Group",
              "bogle-vanguard-founder.jpg": "Vanguard, The Vanguard Group",
          }
          lines = []
          changed = set()
          for line in text.splitlines():
              name = line.split("|", 1)[0].strip() if "|" in line else ""
              if name in replacements:
                  parts = [part.strip() for part in line.split("|")]
                  if len(parts) < 3:
                      raise SystemExit(f"malformed image index row: {line}")
                  line = f"{parts[0]} | {replacements[name]} | {parts[2]}"
                  changed.add(name)
              lines.append(line)
          missing = set(replacements) - changed
          if missing:
              raise SystemExit(f"missing reviewed Bogle rows: {sorted(missing)}")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Prove source coverage remains PASS
        run: |
          PYTHONPATH=. python - <<'PY'
          import story_runtime as sr
          story = "Jack Bogle: أنشأ صندوق المؤشرات ورفض أن يصبح ملياردير"
          photos, logos, status = sr.coverage(story)
          print("source photos:", [p.name for p in photos])
          print("source logos:", [p.name for p in logos])
          print("source status:", status)
          if len(photos) < 4 or not logos or status != "PASS":
              raise SystemExit("Bogle source coverage is not 4 photos + logo PASS")
          PY

      - name: Dry-render Jack Bogle with no Telegram or Snapchat
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STORY: "Jack Bogle: أنشأ صندوق المؤشرات ورفض أن يصبح ملياردير"
          DRY_RUN: "1"
          POST_TO_SNAPCHAT: "0"
          STORY_ALLOW_REPEAT: "1"
          STORY_FRAMES: "6"
          THEME: "light"
          BRAND: "ملخص تنفيذي - قصة"
          FONT_FAMILY: "Almarai"
          STORY_MODEL: "claude-opus-5"
          ALLOW_GENERATED: "0"
          ALLOW_STORY_GENERATION: "0"
        run: python story_runtime.py

      - name: Inspect the actual rendered deck
        run: |
          python - <<'PY'
          from pathlib import Path
          from review_visual_gate import require_photo_coverage

          frames = sorted(str(p) for p in Path("out").glob("*-story-*.png"))
          print("rendered frames:", frames)
          if len(frames) != 6:
              raise SystemExit(f"expected 6 rendered frames, got {len(frames)}")
          count = require_photo_coverage(frames, minimum=4)
          print(f"rendered photographic coverage: {count}/6")
          PY

      - name: Commit metadata fix only after rendered proof passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/images.txt
          if git diff --cached --quiet; then
            echo "Bogle contextual tags already repaired"
          else
            git commit -m "assets: keep Bogle context photos available across frames"
            git push origin HEAD:main
          fi
