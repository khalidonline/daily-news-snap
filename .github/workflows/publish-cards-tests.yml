name: Publish cards tests

on:
  push:
    paths:
      - "publish_cards.py"
      - "safe_publish_cards.py"
      - "review_visual_gate.py"
      - "tests/test_publish_cards.py"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-cards-tests.yml"
  pull_request:
    paths:
      - "publish_cards.py"
      - "safe_publish_cards.py"
      - "review_visual_gate.py"
      - "tests/test_publish_cards.py"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-cards-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video verification dependencies
        run: pip install Pillow imageio-ffmpeg
      - name: Run publish-card regression tests
        run: python tests/test_publish_cards.py
