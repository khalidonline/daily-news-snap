name: Story approval binding regression

on:
  push:
    branches: [fix/story-approval-artifact-binding]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: pytest -q tests/test_story_approval_artifact_binding.py
