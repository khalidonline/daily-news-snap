name: New York finance near-pass visual repair

on:
  push:
    branches:
      - repair/all-story-visuals-2026-08-29
    paths:
      - ".github/new-york-finance-near-pass-trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/all-story-visuals-2026-08-29
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch reviewed NYSE facade photo and logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/logos
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          UA='daily-news-snap/1.0 (https://github.com/khalidonline/daily-news-snap; story visual repair)'
          def commons(title,destination,width=1600):
              params=urlencode({'action':'query','format':'json','prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':width,'titles':'File:'+title})
              req=Request('https://commons.wikimedia.org/w/api.php?'+params,headers={'User-Agent':UA})
              with urlopen(req,timeout=25) as r: payload=json.load(r)
              page=next(iter(payload['query']['pages'].values()))
              if 'missing' in page or not page.get('imageinfo'): raise SystemExit(f'missing Commons file: {title}')
              info=page['imageinfo'][0]; url=info.get('thumburl') or info['url']
              with urlopen(Request(url,headers={'User-Agent':UA}),timeout=30) as r: Path(destination).write_bytes(r.read())
              print(f'fetched {title} -> {destination}')
          commons('Wall St May 2025 28.jpg','images/targeted-nyse-facade-2025.jpg')
          commons('NYSE Logo 2022.svg','images/logos/nyse.com-current.png',1280)
          PY

      - name: Validate photo and normalize logo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from image_precheck import dhash, DHASH_MAX_DISTANCE
          new=Path('images/targeted-nyse-facade-2025.jpg')
          with Image.open(new) as im: im.verify()
          with Image.open(new) as im:
              if im.width<600 or im.height<400: raise SystemExit(f'candidate too small: {im.size}')
              print(f'candidate verified: {im.size}')
          nh=dhash(new)
          if nh is None: raise SystemExit('could not fingerprint candidate')
          for old in Path('images').glob('*'):
              if old==new or not old.is_file() or old.suffix.lower() not in {'.jpg','.jpeg','.png','.webp'}: continue
              oh=dhash(old)
              if oh is None: continue
              d=(nh^oh).bit_count()
              if d<=DHASH_MAX_DISTANCE: raise SystemExit(f'candidate duplicates {old} distance={d}')
          print('distinctness gate PASS')

          p=Path('images/logos/nyse.com-current.png')
          with Image.open(p) as src: rgba=src.convert('RGBA')
          corners=[rgba.getpixel((0,0)),rgba.getpixel((rgba.width-1,0)),rgba.getpixel((0,rgba.height-1)),rgba.getpixel((rgba.width-1,rgba.height-1))]
          if all(a>220 and r>240 and g>240 and b>240 for r,g,b,a in corners):
              data=[]
              for r,g,b,a in rgba.getdata(): data.append((r,g,b,0 if r>245 and g>245 and b>245 else a))
              rgba.putdata(data)
          bbox=rgba.getchannel('A').getbbox()
          if not bbox: raise SystemExit('NYSE logo became empty')
          rgba=rgba.crop(bbox); pad=max(16,int(max(rgba.size)*0.05))
          canvas=Image.new('RGBA',(rgba.width+2*pad,rgba.height+2*pad),(255,255,255,0)); canvas.alpha_composite(rgba,(pad,pad)); canvas.save(p)
          if canvas.width<250 or canvas.height<80: raise SystemExit(f'NYSE logo too small: {canvas.size}')
          print(f'clean logo normalized: {canvas.size}')
          PY

      - name: Register and verify New York finance story
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          story='قصة نيويورك: كيف صارت عاصمة المال؟'
          manifest=Path('images/images.txt'); text=manifest.read_text(encoding='utf-8').rstrip()
          line='targeted-nyse-facade-2025.jpg | New York, نيويورك, NYSE, Wall Street, بورصة نيويورك | Epicgenius / CC BY-SA 4.0 — Wikimedia Commons'
          if line not in text: text+='\n'+line
          manifest.write_text(text+'\n',encoding='utf-8')
          rp=Path('images/relevance.json'); rel=json.loads(rp.read_text(encoding='utf-8'))
          rel.setdefault('assets',{})['targeted-nyse-facade-2025.jpg']={'stories':{story:'DIRECT'},'source_url':'https://commons.wikimedia.org/wiki/File:Wall_St_May_2025_28.jpg','note':'NYSE facade on Wall Street; direct finance-context photo for New York capital-of-finance story.'}
          rp.write_text(json.dumps(rel,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          ip=Path('images/logos/index.json'); idx=json.loads(ip.read_text(encoding='utf-8'))
          idx['nyse.com']=['NYSE','New York Stock Exchange','بورصة نيويورك','Wall Street','New York','نيويورك','nyse.com']
          ip.write_text(json.dumps(idx,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          sp=Path('stories.txt'); s=sp.read_text(encoding='utf-8'); old='قصة نيويورك: كيف صارت عاصمة المال؟ | New York, نيويورك'; new='قصة نيويورك: كيف صارت عاصمة المال؟ | New York, نيويورك | entity: NYSE, New York Stock Exchange, Wall Street | logo:nyse.com'
          if old not in s: raise SystemExit('expected New York story line missing')
          sp.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git fetch origin repair/story-visual-coverage
          rm -rf /tmp/ny-board-engine && mkdir -p /tmp/ny-board-engine
          git archive origin/repair/story-visual-coverage | tar -x -C /tmp/ny-board-engine
          PYTHONPATH=/tmp/ny-board-engine python - <<'PY'
          import sys
          sys.path.insert(0,'/tmp/ny-board-engine')
          from tools.bulk_visual_board import build_board
          row=build_board(['قصة نيويورك: كيف صارت عاصمة المال؟'])[0]
          print(f'{row.story}: {row.status} photos={len(row.photos)} logos={len(row.logos)}')
          if row.status!='PASS' or len(row.photos)<4 or len(row.logos)<1: raise SystemExit('New York finance story failed authoritative coverage')
          PY

      - name: Commit accepted repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name story-visual-repair-bot
          git config user.email actions@github.com
          git add images/targeted-nyse-facade-2025.jpg images/logos/nyse.com-current.png images/images.txt images/relevance.json images/logos/index.json stories.txt
          git commit -m "repair: close New York finance near-pass gap"
          git pull --rebase origin repair/all-story-visuals-2026-08-29
          git push origin HEAD:repair/all-story-visuals-2026-08-29
