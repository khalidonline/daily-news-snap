name: Send approved Hormuz deck to Telegram

on:
  push:
    branches:
      - repair/all-story-visuals-2026-08-29
    paths:
      - "2026-09-06-hormuz-final-v4-story-*.png"
      - "render_approved_hormuz_frame4.py"
      - "send_approved_story.py"
      - ".github/workflows/send-approved-hormuz-telegram.yml"

permissions:
  contents: read

concurrency:
  group: approved-hormuz-telegram-2026-09-06
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild approved frame 4
        run: python render_approved_hormuz_frame4.py
      - name: Freeze and verify exact six-frame deck
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import ready_story_publish as rsp
          frames = [Path(f"2026-09-06-hormuz-final-v4-story-{i:02d}.png") for i in range(1, 7)]
          manifest = rsp.build_review_manifest(
              "مضيق هرمز: من مشترياتك إلى الموانئ العالمية",
              "2026-09-06-hormuz-final-v5",
              "READY",
              frames,
          )
          Path("story-review.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          rsp.verify_review_manifest(manifest, Path("."))
          print("Exact six-frame Hormuz deck verified:", manifest["deck_hash"])
          PY
      - name: Send exact approved deck to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_TO_SNAPCHAT: "0"
          DRY_RUN: "0"
        run: python send_approved_story.py story-review.json
