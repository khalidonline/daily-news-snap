name: Check three approved packages quota
on:
  push:
    paths: ['.github/workflows/check-three-20261002.yml']
permissions:
  contents: read
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  check:
    if: github.event.head_commit.message == 'Check quota for three approved packages 20261002'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f63342822fb3c2d8f4d3de1903c4a9e7bd66905a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read actual account quota only
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
        run: |
          python - <<'PY'
          import json
          from publishing_v2.bundle_api import BundleClient
          c=BundleClient()
          c.check()
          result=c.ensure_capacity(12)
          print(json.dumps({'verified_account':'executivesaudi','posts':result['posts'],'date':result['date']}))
          PY
