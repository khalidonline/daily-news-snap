name: Story publishability tests

on:
  push:
    branches: [fix/global-story-publishability]
  pull_request:
    paths:
      - 'story_runtime.py'
      - 'story_visual_state.py'
      - 'ready_story_publish.py'
      - 'tests/test_story_publishability.py'
      - '.github/workflows/story-publishability-ci.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_story_publishability
