name: Story publishability tests

on:
  push:
    branches: [fix/global-story-publishability, fix/nearest-story-repairs]
  pull_request:
    paths:
      - 'story_publishability.py'
      - 'story_runtime.py'
      - 'story_visual_state.py'
      - 'ready_story_publish.py'
      - 'guarded_story_publish.py'
      - 'tests/test_story_publishability.py'
      - 'tests/test_story_publishability_state_order.py'
      - 'tests/test_nearest_story_repairs.py'
      - '.github/workflows/story-publishability-ci.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: >-
          python -m unittest
          tests.test_story_publishability
          tests.test_story_publishability_state_order
          tests.test_nearest_story_repairs
