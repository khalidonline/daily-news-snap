/cropped to established card template","provider":"primary_media","source_kind":"official","asset_id":"primary:61fb2a36a45ac7c8bcbf64ac","website_entity":"Q2241604","official_site":"https://www.pandoragroup.com/","owner_use_decision":"owner-source-editorial-use-2026-09-22","rights_status":"owner_accepted_editorial_use","license":"All rights reserved","licensing_verified":false}]}}]
