          cat > haiku_probe.py <<'PY_EOF'
          import json, os, time, math, urllib.request, urllib.error
          from pathlib import Path
          from daily_budget import Ledger, GitHubStore
          
          MODEL = 'claude-haiku-5-5'
          CAP = 50000  # micro-USD, part of the shared $3 ceiling
          MAX_OUTPUT = 2000
          RULES = '''اختبار تحرير فقط، بلا بحث وبلا نشر. الحقائق المسموحة هي reference حصرا، وهي نسخة أرشيفية ثابتة وليست خبرا لليوم. روابط sources للتوثيق ولا تفترض أنك فتحتها. راجع draft لاكتشاف تكرار المعنى بين العنوان والمتن والخاتمة وبسطها بلهجة سعودية طبيعية بدون تنوين أو إضافة معلومة أو سبب أو تاريخ أو مبالغة. حافظ على التحفظات ونسب الكلام للشركة والمصادر. لا تكرر العنوان في المقدمة. لا تفرض خاتمة إذا ما تضيف شيء؛ يمكن تركها فارغة. لا تختصر لدرجة ضياع المعنى. أعد JSON فقط بالمفاتيح duplicate_found:boolean, issues:list[str], revised:{title:str,body:str,closing:str}.'''
          
          def prompt(case):
              data = {k:case[k] for k in ('draft','reference','sources')}
              return RULES + '\n' + json.dumps(data,ensure_ascii=False)
          
          def maximum(p):
              n = len(p.encode()) + 8192
              if n > 50000:
                  raise ValueError('input_bound_exceeded')
              return math.ceil(n * .10 + MAX_OUTPUT * .50)
          
          def cost(body):
              u = body['usage']
              assert all(type(u[k]) is int and u[k]>=0 for k in ('input_tokens','output_tokens'))
              assert not u.get('cache_creation_input_tokens',0) and not u.get('cache_read_input_tokens',0)
              assert not u.get('server_tool_use')
              assert u['input_tokens'] <= 100000
              return math.ceil(u['input_tokens']*.10 + u['output_tokens']*.50)
          
          def run():
              cases=json.loads(Path('cases.json').read_text())
              assert len(cases)==10 and len({c['id'] for c in cases})==10
              prompts=[prompt(c) for c in cases]
              bounds=[maximum(p) for p in prompts]
              assert sum(bounds)<=CAP
              result={'model':MODEL,'source_commit':os.environ['SOURCE_COMMIT'],'scope':'archived-copy fidelity and Saudi editing; not live fact verification','price_usd_per_million':{'input':.1,'output':.5},'cap_usd':CAP/1e6,'rows':[]}
              key=os.environ.get('ANTHROPIC_API_KEY','').strip()
              if not key:
                  result['status']='missing_anthropic_credentials'
              else:
                  ledger=Ledger(GitHubStore(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN']))
                  # One reservation covers all calls; any ambiguous result keeps its bound.
                  token=ledger.reserve(sum(bounds),'manual:haiku-55-editing-20261009')
                  charged=0
                  for case,p,bound in zip(cases,prompts,bounds):
                      row={'id':case['id'],'reference':case['reference'],'draft':case['draft'],'expected_duplicate':case['expected_duplicate'],'attempts':1}
                      payload={'model':MODEL,'max_tokens':MAX_OUTPUT,'messages':[{'role':'user','content':p}]}
                      req=urllib.request.Request('https://api.anthropic.com/v1/messages',data=json.dumps(payload).encode(),headers={'x-api-key':key,'anthropic-version':'2023-06-01','Content-Type':'application/json'})
                      started=time.monotonic()
                      known=False
                      try:
                          with urllib.request.urlopen(req,timeout=90) as response:
                              body=json.loads(response.read(2*1024*1024))
                          amount=cost(body)
                          assert amount<=bound
                          charged+=amount
                          known=True
                          row.update(usage=body['usage'],cost_usd=amount/1e6,response_id=body.get('id'),returned_model=body.get('model'),stop_reason=body.get('stop_reason'))
                          raw=''.join(x.get('text','') for x in body['content'] if x.get('type')=='text').strip()
                          row['raw']=raw
                          parsed=raw
                          if parsed.startswith('```'):
                              parsed=parsed.split('\n',1)[1].rsplit('```',1)[0].strip()
                          obj=json.loads(parsed)
                          assert body.get('stop_reason')=='end_turn'
                          assert type(obj['duplicate_found']) is bool
                          assert isinstance(obj['issues'],list)
                          assert all(isinstance(obj['revised'][k],str) for k in ('title','body','closing'))
                          row.update(status='completed',output=obj)
                      except Exception as exc:
                          if not known:
                              charged+=bound
                          row.update(status='failed',error=type(exc).__name__,http_status=getattr(exc,'code',None),reserved_unknown_usd=0 if known else bound/1e6)
                      row['elapsed_ms']=round((time.monotonic()-started)*1000)
                      result['rows'].append(row)
                      Path('haiku-results.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
                      if row['status']!='completed':
                          break  # no blind retries or repeated paid failures
                  ledger.settle(token,charged)
                  result.update(status='completed' if len(result['rows'])==10 and all(r['status']=='completed' for r in result['rows']) else 'blocked',accounted_usd=charged/1e6)
              Path('haiku-results.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
              print('HAIKU_RESULT_BEGIN')
              print(json.dumps(result,ensure_ascii=False))
              print('HAIKU_RESULT_END')
          
          if __name__=='__main__':
              run()
          
          PY_EOF
          python -m py_compile haiku_probe.py
      - name: Run approved budget-guarded probe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: 9a660338d70847c02b4b9367b4e90f35bdfa85be
        run: python haiku_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haiku-probe-20261009
          path: |
            cases.json
            haiku_probe.py
            haiku-results.json
          retention-days: 30
