name: Story cost-control tests

on:
  push:
    paths:
      - "story_brief_store.py"
      - "story_editorial_quality.py"
      - "story_cost_guard.py"
      - "story_editorial_runtime.py"
      - "story_visual_state.py"
      - "story_notification_state.py"
      - "story_cost_report.py"
      - "story_cost_pilot.py"
      - "story_runtime.py"
      - "story_bot.py"
      - "story_focus.py"
      - "ready_story_publish.py"
      - "publication_ready_pool.py"
      - "tests/test_story_brief_store.py"
      - "tests/test_story_editorial_quality.py"
      - "tests/test_story_cost_guard.py"
      - "tests/test_story_editorial_runtime.py"
      - "tests/test_story_workflow_choice.py"
      - "tests/test_three_story_cost_pilot_workflow.py"
      - "tests/test_story_visual_state.py"
      - "tests/test_story_notification_state.py"
      - "tests/test_story_cost_report.py"
      - "tests/test_ready_story_publish.py"
      - "tests/test_ready_story_publish_readiness_gate.py"
      - ".github/workflows/story.yml"
      - ".github/workflows/ready-story-pool.yml"
      - ".github/workflows/targeted-near-pass-repair.yml"
      - ".github/workflows/story-cost-control-tests.yml"
      - ".github/workflows/three-story-cost-pilot.yml"
  pull_request:
    paths:
      - "story_brief_store.py"
      - "story_editorial_quality.py"
      - "story_cost_guard.py"
      - "story_editorial_runtime.py"
      - "story_visual_state.py"
      - "story_notification_state.py"
      - "story_cost_report.py"
      - "story_cost_pilot.py"
      - "story_runtime.py"
      - "story_bot.py"
      - "story_focus.py"
      - "ready_story_publish.py"
      - "publication_ready_pool.py"
      - "tests/test_story_brief_store.py"
      - "tests/test_story_editorial_quality.py"
      - "tests/test_story_cost_guard.py"
      - "tests/test_story_editorial_runtime.py"
      - "tests/test_story_workflow_choice.py"
      - "tests/test_three_story_cost_pilot_workflow.py"
      - "tests/test_story_visual_state.py"
      - "tests/test_story_notification_state.py"
      - "tests/test_story_cost_report.py"
      - "tests/test_ready_story_publish.py"
      - "tests/test_ready_story_publish_readiness_gate.py"
      - ".github/workflows/story.yml"
      - ".github/workflows/ready-story-pool.yml"
      - ".github/workflows/targeted-near-pass-repair.yml"
      - ".github/workflows/story-cost-control-tests.yml"
      - ".github/workflows/three-story-cost-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Story brief store
        run: python -m unittest -v tests/test_story_brief_store.py
      - name: Editorial quality gate
        run: python -m unittest -v tests/test_story_editorial_quality.py
      - name: Editorial spend guard
        run: python -m unittest -v tests/test_story_cost_guard.py
      - name: Cached editorial runtime
        run: python -m unittest -v tests/test_story_editorial_runtime.py
      - name: Story operation modes
        run: python -m unittest -v tests/test_story_workflow_choice.py
      - name: Bounded three-story cost pilot workflow
        run: python -m unittest -v tests/test_three_story_cost_pilot_workflow.py
      - name: Frame-only visual state
        run: python -m unittest -v tests/test_story_visual_state.py
      - name: Final notification dedupe
        run: python -m unittest -v tests/test_story_notification_state.py
      - name: Publisher persistence and final-only notification
        run: POST_TO_SNAPCHAT=0 python -m unittest -v tests/test_ready_story_publish.py tests/test_ready_story_publish_readiness_gate.py
      - name: Local story cost report
        run: python -m unittest -v tests/test_story_cost_report.py
