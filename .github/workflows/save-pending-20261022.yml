name: Save four pending approved Stories
on:
  push:
    branches: [codex/save-pending-20261022]
    paths: ['.github/workflows/save-pending-20261022.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  save:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Save owner approved pending Stories 20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9e4d052c4adb7e0cd8fbe9228df4383d4ed0714e
      - name: Restore exact original approved packages
        run: |
          git fetch --depth=1 origin 5d647067c5f4135771ad7e024c22440a0e60335c
          git restore --source=5d647067c5f4135771ad7e024c22440a0e60335c -- approved/amal-return-20261022
          git fetch --depth=1 origin 73f84af2faec9ebcf8429d2346a168b5dd57dbad
          git restore --source=73f84af2faec9ebcf8429d2346a168b5dd57dbad -- approved/dishwasher-20261020
          git fetch --depth=1 origin 167b0ca18d7456cebe2492f5c0a2d37089675a78
          git restore --source=167b0ca18d7456cebe2492f5c0a2d37089675a78 -- approved/toblerone-20261019
          git fetch --depth=1 origin 7924dd558b9df19c0463ddc83c1c82423e774362
          git restore --source=7924dd558b9df19c0463ddc83c1c82423e774362 -- approved/mental-health-20261010
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Verify guarded Saved Story path
        run: |
          python -m unittest discover -s tests -p test_v2_saved_story_api.py -q
          python -m py_compile approved/saved-stories/catchup-20261022/save_batch.py
      - name: Save original posted media only with live checks
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: python approved/saved-stories/catchup-20261022/save_batch.py
