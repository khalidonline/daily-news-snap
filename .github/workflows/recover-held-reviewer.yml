name: Recover budget-blocked reviewer
on:
  push:
    branches: [main]
    paths:
      - 'review-recovery-trigger.txt'
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'khalidonline/daily-news-snap'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: python -m pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Resume final reviewer only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_BUDGET_GITHUB_TOKEN: ${{ secrets.DAILY_BUDGET_GITHUB_TOKEN || github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTOPILOT_DAILY_LIMIT_MICRO_USD: '3000000'
          AUTOPILOT_REVIEWER_MODEL: 'claude-sonnet-5'
          RECOVERY_SLOT: ${{ vars.REVIEW_RECOVERY_SLOT || 'autopilot-2026-09-24-local-shadow-f8519ad8abf12116' }}
        run: python recover_held_reviewer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: held-review-recovery-${{ github.run_id }}
          path: review-recovery-output/
          retention-days: 14
