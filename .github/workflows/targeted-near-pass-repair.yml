name: Targeted near-pass visual repair

on:
  push:
    branches:
      - repair/all-story-visuals-2026-08-29
    paths:
      - ".github/targeted-near-pass-trigger"

permissions:
  contents: write

concurrency:
  group: targeted-near-pass-visual-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/all-story-visuals-2026-08-29
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Load reviewed asset installer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin repair/story-visual-coverage
          git show origin/repair/story-visual-coverage:tools/apply_repair_assets.py > /tmp/apply_repair_assets.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/apply_repair_assets.py')
          text = p.read_text(encoding='utf-8').replace(
              'UA = "Mozilla/5.0 (compatible; story-visual-repair/1.0)"',
              'UA = "daily-news-snap/1.0 (https://github.com/khalidonline/daily-news-snap; story visual repair)"')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Apply reviewed near-pass photos
        run: PYTHONPATH=. python /tmp/apply_repair_assets.py

      - name: Synchronize reviewed index metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('repair_assets.json').read_text(encoding='utf-8'))
          index = Path('images/images.txt')
          lines = index.read_text(encoding='utf-8').splitlines() if index.exists() else []
          specs = {a['filename']: a for a in manifest.get('assets', [])}
          seen, out = set(), []
          for line in lines:
              filename = line.split('|', 1)[0].strip() if '|' in line else ''
              spec = specs.get(filename)
              if spec:
                  out.append(f"{filename} | {', '.join(spec['tags'])} | {spec['credit']}")
                  seen.add(filename)
              else:
                  out.append(line)
          for filename, spec in specs.items():
              if filename not in seen:
                  out.append(f"{filename} | {', '.join(spec['tags'])} | {spec['credit']}")
          index.write_text('\n'.join(out) + ('\n' if out else ''), encoding='utf-8')
          PY

      - name: Inspect targeted stories before commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/story-repair-engine && mkdir -p /tmp/story-repair-engine
          git archive origin/repair/story-visual-coverage | tar -x -C /tmp/story-repair-engine
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, '/tmp/story-repair-engine')
          from tools.bulk_visual_board import build_board
          stories = list(dict.fromkeys(a['story'] for a in json.loads(Path('repair_assets.json').read_text(encoding='utf-8')).get('assets', [])))
          for row in build_board(stories):
              print(f"{row.story}: {row.status}; photos={list(row.photos)}; logos={list(row.logos)}")
          PY

      - name: Commit accepted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "story-visual-repair-bot"
          git config user.email "actions@github.com"
          git add images/images.txt images/relevance.json images/targeted-* repair_assets.json
          if ! git diff --cached --quiet; then
            git commit -m "repair: close next near-pass photo gaps"
            git pull --rebase origin repair/all-story-visuals-2026-08-29
            git push origin HEAD:repair/all-story-visuals-2026-08-29
          fi

      - name: Final strict targeted gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, '/tmp/story-repair-engine')
          from tools.bulk_visual_board import build_board
          stories = list(dict.fromkeys(a['story'] for a in json.loads(Path('repair_assets.json').read_text(encoding='utf-8')).get('assets', [])))
          rows = build_board(stories)
          for row in rows:
              print(f"FINAL {row.story}: {row.status}; photos={list(row.photos)}; logos={list(row.logos)}")
          if any(row.status != 'PASS' for row in rows):
              raise SystemExit("one or more targeted stories still fail the strict visual gate")
          PY

      - name: Refresh evidence-backed READY_TO_POST state
        env:
          POST_TO_SNAPCHAT: "0"
          DRY_RUN: "1"
        shell: bash
        run: |
          set -euo pipefail
          python publication_ready_pool.py
          git config user.name "story-visual-repair-bot"
          git config user.email "actions@github.com"
          git add state/ready_to_post.json
          if ! git diff --cached --quiet; then
            git commit -m "state: refresh evidence-backed READY pool"
            git pull --rebase origin repair/all-story-visuals-2026-08-29
            git push origin HEAD:repair/all-story-visuals-2026-08-29
          fi
