name: Targeted near-pass visual repair

on:
  push:
    branches:
      - repair/all-story-visuals-2026-08-29
    paths:
      - ".github/targeted-near-pass-trigger"

permissions:
  contents: write

concurrency:
  group: targeted-near-pass-visual-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/all-story-visuals-2026-08-29
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Load reviewed asset installer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin repair/story-visual-coverage
          git show origin/repair/story-visual-coverage:tools/apply_repair_assets.py > /tmp/apply_repair_assets.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/apply_repair_assets.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'UA = "Mozilla/5.0 (compatible; story-visual-repair/1.0)"',
              'UA = "daily-news-snap/1.0 (https://github.com/khalidonline/daily-news-snap; story visual repair)"',
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Apply reviewed near-pass photos
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python /tmp/apply_repair_assets.py

      - name: Inspect targeted stories before commit
        env:
          PYTHONPATH: /tmp/story-repair-engine
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/story-repair-engine
          mkdir -p /tmp/story-repair-engine
          git archive origin/repair/story-visual-coverage | tar -x -C /tmp/story-repair-engine
          python - <<'PY'
          import sys
          sys.path.insert(0, '/tmp/story-repair-engine')
          from tools.bulk_visual_board import build_board
          stories = [
              "قصة أزمة 2008: كيف بدأت وكيف انتهت؟",
              "قصة صالح كامل ودلة البركة",
              "قصة Publix: سلسلة متاجر يملكها موظفوها بالكامل",
          ]
          for row in build_board(stories):
              print(f"{row.story}: {row.status}")
          PY

      - name: Commit accepted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "story-visual-repair-bot"
          git config user.email "actions@github.com"
          git add images/images.txt images/relevance.json images/targeted-*.jpg repair_assets.json
          if git diff --cached --quiet; then
            echo "No accepted asset changes."
          else
            git commit -m "repair: close next near-pass photo gaps"
            git pull --rebase origin repair/all-story-visuals-2026-08-29
            git push origin HEAD:repair/all-story-visuals-2026-08-29
          fi

      - name: Final strict targeted gate
        env:
          PYTHONPATH: /tmp/story-repair-engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          sys.path.insert(0, '/tmp/story-repair-engine')
          from tools.bulk_visual_board import build_board
          stories = [
              "قصة أزمة 2008: كيف بدأت وكيف انتهت؟",
              "قصة صالح كامل ودلة البركة",
              "قصة Publix: سلسلة متاجر يملكها موظفوها بالكامل",
          ]
          rows = build_board(stories)
          for row in rows:
              print(f"FINAL {row.story}: {row.status}")
          if any(row.need_photos for row in rows):
              raise SystemExit("one or more targeted stories still need a photo")
          PY
