name: Publish approved NEOM card
on:
  push:
    paths: ['.github/workflows/neom-owner-20261005.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'khalidonline/daily-news-snap' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Deliver approved NEOM after exact source validation 20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 594cb799955463960761e9630e855ea3090ed59c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-v2-images.txt pytest
      - run: python -m pytest -q tests/test_v2_bundle.py
      - name: Publish fixed JPG and verify live receipt
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVED_COMMIT: 594cb799955463960761e9630e855ea3090ed59c
          PYTHONPATH: .
        run: python approved/neom-20261005/publish-approved.py
