name: Port reviewed Bogle assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/port-reviewed-bogle-assets.yml"

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Copy only the reviewed Bogle binaries from repair branch
        run: |
          git fetch --depth=1 origin repair/story-visual-coverage
          git checkout FETCH_HEAD -- \
            images/bogle-vanguard-1959.jpg \
            images/bogle-vanguard-1989.jpg \
            images/bogle-vanguard-founder.jpg

      - name: Register the reviewed assets without importing repair-branch state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          story = "Jack Bogle: أنشأ صندوق المؤشرات ورفض أن يصبح ملياردير"
          rows = {
              "bogle-vanguard-1959.jpg": (
                  "bogle-vanguard-1959.jpg | Jack Bogle, Vanguard, The Vanguard Group | "
                  "Vanguard — official history page, Jack Bogle with colleagues (1959)"
              ),
              "bogle-vanguard-1989.jpg": (
                  "bogle-vanguard-1989.jpg | Jack Bogle, Vanguard, The Vanguard Group | "
                  "Vanguard — 50 years of indexing, John C. Bogle pictured in 1989"
              ),
              "bogle-vanguard-founder.jpg": (
                  "bogle-vanguard-founder.jpg | Jack Bogle, Vanguard, The Vanguard Group | "
                  "Vanguard — official ethics and integrity page, founder John C. Bogle"
              ),
          }
          sources = {
              "bogle-vanguard-1959.jpg": "https://investor.vanguard.com/content/retail/public/us/en/about-us/_jcr_content/root/container/container_1884309581_30279271/container_890438166/image.coreimg.jpeg/1773702033665/vg20250421-bogle-morgan-welch-1959.jpeg",
              "bogle-vanguard-1989.jpg": "https://corporate.vanguard.com/content/dam/corp/articles/images/50-years-50-facts-indexing/50_facts_fact_5.png",
              "bogle-vanguard-founder.jpg": "https://corporate.vanguard.com/content/dam/corp/what-we-care-about/images/ethics-and-integrity/WWCA_Ethics_John.jpg",
          }

          for filename in rows:
              path = Path("images") / filename
              with Image.open(path) as image:
                  image.verify()
              if path.stat().st_size < 10_000:
                  raise SystemExit(f"reviewed asset is unexpectedly small: {filename}")

          index = Path("images/images.txt")
          lines = index.read_text(encoding="utf-8").splitlines()
          present = {line.split("|", 1)[0].strip() for line in lines if "|" in line}
          for filename, row in rows.items():
              if filename not in present:
                  lines.append(row)
          index.write_text("\n".join(lines) + "\n", encoding="utf-8")

          ledger_path = Path("images/relevance.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          ledger["version"] = max(2, int(ledger.get("version", 1)))
          ledger["policy"] = (
              "Only DIRECT and STRONG_CONTEXT count. Unreviewed rt-* assets fail closed. "
              "Graphics, homonyms, generic filler and wrong entities do not count."
          )
          assets = ledger.setdefault("assets", {})
          for filename, source_url in sources.items():
              row = assets.setdefault(filename, {})
              row["stories"] = {story: "DIRECT"}
              row["source_url"] = source_url
          ledger_path.write_text(
              json.dumps(ledger, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Prove runtime coverage is 4 photos plus a logo
        run: |
          PYTHONPATH=. python - <<'PY'
          import story_runtime as sr
          story = "Jack Bogle: أنشأ صندوق المؤشرات ورفض أن يصبح ملياردير"
          photos, logos, status = sr.coverage(story)
          print("Bogle photos:", [p.name for p in photos])
          print("Bogle logos:", [p.name for p in logos])
          print("Bogle status:", status)
          if len(photos) < 4:
              raise SystemExit(f"expected >=4 approved Bogle photos, got {len(photos)}")
          if not logos:
              raise SystemExit("expected a verified Vanguard logo")
          if status != "PASS":
              raise SystemExit(f"Jack Bogle runtime coverage is not PASS: {status}")
          PY

      - name: Commit only the reviewed Bogle repair package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            images/images.txt \
            images/relevance.json \
            images/bogle-vanguard-1959.jpg \
            images/bogle-vanguard-1989.jpg \
            images/bogle-vanguard-founder.jpg
          if git diff --cached --quiet; then
            echo "Reviewed Bogle assets already present"
          else
            git commit -m "assets: port reviewed Jack Bogle visual repair"
            git push origin HEAD:main
          fi
