name: Publish the approved Wednesday school Story
on:
  push:
    branches: [main]
    paths: ['approved/wednesday-weekend-20261111/manifest.json']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Validate sealed Story and publish once
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          POST_TO_SNAPCHAT: '1'
          DRY_RUN: '0'
        run: |
          python -m publishing_v2.bundle_api validate --manifest approved/wednesday-weekend-20261111/manifest.json
          python -m publishing_v2.bundle_api publish --manifest approved/wednesday-weekend-20261111/manifest.json
