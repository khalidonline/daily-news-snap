name: Save four approved compact archive renewals
on:
  push:
    paths: ['.github/workflows/save-four-20261004.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  save:
    if: github.repository == 'khalidonline/daily-news-snap' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Complete four approved archive renewals 20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb73524c54e453e49b6f38a5838a15b3189b74cf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-v2-images.txt pytest
      - run: python -m pytest -q tests/test_v2_saved_story_api.py tests/test_saved_owner_package.py tests/test_v2_saved_replay.py
      - name: Check quota and receipts then save approved compact editions only
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import importlib.util,json,hashlib,os
          from pathlib import Path
          from datetime import datetime,timezone
          from publishing_v2.bundle_api import GitHubJournal,BundleError
          from publishing_v2.saved_story_api import SavedClient,SavedJournal,now
          from daily_budget import GitHubStore,day_key
          root=Path('approved/saved-stories/compact-five-20261003')
          selected=[]
          for item in json.loads((root/'index.json').read_text())['approvals']:
           if not item['approved']: continue
           a=json.loads(Path(item['path']).read_text())
           assert datetime.fromisoformat(a['not_before'].replace('Z','+00:00'))<=datetime.now(timezone.utc)<datetime.fromisoformat(a['expires_at'].replace('Z','+00:00'))
           assert hashlib.sha256(Path(a['source_manifest']).read_bytes()).hexdigest()==a['source_manifest_sha256']
           selected.append(a)
          assert len(selected)==4
          spec=importlib.util.spec_from_file_location('renew','approved/archive-renew-20261003-reserve2/save.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          for a in selected: mod.batch.validate(a)
          _,ledger=GitHubStore(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN']).read(day_key())
          if ledger is not None:
           entries=ledger.get('entries',{}).values()
           assert sum(e.get('charged_micro_usd',0)+(e.get('reserved_micro_usd',0) if e.get('status')!='settled' else 0) for e in entries)<=3000000
          print('LEDGER_PRESENT',ledger is not None,'NO_PAID_GENERATION',flush=True)
          c=SavedClient();c.check()
          print('LIVE_QUOTA',json.dumps(c.ensure_capacity(6)),flush=True)
          for a in selected:
           for r in a['source_rows']:
            live=c.call('/post/'+r['post_id']);snap=(live.get('data') or {}).get('SNAPCHAT') or {}
            assert live.get('status')=='POSTED' and live.get('teamId')==c.team and not live.get('deletedAt')
            assert snap.get('type','STORY')=='STORY' and snap.get('uploadIds')==[r['upload_id']]
          p=Path('/tmp/approved-four.json');p.write_text(json.dumps(selected))
          mod.A=p
          mod.main()
          j=GitHubJournal(selected[0]['source_identity']);j.path='/contents/saved-story-backlog.json';backlog=j.read()
          for a in selected:
           state=SavedJournal(a['identity']).read()
           ext=c.confirm(state['post_id'],a['title'],state['upload_ids'])['externalData']['SNAPCHAT']
           assert ext['status']=='PUBLISHED' and ext['type']=='SAVED_STORY' and ext['id'] and len(set(ext['mediaIds']))==2
           for row in backlog['packages']:
            if row.get('identity')==a['source_identity']:
             row['renewal'].update(status='POSTED',confirmed_at=now(),saved_story_id=ext['id'],post_id=state['post_id'],run_url='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'])
           print('CONFIRMED',json.dumps({'title':a['title'],'saved_story_id':ext['id']},ensure_ascii=False),flush=True)
          backlog['updated_at']=now();j.save(backlog)
          
          PY
