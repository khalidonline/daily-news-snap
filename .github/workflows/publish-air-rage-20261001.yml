name: Publish approved air rage package
on:
  push:
    paths: ['.github/workflows/publish-air-rage-20261001.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Publish approved air rage 20261001 dependency fix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e49f0a4bfbea5a23bfb0eefd3a1f686aedb05e99
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Decode and check approved window
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,json
          from datetime import datetime,timezone
          folder=Path('approved/air-rage-20261001')
          m=json.loads((folder/'manifest.json').read_text())
          now=datetime.now(timezone.utc)
          assert datetime.fromisoformat(m['not_before'].replace('Z','+00:00')) <= now < datetime.fromisoformat(m['expires_at'].replace('Z','+00:00')), 'Outside approval window'
          for p in folder.glob('*.jpg.b64'):
              p.with_suffix('').write_bytes(base64.b64decode(p.read_text(),validate=True))
          PY
          python -m publishing_v2.bundle_api validate --manifest approved/air-rage-20261001/manifest.json
      - name: Publish existing media with quota and receipt checks
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m publishing_v2.bundle_api publish --manifest approved/air-rage-20261001/manifest.json
          python - <<'PY'
          from publishing_v2.bundle_api import BundleClient,GitHubJournal,load_package
          import json
          identity,_,media=load_package('approved/air-rage-20261001/manifest.json')
          state=GitHubJournal(identity).read()
          c=BundleClient()
          ids=[]
          for i in range(1,5):
              row=state[str(i)]
              assert row['status']=='POSTED'
              post=c.call('/post/'+row['post_id'])
              assert post['status']=='POSTED'
              assert post['data']['SNAPCHAT']['storyDuration']=='ONE_WEEK'
              ids.append(row['post_id'])
          assert len(set(ids))==4
          print(json.dumps({'confirmed':4,'duration':'ONE_WEEK','post_ids':ids,'paid_model_requests':0}))
          PY
