name: Recover approved dates publication
on:
  push:
    paths: ['.github/workflows/dates-recover-20261004.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Recover approved dates 20261004 1230'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: 'f6a962c3cbd40956f3bc84a1653751746cf0ce36'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt -r requirements-v2-images.txt pytest
      - name: Test guarded recovery and validate sealed files
        run: |
          python -m pytest -q tests/test_v2_group_recovery.py tests/test_v2_bundle.py tests/test_v2_bundle_group.py
          python -m publishing_v2.bundle_api validate --manifest approved/dates-20261004/manifest.json
      - name: Budget record; no paid generation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,base64
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from publishing_v2.bundle_api import GitHubJournal,HTTPFailure
          j=GitHubJournal('d2ec1f199c92e70c4d5652675d5b39c6daac2f74f0412fd03d0d57024be0b355')
          day=datetime.now(ZoneInfo('Asia/Riyadh')).date().isoformat()
          try:
              r=j.call('/contents/daily/'+day+'.json?ref=cost-ledger')
              ledger=json.loads(base64.b64decode(r['content']))
              assert ledger['day']==day and isinstance(ledger['entries'],dict)
              total=sum(v.get('charged_micro_usd',0)+(v.get('reserved_micro_usd',0) if v.get('status')!='settled' else 0) for v in ledger['entries'].values())
              assert total<=3000000
              print('Ledger committed micro USD:',total)
          except HTTPFailure as e:
              if e.code!=404: raise
              print('Daily total UNKNOWN: no ledger. Incremental model/image-generation requests: 0.')
          PY
      - name: Reconcile, publish original uploads in order and verify each Snap
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m publishing_v2.group_recovery --manifest approved/dates-20261004/manifest.json
      - name: Verify actual remaining quota
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
        run: |
          python - <<'PY'
          import json
          from publishing_v2.bundle_api import BundleClient
          c=BundleClient();c.check()
          print(json.dumps(c.ensure_capacity(2)))
          PY
