name: Complete oil final card with operator reconciliation
on:
  push:
    paths: ['.github/workflows/complete-oil-20261002.yml']
permissions:
  contents: write
concurrency:
  group: executivesaudi-approved-api
  cancel-in-progress: false
jobs:
  complete:
    if: github.event.head_commit.message == 'Complete oil final card authorized 20261002 1530'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e1b26a7e364b7b9c7381dc930c0a588505f0abb0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-v2-images.txt
      - name: Reconcile and complete only missing card
        env:
          BUNDLE_API_KEY: ${{ secrets.BUNDLE_API_KEY }}
          BUNDLE_TEAM_ID: ${{ secrets.BUNDLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u - <<'PY'
          import json,time,urllib.parse,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          from publishing_v2.bundle_api import BundleClient,GitHubJournal,load_package,HTTPFailure
          IDENTITY='9c53d9412d9abd0fb339209b170da2336c5a72b07b214c4a57f2f017b13ef850'
          UPLOAD='cd8775b6-9dc3-4176-88e4-1f5c885cc9a5'
          path=Path('approved/oil-20261002/manifest.json')
          doc=json.loads(path.read_text())
          def window():
              now=datetime.now(timezone.utc)
              assert datetime.fromisoformat(doc['not_before'].replace('Z','+00:00'))<=now<datetime.fromisoformat(doc['expires_at'].replace('Z','+00:00'))
          window()
          identity,title,media=load_package(path);assert identity==IDENTITY and len(media)==4
          c=BundleClient();c.check();j=GitHubJournal(identity);state=j.read()
          assert set(state)=={'1','2','3','4'}
          for n in ['1','2','3']:
              r=state[n];assert r['status']=='POSTED'
              live=c.call('/post/'+r['post_id'])
              assert live['status']=='POSTED' and live['teamId']==c.team
              assert live['data']['SNAPCHAT']['uploadIds']==[r['upload_id']] and not live.get('deletedAt')
          r=state['4'];assert r['upload_id']==UPLOAD
          def inventory():
              rows=[];offset=0
              while True:
                  d=c.call('/post/?'+urllib.parse.urlencode({'teamId':c.team,'offset':offset,'limit':100}))
                  items=d.get('items');total=d.get('total')
                  assert isinstance(items,list) and type(total)is int
                  for x in items:
                      assert x['teamId']==c.team
                      rows.append(x)
                  offset+=len(items)
                  if offset>=total:break
                  assert items and offset<=10000
              assert len({x['id'] for x in rows})==len(rows)==total
              return rows
          def candidates(rows):
              exact=[] 
              for x in rows:
                  snap=(x.get('data') or {}).get('SNAPCHAT') or {}
                  ids=snap.get('uploadIds') or []
                  if UPLOAD in ids:
                      assert ids==[UPLOAD] and snap.get('type')=='STORY' and not x.get('deletedAt')
                      exact.append(x)
                  elif x.get('title')==title+' [4/4]':
                      raise RuntimeError('same_title_different_media_requires_review')
              assert len(exact)<=1
              return exact
          if not r.get('post_id'):
              assert not r.get('operator_retry_intent'), 'prior_operator_retry_ambiguous'
              a=inventory();found=candidates(a)
              evidence={'checked_at':datetime.now(timezone.utc).isoformat(),'inventory_total':len(a)}
              if not found:
                  time.sleep(15)
                  b=inventory();found=candidates(b)
                  evidence['second_inventory_total']=len(b)
                  evidence['second_checked_at']=datetime.now(timezone.utc).isoformat()
              if found:
                  r['post_id']=found[0]['id']
                  r['reconciliation']={'result':'existing_post_found','evidence':evidence}
                  j.save(state)
              else:
                  quota=c.ensure_capacity(1)
                  today=datetime.now(timezone.utc).date().isoformat()
                  current=[x for x in b if str(x.get('postDate','')).startswith(today)]
                  assert len(current)==11 and all(x.get('status')=='POSTED' and not x.get('deletedAt') for x in current), 'unexpected_today_inventory'
                  assert quota['posts']['used']==11, 'quota_does_not_match_confirmed_posts'
                  evidence.update(result='absent_in_two_complete_provider_inventories_and_quota_matches_11_confirmed_posts',quota=quota['posts'],today_post_ids=sorted(x['id'] for x in current))
                  r['reconciliation']=evidence
                  r['operator_retry_intent']={'at':datetime.now(timezone.utc).isoformat(),'authorization':'Khalid 2026-10-02 15:30:30 Riyadh: must complete oil package; reconcile first, resend missing card only','upload_id':UPLOAD,'attempt':1}
                  j.save(state)
                  window()
                  try:
                      r['post_id']=c.create(title+' [4/4]',UPLOAD)
                  except HTTPFailure as e:
                      r['operator_retry_error']={'http_status':e.code,'at':datetime.now(timezone.utc).isoformat()}
                      j.save(state);raise
                  j.save(state)
          c.wait(r['post_id'])
          live=c.call('/post/'+r['post_id'])
          assert live['teamId']==c.team and live['status']=='POSTED' and not live.get('deletedAt')
          assert live['data']['SNAPCHAT']['uploadIds']==[UPLOAD] and live['data']['SNAPCHAT']['storyDuration']=='ONE_WEEK'
          r['status']='POSTED';r['confirmed_at']=datetime.now(timezone.utc).isoformat();j.save(state)
          assert all(x['status']=='POSTED' for x in state.values()) and len({x['post_id'] for x in state.values()})==4
          print('CONFIRMED',json.dumps({'identity':identity,'confirmed_cards':4,'receipts':state},ensure_ascii=False))
          
          PY
