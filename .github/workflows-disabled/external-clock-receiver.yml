name: External schedule tick receiver

on:
  push:
    branches: [main]
    paths:
      - "scheduler/triggers/news.txt"
      - "scheduler/triggers/topic.txt"
      - "scheduler/triggers/story.txt"

permissions:
  contents: write

concurrency:
  group: external-schedule-tick-${{ github.sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Dispatch matching paid workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed="$(git show --pretty='' --name-only "$GITHUB_SHA")"
          else
            changed="$(git diff --name-only "$before" "$GITHUB_SHA")"
          fi

          for mapping in             "news:news-schedule"             "topic:topic-schedule"             "story:story-schedule"
          do
            bot="${mapping%%:*}"
            event_type="${mapping#*:}"
            trigger_path="scheduler/triggers/${bot}.txt"

            if grep -Fxq "$trigger_path" <<<"$changed"; then
              trigger_value="$(tail -n 1 "$trigger_path")"
              if [ "$bot" = "news" ] && [[ "$trigger_value" == *"recovery_story="* ]]; then
                encoded="${trigger_value##*recovery_story=}"
                recovery_slot="$(printf '%s' "$encoded" | base64 --decode | python3 -c 'import json, sys; print(json.load(sys.stdin).get("recovery_for_slot", ""))')"
                if [ -z "$recovery_slot" ]; then
                  echo "News recovery payload is missing recovery_for_slot" >&2
                  exit 1
                fi
                gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
                  -f event_type="news-recovery" \
                  -f "client_payload[story_b64]=${encoded}" \
                  -f "client_payload[slot]=${recovery_slot}"
                continue
              fi
              if [ "$bot" = "story" ] && [[ "$trigger_value" == recovery_story=* ]]; then
                encoded="${trigger_value#recovery_story=}"
                gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
                  -f event_type="story-recovery" \
                  -f "client_payload[story_b64]=${encoded}"
                continue
              fi
              if [ "$bot" = "topic" ] && [[ "$trigger_value" == recovery_brief=* ]]; then
                encoded="${trigger_value#recovery_brief=}"
                gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
                  -f event_type="topic-recovery" \
                  -f "client_payload[brief_b64]=${encoded}"
                continue
              fi
              requested_slot="$(awk 'NF { value=$1 } END { print value }' "$trigger_path")"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
                -f event_type="$event_type" \
                -f "client_payload[slot]=${requested_slot}"
            fi
          done
