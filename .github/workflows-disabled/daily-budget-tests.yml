name: Shared daily budget tests
on:
  push:
    paths: ['daily_budget.py', 'tests/test_daily_budget.py', '.github/workflows/daily-budget-tests.yml']
  pull_request:
    paths: ['daily_budget.py', 'tests/test_daily_budget.py', '.github/workflows/daily-budget-tests.yml']
permissions:
  contents: read
jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_daily_budget.py
