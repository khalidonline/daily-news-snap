name: External clock receiver tests

on:
  push:
    paths:
      - "tests/test_paid_workflow_policy.py"
      - ".github/workflows/external-clock-receiver.yml"
      - ".github/workflows/external-clock-receiver-tests.yml"
  pull_request:
    paths:
      - "tests/test_paid_workflow_policy.py"
      - ".github/workflows/external-clock-receiver.yml"
      - ".github/workflows/external-clock-receiver-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - name: Verify paid workflow and clock dispatch policy
        run: python -m unittest tests.test_paid_workflow_policy -v
