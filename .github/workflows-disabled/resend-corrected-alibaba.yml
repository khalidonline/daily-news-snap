name: Resend corrected Alibaba Story to Telegram

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/resend-corrected-alibaba.yml"

permissions:
  contents: read
  actions: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Story production code
        uses: actions/checkout@v4
        with:
          ref: repair/all-story-visuals-2026-08-29

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download frozen Alibaba Story
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p alibaba-artifact
          gh api repos/${{ github.repository }}/actions/artifacts/10042171957/zip > /tmp/alibaba-story.zip
          unzip -q /tmp/alibaba-story.zip -d alibaba-artifact
          test -f alibaba-artifact/out/story-review.json

      - name: Download exact 1995 Jack Ma photograph
        run: |
          curl --fail --location --retry 3 \
            "https://k.sinaimg.cn/n/sinacn20122/194/w535h459/20200228/be32-ipzreix2542005.jpg/w700d1q75cms.jpg" \
            --output /tmp/jack-ma-1995-tv.jpg
          python - <<'PY'
          from PIL import Image
          image = Image.open("/tmp/jack-ma-1995-tv.jpg")
          image.load()
          assert image.width >= 500 and image.height >= 400
          print("Verified 1995 Jack Ma photo:", image.size)
          PY

      - name: Rebuild frame 3 and verify six photos
        env:
          THEME: light
          FONT_FAMILY: Almarai
          STORY_FORMAT: riyadh-story-v1
          BRAND: ملخص تنفيذي - قصة
        run: |
          python repair_alibaba_frame3.py alibaba-artifact/out /tmp/jack-ma-1995-tv.jpg

      - name: Send corrected six-frame Story to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_TO_SNAPCHAT: "0"
          DRY_RUN: "0"
        run: |
          python send_approved_story.py alibaba-artifact/out/story-review.json
